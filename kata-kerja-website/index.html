const G = {};
G[1] = { t: 'To be: am, is, are',
guru: 'Kita mulai dari pondasi paling penting. Kalimat bahasa Inggris wajib punya kata kerja. Kalau tidak ada aksi (misalnya cuma bilang profesi, sifat, atau tempat), kita pakai to be sebagai jembatan. Bahasa Malaysia sama seperti bahasa Indonesia: tidak perlu jembatan itu. Jadi tugasmu hari ini satu saja: setiap mau bilang “saya QA”, ingat bahwa bahasa Inggris butuh “am”.',
en: { f: [['S + [am/is/are] + Kata benda', 'I am a QA engineer.'], ['S + [am/is/are] + Kata sifat', 'The server is slow.'], ['S + [am/is/are] + Keterangan tempat', 'The team is in the meeting room.']],
  tbl: [['I', 'am'], ['He / She / It / The server', 'is'], ['You / We / They / The servers', 'are']],
  ex: [['I am Dirwan. I am a QA engineer.', 'Saya Dirwan. Saya seorang QA engineer.'], ['My colleague is from Kuala Lumpur.', 'Rekan kerja saya dari Kuala Lumpur.'], ['The tests are ready.', 'Tes-tesnya sudah siap.']],
  salah: [['I QA engineer.', 'I am a QA engineer.', 'Wajib ada to be, dan profesi tunggal butuh a/an.'], ['The servers is down.', 'The servers are down.', 'Subjek jamak memakai are.']] },
ms: { f: [['Subjek + Kata benda', 'Saya jurutera QA.'], ['Subjek + [ialah/adalah] + Kata benda', 'Dia ialah pengurus projek.'], ['Subjek + Kata sifat', 'Pelayan itu perlahan.']],
  ex: [['Saya Dirwan, jurutera QA.', 'Saya Dirwan, QA engineer.'], ['Rakan sekerja saya dari Kuala Lumpur.', 'Rekan kerja saya dari Kuala Lumpur.'], ['Ujian sudah sedia.', 'Tesnya sudah siap.']],
  salah: [['Pelayan itu ialah perlahan.', 'Pelayan itu perlahan.', 'Ialah/adalah hanya dipakai sebelum kata benda, tidak sebelum kata sifat.']] },
trik: 'Hafalkan berpasangan: “I am, you are, dia is”. Satu orang atau satu benda selain I dan you selalu is.',
q: [['en', 'The servers ___ down.', ['is', 'are', 'am'], 1], ['en', 'I ___ a QA engineer.', ['am', 'is', 'are'], 0], ['ms', 'Pilih kalimat BM yang benar:', ['Pelayan itu ialah perlahan.', 'Pelayan itu perlahan.', 'Pelayan itu adalah perlahan.'], 1]] };

G[2] = { t: 'To be: negatif dan pertanyaan',
guru: 'Kemarin kita membangun kalimat positif. Hari ini kita belajar menyangkal dan bertanya, karena di kantor kita lebih sering bertanya: “Is the server up?” Kabar baiknya, to be itu mandiri: tidak butuh bantuan do/does. Cukup tambah not, atau pindahkan to be ke depan.',
en: { f: [['S + [am/is/are] + [not] + Pelengkap', 'The network is not stable.'], ['[Am/Is/Are] + S + Pelengkap + ?', 'Is the meeting room free?'], ['[Yes], S + [is]. / [No], S + [isn’t].', 'Yes, it is. No, it isn’t.']],
  tbl: [['is not', 'isn’t'], ['are not', 'aren’t'], ['am not', 'I’m not (tidak ada amn’t)']],
  ex: [['The office network isn’t stable today.', 'Jaringan kantor tidak stabil hari ini.'], ['Are you in the office? No, I’m at home.', 'Kamu di kantor? Tidak, saya di rumah.'], ['Is this your laptop?', 'Apakah ini laptopmu?']],
  salah: [['Do you are ready?', 'Are you ready?', 'To be tidak memakai do/does.'], ['He not is here.', 'He is not here.', 'Not diletakkan setelah to be.']] },
ms: { f: [['Subjek + [bukan] + Kata benda', 'Itu bukan pepijat.'], ['Subjek + [tidak] + Kata sifat', 'Rangkaian tidak stabil.'], ['[Adakah] + Subjek + Pelengkap + ?', 'Adakah bilik mesyuarat kosong?'], ['Kalimat + intonasi naik', 'Awak di pejabat?']],
  ex: [['Itu bukan pepijat, itu ciri.', 'Itu bukan bug, itu fitur.'], ['Adakah awak di pejabat hari ini?', 'Apakah kamu di kantor hari ini?'], ['Rangkaian pejabat tidak stabil.', 'Jaringan kantor tidak stabil.']],
  salah: [['Itu tidak pepijat.', 'Itu bukan pepijat.', 'Bukan untuk kata benda, tidak untuk kata sifat dan kerja.'], ['Apakah awak di pejabat?', 'Adakah awak di pejabat?', 'Di BM, “apakah” berarti “apa”. Pertanyaan ya/tidak memakai adakah.']] },
trik: 'Bayangkan to be sebagai pelompat: untuk bertanya, ia melompat ke depan kalimat. Untuk menyangkal, not menempel di belakangnya.',
q: [['en', '___ the meeting room free?', ['Do', 'Is', 'Are'], 1], ['en', 'They ___ ready yet.', ['isn’t', 'aren’t', 'don’t'], 1], ['ms', 'Itu ___ pepijat, itu ciri baharu.', ['tidak', 'bukan', 'belum'], 1], ['ms', 'Pertanyaan ya/tidak di BM diawali:', ['Adakah', 'Apakah', 'Bilakah'], 0]] };

G[3] = { t: 'Simple Present: kebiasaan dan fakta',
guru: 'Simple present adalah tense rutinitas: hal yang kamu lakukan setiap hari di kantor dan fakta tentang sistem. Satu-satunya jebakan: untuk he, she, it (termasuk “the server”, “my manager”), kata kerja diberi akhiran s atau es. Bahasa Malaysia tidak punya perubahan apa pun, jadi fokuskan energimu ke bahasa Inggris.',
en: { f: [['I/You/We/They + [V1] + O', 'We run tests every day.'], ['He/She/It + [V1 + s/es] + O', 'The server restarts every night.'], ['Penanda: [every day], [usually], [always], [often]', 'I usually check emails at nine.']],
  tbl: [['work → works', 'umumnya + s'], ['fix → fixes, watch → watches', 'akhiran s, sh, ch, x, o → + es'], ['try → tries', 'konsonan + y → ies'], ['have → has', 'tidak beraturan']],
  ex: [['I test the login page every morning.', 'Saya mengetes halaman login setiap pagi.'], ['Our team meets every Monday.', 'Tim kami rapat setiap Senin.'], ['The pipeline runs after every commit.', 'Pipeline berjalan setelah setiap commit.']],
  salah: [['She test the API.', 'She tests the API.', 'He/she/it → V + s.'], ['He haves a meeting.', 'He has a meeting.', 'Have berubah menjadi has.']] },
ms: { f: [['Subjek + Kata kerja + Objek', 'Kami jalankan ujian setiap hari.'], ['Subjek + [selalu/biasanya] + Kata kerja', 'Saya biasanya semak e-mel pukul sembilan.'], ['Dia/Mereka + Kata kerja (tidak berubah)', 'Dia menguji API setiap hari.']],
  ex: [['Pasukan kami bermesyuarat setiap hari Isnin.', 'Tim kami rapat setiap Senin.'], ['Saya biasanya semak e-mel pukul sembilan pagi.', 'Saya biasanya cek email jam sembilan pagi.'], ['Pelayan dimulakan semula setiap malam.', 'Server dinyalakan ulang setiap malam.']],
  salah: [['Saya mau cek email.', 'Saya nak semak e-mel.', 'Di Malaysia “cek” berarti cek bank. Pakai semak; “mau” jarang dipakai, ganti nak (santai) atau mahu (formal).']] },
trik: '“Dia suka S”: he, she, it suka huruf S di ujung kata kerja.',
q: [['en', 'She ___ the API every morning.', ['test', 'tests', 'testing'], 1], ['en', 'The pipeline ___ after every commit.', ['run', 'runs', 'running'], 1], ['ms', 'BM santai untuk “saya mau”:', ['saya nak', 'saya mau', 'saya ingin sekali'], 0]] };

G[4] = { t: 'Simple Present: negatif dan pertanyaan (do/does)',
guru: 'Kalau di kalimat ada kata kerja aksi (test, send, need), to be tidak bisa dipakai untuk bertanya. Kita butuh asisten bernama do dan does. Ingat aturan emasnya: begitu does muncul, huruf s di kata kerja pindah ke does.',
en: { f: [['S + [do not/does not] + [V1]', 'The app doesn’t support dark mode.'], ['[Do/Does] + S + [V1] + ?', 'Does the API return JSON?'], ['[Yes], S + [does]. / [No], S + [doesn’t].', 'Yes, it does.']],
  tbl: [['I/You/We/They', 'do / don’t'], ['He/She/It', 'does / doesn’t']],
  ex: [['I don’t understand this requirement.', 'Saya tidak paham requirement ini.'], ['Does the customer need a report every week?', 'Apakah pelanggan butuh laporan setiap minggu?'], ['We don’t deploy on Fridays.', 'Kami tidak deploy di hari Jumat.']],
  salah: [['She doesn’t tests it.', 'She doesn’t test it.', 'Setelah does/doesn’t, kata kerja kembali ke V1.'], ['Do he work here?', 'Does he work here?', 'He/she/it memakai does.']] },
ms: { f: [['Subjek + [tidak] + Kata kerja', 'Aplikasi ini tidak menyokong mod gelap.'], ['[Adakah] + Subjek + Kata kerja + ?', 'Adakah API ini memulangkan JSON?'], ['Kata kerja + [-kah] + Subjek + ?', 'Fahamkah awak?']],
  ex: [['Saya tidak faham keperluan ini.', 'Saya tidak paham kebutuhan ini.'], ['Adakah pelanggan perlukan laporan setiap minggu?', 'Apakah pelanggan butuh laporan setiap minggu?'], ['Kami tidak buat atur gerak pada hari Jumaat.', 'Kami tidak deploy di hari Jumat.']],
  salah: [['Saya tidak mengerti.', 'Saya tidak faham.', '“Mengerti” jarang dipakai di Malaysia.']] },
trik: '“Does mencuri S”: She works → She doesn’t work → Does she work?',
q: [['en', '___ the API return JSON?', ['Do', 'Does', 'Is'], 1], ['en', 'She doesn’t ___ on Fridays.', ['deploys', 'deploy', 'deploying'], 1], ['ms', '“Saya tidak mengerti” dalam BM yang lazim:', ['Saya tidak faham', 'Saya tak mengerti', 'Saya belum paham'], 0]] };

G[5] = { t: 'Artikel a, an, the dan bentuk jamak',
guru: 'Penutur Indonesia paling sering lupa a/an/the, karena bahasa kita tidak mewajibkannya. Padahal untuk laporan bug, artikel membuat kalimatmu terdengar profesional. Aturannya sederhana kalau kamu fokus pada bunyi, bukan huruf.',
en: { f: [['[a] + bunyi konsonan', 'a bug, a user, a test case'], ['[an] + bunyi vokal', 'an error, an hour, an API'], ['[the] + benda yang sudah jelas', 'I found a bug. The bug is on the login page.'], ['Kata benda + [s/es] = jamak', 'two bugs, three test cases']],
  ex: [['I found a bug and an error message.', 'Saya menemukan sebuah bug dan sebuah pesan error.'], ['The bug is on the login page.', 'Bug itu ada di halaman login.'], ['We have five test cases for this requirement.', 'Kami punya lima kasus uji untuk requirement ini.']],
  salah: [['I found bug.', 'I found a bug.', 'Benda tunggal yang bisa dihitung butuh a/an/the.'], ['a API', 'an API', 'API dibaca “ei-pi-ai”, diawali bunyi vokal.'], ['two test case', 'two test cases', 'Jamak → tambah s.']] },
ms: { f: [['[satu/sebuah/seorang] + Kata benda', 'Saya jumpa satu pepijat.'], ['Kata benda + [itu/ini] ≈ the', 'Pepijat itu di halaman log masuk.'], ['[beberapa/semua/angka] + Kata benda', 'Kami ada lima kes ujian.'], ['Kata benda + Kata benda (gandaan)', 'pelanggan-pelanggan']],
  ex: [['Saya jumpa satu pepijat di halaman log masuk.', 'Saya menemukan satu bug di halaman login.'], ['Pepijat itu sudah dibaiki.', 'Bug itu sudah diperbaiki.'], ['Semua kes ujian lulus.', 'Semua kasus uji lulus.']],
  salah: [['lima kes-kes ujian', 'lima kes ujian', 'Kalau sudah ada angka, jangan digandakan.']] },
trik: 'Dengar bunyinya: an hour (h tidak dibaca), a user (bunyi “yu”), an API (bunyi “ei”).',
q: [['en', 'I found ___ error in the log.', ['a', 'an', 'the'], 1], ['en', 'We have three ___.', ['test case', 'test cases', 'tests case'], 1], ['ms', 'Mana yang benar?', ['lima kes-kes ujian', 'lima kes ujian', 'lima-lima kes ujian'], 1]] };

G[6] = { t: 'Permintaan sopan: can, could, would, please',
guru: 'Di dunia kerja, cara meminta lebih penting dari tata bahasa sempurna. Kalimat yang sopan membuat klien dan atasan nyaman. Hari ini kamu belajar tiga tingkat kesopanan. Gunakan could sebagai standar ke klien dan atasan.',
en: { f: [['[Can/Could] + you + [V1] + ?', 'Could you send the report?'], ['[Would you mind] + [V-ing] + ?', 'Would you mind checking my test case?'], ['[Let’s] + [V1]', 'Let’s schedule a call.'], ['[Please] + [V1]', 'Please see the attachment.']],
  tbl: [['Can you…?', 'santai, ke teman'], ['Could you…?', 'sopan, ke atasan atau klien'], ['Would you mind…?', 'sangat sopan']],
  ex: [['Could you update the ticket, please?', 'Bisakah Anda memperbarui tiketnya?'], ['Can I join the meeting?', 'Boleh saya ikut rapat?'], ['Would you mind sharing your screen?', 'Apakah Anda keberatan berbagi layar?']],
  salah: [['Could you to send it?', 'Could you send it?', 'Setelah can/could, langsung V1 tanpa to.'], ['Please to check.', 'Please check.', 'Please + V1.']] },
ms: { f: [['[Boleh] + awak/anda + Kata kerja + ?', 'Boleh awak hantar laporan?'], ['[Sila] + Kata kerja', 'Sila lihat lampiran.'], ['[Tolong] + Kata kerja', 'Tolong semak kes ujian saya.'], ['[Mari kita/Jom] + Kata kerja', 'Jom jadualkan panggilan.']],
  ex: [['Boleh awak kemas kini tiket itu?', 'Bisakah kamu memperbarui tiket itu?'], ['Boleh saya sertai mesyuarat?', 'Boleh saya ikut rapat?'], ['Sila kongsi skrin anda.', 'Silakan bagikan layar Anda.']],
  salah: [['Silakan lihat lampiran.', 'Sila lihat lampiran.', 'Di Malaysia: sila, bukan silakan.']] },
trik: 'Makin panjang, makin sopan: Can → Could → Would you mind…? Di BM: tolong untuk minta bantuan, sila untuk mempersilakan.',
q: [['en', 'Could you ___ the report?', ['send', 'to send', 'sending'], 0], ['en', 'Would you mind ___ my code?', ['check', 'to check', 'checking'], 2], ['ms', '“Silakan lihat lampiran” dalam BM:', ['Sila lihat lampiran', 'Silakan lihat lampiran', 'Tolong lihatlah lampiran'], 0]] };

G[8] = { t: 'Present Continuous: sedang berlangsung',
guru: 'Minggu ini kita masuk dunia rapat dan status kerja. Pertanyaan favorit manajer adalah “What are you working on?” Jawabannya pakai present continuous. Rumusnya dua bagian yang tidak boleh dipisah: to be dan V-ing.',
en: { f: [['S + [am/is/are] + [V-ing]', 'I am testing the payment flow.'], ['S + [am/is/are] + [not] + [V-ing]', 'The server isn’t responding.'], ['[Am/Is/Are] + S + [V-ing] + ?', 'Are you joining the call?'], ['Penanda: [now], [right now], [currently]', 'We are currently fixing the bug.']],
  ex: [['I’m testing the new release right now.', 'Saya sedang mengetes rilis baru sekarang.'], ['The team is preparing the agenda.', 'Tim sedang menyiapkan agenda.'], ['Is anyone using the staging server?', 'Apakah ada yang sedang memakai server staging?']],
  salah: [['I testing now.', 'I am testing now.', 'Wajib to be + V-ing.'], ['I am knowing.', 'I know.', 'Kata kerja pikiran dan perasaan (know, need, want, like) biasanya tidak memakai -ing.']] },
ms: { f: [['Subjek + [sedang] + Kata kerja', 'Saya sedang menguji aliran pembayaran.'], ['Subjek + [tidak] + Kata kerja + [sekarang]', 'Pelayan tidak bertindak balas sekarang.'], ['[Adakah] + Subjek + [sedang] + Kata kerja + ?', 'Adakah awak sedang guna pelayan staging?']],
  ex: [['Saya sedang uji keluaran baharu.', 'Saya sedang mengetes rilis baru.'], ['Pasukan sedang menyediakan agenda.', 'Tim sedang menyiapkan agenda.'], ['Siapa yang sedang guna pelayan staging?', 'Siapa yang sedang memakai server staging?']],
  salah: [['Saya lagi meeting.', 'Saya sedang bermesyuarat.', '“Lagi” untuk arti sedang tidak lazim di Malaysia.']] },
trik: '“Sedang = to be + ing”, seperti sepasang sepatu: dua-duanya wajib dipakai.',
q: [['en', 'I ___ the new release right now.', ['test', 'am testing', 'tested'], 1], ['en', 'Pilih yang benar:', ['I am knowing the answer.', 'I know the answer.', 'I knowing the answer.'], 1], ['ms', '“Saya lagi rapat” dalam BM:', ['Saya sedang bermesyuarat', 'Saya lagi mesyuarat', 'Saya masih rapat'], 0]] };

G[9] = { t: 'Simple Past: was dan were',
guru: 'Saatnya bercerita tentang kemarin. Untuk kalimat tanpa aksi di masa lampau (keadaan, status), am/is berubah menjadi was dan are menjadi were. Status deployment kemarin? “It was successful.”',
en: { f: [['I/He/She/It + [was] + Pelengkap', 'The server was down yesterday.'], ['You/We/They + [were] + Pelengkap', 'We were in a meeting.'], ['S + [wasn’t/weren’t] + Pelengkap', 'The build wasn’t stable.'], ['[Was/Were] + S + Pelengkap + ?', 'Were you at the stand-up?']],
  tbl: [['am / is', 'was'], ['are', 'were']],
  ex: [['The deployment was successful.', 'Deployment-nya berhasil.'], ['We were very busy last week.', 'Kami sangat sibuk minggu lalu.'], ['Was the environment ready yesterday?', 'Apakah environment-nya siap kemarin?']],
  salah: [['We was busy.', 'We were busy.', 'We memakai were.'], ['Yesterday the server is down.', 'Yesterday the server was down.', 'Ada yesterday → past.']] },
ms: { f: [['Subjek + Pelengkap + [Keterangan lampau]', 'Pelayan itu rosak semalam.'], ['Penanda: [semalam], [tadi], [minggu lepas]', 'Kami sangat sibuk minggu lepas.']],
  ex: [['Atur gerak semalam berjaya.', 'Deployment kemarin berhasil.'], ['Kami sangat sibuk minggu lepas.', 'Kami sangat sibuk minggu lalu.'], ['Persekitaran itu sudah sedia semalam?', 'Environment itu sudah siap kemarin?']],
  salah: [['kemarin', 'semalam', 'Di Malaysia “semalam” berarti kemarin. Tadi malam = malam tadi.']] },
trik: '“wAs = sAtu”: was untuk satu orang/benda (kecuali you), were untuk banyak dan you.',
q: [['en', 'We ___ in a meeting yesterday.', ['was', 'were', 'are'], 1], ['en', 'The deployment ___ successful last night.', ['is', 'was', 'were'], 1], ['ms', '“Kemarin” dalam Bahasa Malaysia:', ['semalam', 'malam tadi', 'esok'], 0]] };

G[10] = { t: 'Simple Past: kata kerja beraturan (-ed)',
guru: 'Untuk aksi di masa lampau, kata kerja beraturan cukup ditambah -ed. Yang sering salah justru cara mengucapkannya. Penutur Indonesia cenderung membaca “fixed” jadi “fik-sed”. Hari ini kita perbaiki dengan tiga aturan bunyi.',

  ex: [['I reported the bug yesterday afternoon.', 'Saya melaporkan bug itu kemarin sore.'], ['The developer fixed it last night.', 'Developer memperbaikinya tadi malam.'], ['We tested the release and updated the documentation.', 'Kami mengetes rilis dan memperbarui dokumentasi.']],
  salah: [['I report the bug yesterday.', 'I reported the bug yesterday.', 'Yesterday → V2.'], ['fixed dibaca “fik-sed”', 'fixed dibaca “fikst”', 'Hanya akhiran t/d yang menambah suku kata.']] },
ms: { f: [['Subjek + [sudah/telah] + Kata kerja', 'Saya sudah laporkan pepijat itu.'], ['Subjek + Kata kerja + [Keterangan lampau]', 'Pembangun membaikinya malam tadi.']],
  ex: [['Saya telah melaporkan pepijat itu semalam.', 'Saya sudah melaporkan bug itu kemarin.'], ['Pembangun sudah membaikinya malam tadi.', 'Developer sudah memperbaikinya tadi malam.'], ['Kami telah menguji keluaran dan mengemas kini dokumentasi.', 'Kami sudah mengetes rilis dan memperbarui dokumentasi.']],
  salah: [['sudah memperbaiki', 'sudah membaiki', 'Kata dasar BM: baiki → membaiki, dibaiki.']] },
trik: '“T-D jadi ID”: hanya kata berakhiran bunyi t atau d yang bertambah suku kata (tes-tid). Selain itu, -ed nyaris tak terdengar.',
q: [['en', 'I ___ the bug yesterday.', ['report', 'reported', 'reporting'], 1], ['en', '“tested” dibaca:', ['test', 'tes-tid', 'tes-ted-ed'], 1], ['ms', '“Sudah memperbaiki” dalam BM:', ['sudah membaiki', 'sudah memperbaikan', 'sudah perbaikkan'], 0]] };

G[11] = { t: 'Simple Past: kata kerja tak beraturan dan did',
guru: 'Beberapa kata kerja paling penting justru tidak beraturan: find, write, send, run. Jangan hafal seratus sekaligus. Hafalkan delapan yang paling sering kamu pakai di kerja, lalu ingat bahwa did bekerja persis seperti does: ia mengambil bentuk lampau.',

  tbl: [['find → found', 'menemukan'], ['write → wrote', 'menulis'], ['run → ran', 'menjalankan'], ['send → sent', 'mengirim'], ['make → made', 'membuat'], ['break → broke', 'merusak'], ['go → went', 'pergi'], ['see → saw', 'melihat']],

  salah: [['I didn’t found it.', 'I didn’t find it.', 'Setelah did/didn’t → V1.'], ['Did you sent it?', 'Did you send it?', 'Did sudah membawa makna lampau.']] },
ms: { f: [['Subjek + [tidak] + Kata kerja + [lampau]', 'Ujian itu tidak lulus semalam.'], ['[Adakah] + Subjek + [sudah] + Kata kerja + ?', 'Adakah awak sudah hantar laporan?'], ['Jawaban: [Sudah] / [Belum]', 'Belum, saya hantar petang ini.']],
  ex: [['Saya jumpa punca utamanya pagi tadi.', 'Saya menemukan akar masalahnya tadi pagi.'], ['Ujian itu tidak lulus di Chrome.', 'Tes itu tidak lulus di Chrome.'], ['Adakah awak sudah hantar laporan?', 'Apakah kamu sudah mengirim laporan?']],
  salah: [['Tidak sudah.', 'Belum.', 'Jawaban negatif untuk “sudah?” adalah belum.']] },
trik: '“Did mencuri past”: sama seperti does mencuri s. Did/didn’t + V1, selalu.',
q: [['en', 'I ___ a bug in the checkout page.', ['find', 'found', 'finded'], 1], ['en', '___ you send the report?', ['Do', 'Did', 'Was'], 1], ['en', 'The test didn’t ___.', ['passed', 'pass', 'passing'], 1], ['ms', 'Jawaban negatif untuk “Adakah awak sudah hantar?”', ['Belum', 'Tidak sudah', 'Bukan'], 0]] };

G[12] = { t: 'Future: will dan be going to',
guru: 'Estimasi dan janji adalah bahasa sehari-hari tim dev. Bahasa Inggris punya dua cara bicara masa depan, dan perbedaannya sederhana: will untuk keputusan spontan atau janji, going to untuk rencana yang sudah diputuskan. Bahasa Malaysia cukup pakai akan.',
en: { f: [['S + [will] + [V1]', 'I will send the report tomorrow.'], ['S + [am/is/are going to] + [V1]', 'We are going to deploy on Friday.'], ['S + [won’t] + [V1]', 'It won’t take long.'], ['[Will] + S + [V1] + ?', 'Will you join the demo?']],
  tbl: [['will', 'spontan, janji, prediksi'], ['be going to', 'rencana yang sudah diputuskan']],
  ex: [['Don’t worry, I’ll check it now.', 'Tenang, saya cek sekarang.'], ['We’re going to release version 2.0 next month.', 'Kami akan merilis versi 2.0 bulan depan.'], ['It won’t affect the production server.', 'Itu tidak akan memengaruhi server produksi.']],
  salah: [['I will sending it.', 'I will send it.', 'Will + V1.'], ['I going to test.', 'I am going to test.', 'Going to butuh to be.']] },
ms: { f: [['Subjek + [akan] + Kata kerja', 'Saya akan hantar laporan esok.'], ['Subjek + [tidak akan] + Kata kerja', 'Ia tidak akan ambil masa yang lama.'], ['Penanda: [esok], [lusa], [minggu depan]', 'Kami akan buat atur gerak minggu depan.']],
  ex: [['Jangan risau, saya akan semak sekarang.', 'Tenang, saya akan cek sekarang.'], ['Kami akan lancarkan versi 2.0 bulan depan.', 'Kami akan merilis versi 2.0 bulan depan.'], ['Ia tidak akan menjejaskan pelayan produksi.', 'Itu tidak akan memengaruhi server produksi.']],
  salah: [['besok', 'esok', 'BM memakai esok untuk besok.']] },
trik: 'Kalau tiketnya sudah ada di Jira, pakai going to. Kalau baru terpikir sekarang, pakai will.',
q: [['en', '(Sudah dijadwalkan) We ___ deploy on Friday.', ['will', 'are going to', 'going'], 1], ['en', 'I will ___ the report.', ['sending', 'send', 'sent'], 1], ['ms', '“Besok” dalam BM:', ['esok', 'besok', 'lusa'], 0]] };

G[13] = { t: 'Kata tanya: what, where, when, who, why, how',
guru: 'QA yang hebat adalah penanya yang hebat. Kata tanya membuka informasi: kapan bug muncul, di mana log disimpan, siapa yang merusak build. Rumusnya: kata tanya di depan, lalu ikuti pola pertanyaan yang sudah kamu kenal.',
en: { f: [['[WH] + [do/does] + S + [V1] + ?', 'Where do you store the logs?'], ['[WH] + [am/is/are] + S + ?', 'What is the expected result?'], ['[WH] + [did] + S + [V1] + ?', 'When did the bug start?'], ['[Who] + [V2] + ? (who sebagai pelaku)', 'Who broke the build?']],
  tbl: [['What', 'apa'], ['Where', 'di mana'], ['When', 'kapan'], ['Who', 'siapa'], ['Why', 'mengapa'], ['How', 'bagaimana'], ['How many / How much', 'berapa (bisa dihitung / tidak)']],
  ex: [['What is the expected result?', 'Apa hasil yang diharapkan?'], ['Why did the test fail?', 'Kenapa tesnya gagal?'], ['How many bugs did we find?', 'Berapa banyak bug yang kita temukan?']],
  salah: [['Who did break the build?', 'Who broke the build?', 'Jika who adalah pelaku, tidak pakai did.'], ['Where you store the logs?', 'Where do you store the logs?', 'Butuh do/does/did.']] },
ms: { f: [['[Apa/Apakah] + ... + ?', 'Apakah keputusan yang dijangka?'], ['[Bila] + ... + ? (= kapan)', 'Bila pepijat ini bermula?'], ['[Kenapa/Mengapa] + ... + ?', 'Kenapa ujian itu gagal?'], ['[Berapa] + ... + ?', 'Berapa banyak pepijat yang kita jumpa?']],
  ex: [['Di mana awak simpan log?', 'Di mana kamu menyimpan log?'], ['Bila mesyuarat bermula?', 'Kapan rapat dimulai?'], ['Siapa yang rosakkan binaan?', 'Siapa yang merusak build?']],
  salah: [['Kapan mesyuarat?', 'Bila mesyuarat?', 'Di Malaysia hampir selalu memakai bila.']] },
trik: 'Urutan “T-A-S-V”: Tanya + Auxiliary (do/is/did) + Subjek + Verb. Where + do + you + store?',
q: [['en', 'Where ___ you store the logs?', ['do', 'does', 'are'], 0], ['en', 'Who ___ the build?', ['did break', 'broke', 'breaks did'], 1], ['ms', '“Kapan rapat dimulai?” dalam BM:', ['Bila mesyuarat bermula?', 'Kapan mesyuarat bermula?', 'Apakah mesyuarat bermula?'], 0]] };
G[15] = { t: 'Present Perfect: sudah, pernah, belum',
guru: 'Present perfect menghubungkan masa lalu dengan sekarang: aksinya sudah terjadi, hasilnya masih terasa. Ini tense favorit untuk update status ke klien: “I have sent the proposal.” Kamu tidak menyebut kapan, karena yang penting adalah hasilnya sekarang.',
en: { f: [['S + [have/has] + [V3]', 'I have finished the test cases.'], ['S + [haven’t/hasn’t] + [V3] + [yet]', 'The client hasn’t replied yet.'], ['[Have/Has] + S + [ever] + [V3] + ?', 'Have you ever used Playwright?'], ['Penanda: [already], [just], [yet], [ever], [never]', 'We have just sent the proposal.']],
  tbl: [['send → sent → sent', 'V1 → V2 → V3'], ['write → wrote → written', ''], ['do → did → done', ''], ['be → was/were → been', '']],
  ex: [['I’ve already sent the quotation.', 'Saya sudah mengirim penawaran harga.'], ['The client hasn’t signed the contract yet.', 'Klien belum menandatangani kontraknya.'], ['Have you ever worked with a foreign client?', 'Pernahkah kamu bekerja dengan klien luar negeri?']],
  salah: [['I have send it.', 'I have sent it.', 'Have + V3.'], ['She have finished.', 'She has finished.', 'He/she/it memakai has.'], ['I have sent it yesterday.', 'I sent it yesterday.', 'Kalau waktunya disebut spesifik, pakai simple past.']] },
ms: { f: [['Subjek + [sudah/telah] + Kata kerja', 'Saya sudah hantar sebut harga.'], ['Subjek + [belum] + Kata kerja + [lagi]', 'Pelanggan belum tandatangan kontrak lagi.'], ['[Pernahkah] + Subjek + Kata kerja + ?', 'Pernahkah awak bekerja dengan pelanggan asing?'], ['Subjek + [baru sahaja] + Kata kerja', 'Kami baru sahaja hantar cadangan.']],
  ex: [['Saya sudah hantar sebut harga.', 'Saya sudah mengirim penawaran harga.'], ['Pelanggan belum tandatangan kontrak lagi.', 'Klien belum menandatangani kontrak.'], ['Pernahkah awak bekerja dengan pelanggan asing?', 'Pernahkah kamu bekerja dengan klien asing?']],
  salah: [['baru saja', 'baru sahaja', 'Bentuk baku BM: sahaja.']] },
trik: '“Have + V3 = sudah yang masih terasa.” Begitu ada yesterday atau last week, pindah ke simple past.',
q: [['en', 'I have ___ the test cases.', ['finish', 'finished', 'finishing'], 1], ['en', 'The client ___ replied yet.', ['hasn’t', 'didn’t', 'isn’t'], 0], ['ms', '“Klien belum membalas” dalam BM yang alami:', ['Pelanggan belum balas lagi', 'Pelanggan tidak sudah balas', 'Pelanggan bukan balas'], 0]] };

G[16] = { t: 'Present Perfect vs Simple Past, for dan since',
guru: 'Dua tense ini sering tertukar. Pegangannya: kalau kamu menyebut waktu spesifik di masa lalu, pakai simple past. Kalau tidak menyebut waktu, atau kejadiannya berlangsung sampai sekarang, pakai present perfect. Ini sangat berguna saat negosiasi: “We have worked with you for three years.”',
en: { f: [['S + [V2] + [waktu spesifik]', 'We signed the contract last week.'], ['S + [have/has] + [V3] (tanpa waktu)', 'We have signed the contract.'], ['S + [have/has] + [V3] + [for] + durasi', 'I have worked here for three years.'], ['S + [have/has] + [V3] + [since] + titik waktu', 'The price has changed since January.']],
  tbl: [['for', 'lamanya: for two hours, for three years'], ['since', 'titik awal: since Monday, since 2020']],
  ex: [['We negotiated the price yesterday.', 'Kami menegosiasikan harga kemarin.'], ['We have negotiated a better price.', 'Kami sudah mendapat harga yang lebih baik.'], ['I have worked in QA for five years.', 'Saya sudah bekerja di QA selama lima tahun.'], ['The budget has increased since January.', 'Anggaran sudah naik sejak Januari.']],
  salah: [['I work here since 2020.', 'I have worked here since 2020.', 'Since/for sampai sekarang → present perfect.'], ['for Monday', 'since Monday', 'Since + titik waktu, for + lamanya.']] },
ms: { f: [['Subjek + Kata kerja + [selama] + tempoh', 'Saya bekerja di sini selama tiga tahun.'], ['Subjek + [sudah] + Kata kerja + [sejak] + waktu', 'Harga sudah berubah sejak Januari.'], ['Subjek + Kata kerja + waktu + [lepas]', 'Kami tandatangan kontrak minggu lepas.']],
  ex: [['Kami berunding tentang harga semalam.', 'Kami menegosiasikan harga kemarin.'], ['Saya sudah bekerja dalam QA selama lima tahun.', 'Saya sudah bekerja di QA selama lima tahun.'], ['Belanjawan sudah meningkat sejak Januari.', 'Anggaran sudah naik sejak Januari.']],
  salah: [['minggu lalu', 'minggu lepas', 'BM sehari-hari lebih sering memakai lepas.']] },
trik: '“FOR = berapa lama, SINCE = sejak kapan.” For three years, since 2020.',
q: [['en', 'I have worked here ___ three years.', ['since', 'for', 'from'], 1], ['en', 'We ___ the contract last week.', ['have signed', 'signed', 'sign'], 1], ['ms', '“Minggu lalu” dalam BM sehari-hari:', ['minggu lepas', 'minggu kelmarin', 'minggu dahulu kala'], 0]] };

G[17] = { t: 'Perbandingan: -er, more, the most',
guru: 'Meyakinkan stakeholder berarti membandingkan opsi: mana yang lebih murah, lebih cepat, paling aman. Kuncinya ada di jumlah suku kata. Kata pendek ditambah -er, kata panjang diberi more.',
en: { f: [['Adj pendek + [-er] + [than]', 'Version 2 is faster than version 1.'], ['[more] + Adj panjang + [than]', 'This plan is more expensive than the old one.'], ['[the] + Adj + [-est] / [the most] + Adj', 'This is the most important feature.'], ['[as] + Adj + [as]', 'The new server is as stable as the old one.']],
  tbl: [['fast → faster → the fastest', '1 suku kata'], ['important → more important → the most important', '3 suku kata atau lebih'], ['good → better → the best', 'tidak beraturan'], ['bad → worse → the worst', 'tidak beraturan']],
  ex: [['Our price is lower than our competitor’s.', 'Harga kami lebih rendah dari kompetitor.'], ['This is the best option for your budget.', 'Ini opsi terbaik untuk anggaran Anda.'], ['Option B is more flexible than option A.', 'Opsi B lebih fleksibel dari opsi A.']],
  salah: [['more faster', 'faster', 'Pilih salah satu: -er ATAU more.'], ['the most fast', 'the fastest', 'Kata pendek → -est.']] },
ms: { f: [['[lebih] + Kata sifat + [daripada]', 'Versi 2 lebih laju daripada versi 1.'], ['[paling] + Kata sifat / [ter-] + Kata sifat', 'Ini ciri yang paling penting.'], ['[sama] + Kata sifat + [dengan]', 'Pelayan baharu sama stabil dengan yang lama.']],
  ex: [['Harga kami lebih rendah daripada pesaing.', 'Harga kami lebih rendah dari pesaing.'], ['Ini pilihan terbaik untuk belanjawan anda.', 'Ini opsi terbaik untuk anggaran Anda.'], ['Pilihan B lebih fleksibel daripada pilihan A.', 'Opsi B lebih fleksibel dari opsi A.']],
  salah: [['lebih cepat dari', 'lebih laju daripada', 'BM baku memakai daripada untuk perbandingan; laju = cepat.']] },
trik: '“Pendek pakai ER, panjang pakai MORE.” Hitung suku kata: fast (1) → faster; ex-pen-sive (3) → more expensive.',
q: [['en', 'Version 2 is ___ than version 1.', ['more fast', 'faster', 'fastest'], 1], ['en', 'This is ___ important feature.', ['the most', 'most', 'the more'], 0], ['ms', 'Perbandingan baku BM:', ['lebih laju daripada', 'lebih laju dari', 'paling laju daripada'], 0]] };

G[18] = { t: 'Kalimat pasif: be + V3',
guru: 'Laporan bug dan insiden sering memakai kalimat pasif, karena yang penting adalah apa yang terjadi pada sistem, bukan siapa pelakunya. “The vulnerability was fixed.” Kabar baik untukmu: bahasa Malaysia memakai awalan di- persis seperti bahasa Indonesia.',
en: { f: [['O + [am/is/are] + [V3]', 'The data is encrypted.'], ['O + [was/were] + [V3]', 'The vulnerability was fixed yesterday.'], ['O + [has/have been] + [V3]', 'The patch has been deployed.'], ['... + [by] + pelaku (opsional)', 'The bug was reported by a customer.']],
  ex: [['Passwords are stored as hashes.', 'Kata sandi disimpan sebagai hash.'], ['The critical vulnerability was fixed last night.', 'Kerentanan kritis diperbaiki tadi malam.'], ['All test cases have been executed.', 'Semua kasus uji sudah dijalankan.']],
  salah: [['The bug was fix.', 'The bug was fixed.', 'Pasif butuh V3.'], ['The data encrypted.', 'The data is encrypted.', 'Pasif butuh to be.']] },
ms: { f: [['Objek + [di-] + Kata kerja', 'Kata laluan disimpan sebagai hash.'], ['Objek + [telah/sudah] + [di-] + Kata kerja', 'Kerentanan itu telah dibaiki.'], ['... + [oleh] + pelaku', 'Pepijat itu dilaporkan oleh pelanggan.']],
  ex: [['Kata laluan disimpan sebagai hash.', 'Kata sandi disimpan sebagai hash.'], ['Kerentanan kritikal itu dibaiki malam tadi.', 'Kerentanan kritis itu diperbaiki tadi malam.'], ['Semua kes ujian telah dijalankan.', 'Semua kasus uji sudah dijalankan.']],
  salah: [['diperbaiki', 'dibaiki', 'Kata dasar BM: baiki → dibaiki.']] },
trik: '“Pasif = to be + V3.” Padanannya di BM: awalan di-. Kamu sudah memakainya setiap hari dalam bahasa Indonesia.',
q: [['en', 'The vulnerability ___ yesterday.', ['fixed', 'was fixed', 'is fix'], 1], ['en', 'All test cases have ___ executed.', ['be', 'been', 'being'], 1], ['ms', '“Bug itu sudah diperbaiki” dalam BM:', ['Pepijat itu sudah dibaiki', 'Pepijat itu sudah diperbaikan', 'Pepijat itu sudah baiki'], 0]] };

G[19] = { t: 'Past Continuous: sedang … ketika',
guru: 'Saat menceritakan insiden, kamu sering butuh dua lapis waktu: aksi panjang yang sedang berjalan, lalu tiba-tiba dipotong kejadian singkat. “I was testing when the server crashed.” Bayangkan film panjang yang dipotong iklan.',
en: { f: [['S + [was/were] + [V-ing]', 'I was running the tests at ten.'], ['[was/were + V-ing] + [when] + [V2]', 'I was testing when the server crashed.'], ['[While] + [was/were + V-ing], S + [V2]', 'While we were deploying, the pipeline failed.']],
  ex: [['I was writing test scripts when you called.', 'Saya sedang menulis skrip tes waktu kamu menelepon.'], ['The pipeline failed while we were deploying.', 'Pipeline gagal saat kami sedang deploy.'], ['What were you doing at nine?', 'Kamu sedang apa jam sembilan?']],
  salah: [['I was test when it crashed.', 'I was testing when it crashed.', 'Was + V-ing.'], ['When I was testing, the server was crashing.', 'When I was testing, the server crashed.', 'Kejadian singkat yang memotong → V2.']] },
ms: { f: [['Subjek + [sedang] + Kata kerja + [ketika/semasa] + kejadian', 'Saya sedang menguji ketika pelayan rosak.'], ['[Semasa] + Subjek + Kata kerja, ...', 'Semasa kami membuat atur gerak, saluran paip gagal.']],
  ex: [['Saya sedang menulis skrip ujian semasa awak telefon.', 'Saya sedang menulis skrip tes waktu kamu menelepon.'], ['Saluran paip gagal semasa kami membuat atur gerak.', 'Pipeline gagal saat kami deploy.'], ['Awak sedang buat apa pada pukul sembilan?', 'Kamu sedang apa jam sembilan?']],
  salah: [['waktu', 'semasa / ketika', '“Semasa” sangat lazim di BM untuk “ketika”.']] },
trik: '“Film dipotong iklan”: film panjang = was/were + ing, iklan yang memotong = V2.',
q: [['en', 'I ___ the tests when the server crashed.', ['ran', 'was running', 'am running'], 1], ['en', 'While we were deploying, the pipeline ___.', ['was failing', 'failed', 'fails'], 1], ['ms', 'Kata hubung BM untuk “ketika”:', ['semasa', 'sewaktu-waktu', 'selagi'], 0]] };

G[20] = { t: 'Kalimat pengandaian tipe 1: if … will',
guru: 'Bisnis penuh dengan syarat dan konsekuensi: kalau harga naik, kita cari pemasok baru. Pengandaian tipe 1 dipakai untuk hal yang realistis terjadi. Aturan terpentingnya: setelah if jangan pakai will.',
en: { f: [['[If] + S + [V1/Vs], S + [will] + [V1]', 'If the price increases, we will find a new supplier.'], ['S + [will] + [V1] + [if] + S + [V1/Vs]', 'We will reach the target if sales grow.'], ['[Unless] = if … not', 'We won’t sign unless the price is right.']],
  ex: [['If you send the invoice today, we will pay next week.', 'Kalau kamu kirim fakturnya hari ini, kami bayar minggu depan.'], ['If the test fails, the pipeline will stop.', 'Kalau tesnya gagal, pipeline akan berhenti.'], ['We will lose profit unless we cut costs.', 'Kita akan rugi kecuali kita memangkas biaya.']],
  salah: [['If it will fail, …', 'If it fails, …', 'Setelah if → present.']] },
ms: { f: [['[Jika/Kalau] + syarat, Subjek + [akan] + Kata kerja', 'Jika harga naik, kami akan cari pembekal baharu.'], ['… + [kecuali] + syarat', 'Kami tidak akan tandatangan kecuali harganya sesuai.']],
  ex: [['Jika awak hantar invois hari ini, kami akan bayar minggu depan.', 'Kalau kamu kirim faktur hari ini, kami bayar minggu depan.'], ['Kalau ujian gagal, saluran paip akan berhenti.', 'Kalau tes gagal, pipeline akan berhenti.'], ['Kita akan rugi kecuali kita kurangkan kos.', 'Kita akan rugi kecuali kita kurangi biaya.']],
  salah: [['Jika …, maka …', 'Jika …, …', '“Maka” boleh, tetapi terasa kaku dalam percakapan.']] },
trik: '“IF tidak suka WILL”: will hanya boleh muncul di bagian hasil, bukan di bagian syarat.',
q: [['en', 'If the test ___, the pipeline will stop.', ['will fail', 'fails', 'failed'], 1], ['en', 'We won’t sign ___ the price is right.', ['if', 'unless', 'when'], 1], ['ms', 'Versi formal “Kalau harga naik, kami akan …”:', ['Jika harga naik, kami akan …', 'Jikalau harga naik maka kami telah …', 'Kalau-kalau harga naik …'], 0]] };

G[22] = { t: 'Rencana ke depan: present continuous dan will be V-ing',
guru: 'Saat presentasi, kamu sering bicara tentang agenda dan langkah berikutnya. Untuk rencana yang sudah pasti di kalender, penutur asli memakai present continuous, bukan will. Ini mirip cara kita bilang “Besok saya ketemu klien”.',
en: { f: [['S + [am/is/are] + [V-ing] + waktu depan', 'I’m presenting the results on Thursday.'], ['S + [will be] + [V-ing]', 'At three, I’ll be presenting to the client.'], ['[Shall we] + [V1] + ?', 'Shall we agree on the next steps?']],
  ex: [['I’m meeting the client tomorrow morning.', 'Saya bertemu klien besok pagi.'], ['This time next week, we’ll be launching the product.', 'Minggu depan jam segini, kami sedang meluncurkan produk.'], ['Shall we go through the summary first?', 'Bagaimana kalau kita bahas ringkasannya dulu?']],
  salah: [['I will presenting.', 'I will be presenting.', 'Will + be + V-ing.']] },
ms: { f: [['Subjek + [akan] + Kata kerja + waktu', 'Saya akan bentangkan keputusan pada hari Khamis.'], ['Subjek + [dijadualkan] + Kata kerja', 'Saya dijadualkan membuat pembentangan.'], ['[Bagaimana kalau] + kita + Kata kerja + ?', 'Bagaimana kalau kita mulakan dengan ringkasan?']],
  ex: [['Saya akan berjumpa pelanggan esok pagi.', 'Saya akan bertemu klien besok pagi.'], ['Minggu depan, kami akan melancarkan produk.', 'Minggu depan, kami akan meluncurkan produk.'], ['Bagaimana kalau kita bincang ringkasan dahulu?', 'Bagaimana kalau kita bahas ringkasan dulu?']],
  salah: [['Saya dijadwalkan presentasi.', 'Saya dijadualkan membuat pembentangan.', 'Ejaan BM: jadual; presentasi = pembentangan.']] },
trik: 'Sudah tercatat di kalender? Pakai “I’m + V-ing”. Sedang berlangsung di jam tertentu di masa depan? Pakai “I’ll be + V-ing”.',
q: [['en', '(Sudah dijadwalkan) I ___ the client tomorrow.', ['meet', 'am meeting', 'met'], 1], ['en', 'At three, I will ___ to the client.', ['present', 'be presenting', 'presenting'], 1], ['ms', '“Saya dijadwalkan presentasi” dalam BM:', ['Saya dijadualkan membuat pembentangan', 'Saya dijadwalkan presentasi', 'Saya akan dibentang'], 0]] };

G[23] = { t: 'Present Perfect Continuous: sudah dan masih',
guru: 'Saat insiden, manajer bertanya “How long have you been working on this?” Tense ini menekankan durasi aksi yang dimulai di masa lalu dan masih berjalan sekarang. Bayangkan stopwatch yang belum dihentikan.',
en: { f: [['S + [have/has been] + [V-ing]', 'We have been investigating the issue.'], ['… + [for] durasi / [since] titik waktu', 'The server has been running for thirty days.'], ['[How long] + [have/has] + S + [been] + [V-ing] + ?', 'How long have you been working on this?']],
  ex: [['We’ve been investigating the root cause since two a.m.', 'Kami menyelidiki akar masalahnya sejak jam dua pagi.'], ['The service has been failing for an hour.', 'Layanannya terus gagal selama satu jam.'], ['How long have you been testing this feature?', 'Sudah berapa lama kamu mengetes fitur ini?']],
  salah: [['I am working here since 2020.', 'I have been working here since 2020.', 'Since + aksi yang masih berlangsung → have been V-ing.']] },
ms: { f: [['Subjek + [sudah/telah] + Kata kerja + [sejak] + waktu', 'Kami sudah menyiasat sejak pukul dua pagi.'], ['Subjek + [masih] + Kata kerja', 'Perkhidmatan itu masih gagal.'], ['[Sudah berapa lama] + Subjek + Kata kerja + ?', 'Sudah berapa lama awak menguji ciri ini?']],
  ex: [['Kami sudah menyiasat punca utama sejak pukul dua pagi.', 'Kami sudah menyelidiki akar masalah sejak jam dua pagi.'], ['Perkhidmatan itu masih gagal selama sejam.', 'Layanan itu masih gagal selama sejam.'], ['Sudah berapa lama awak menguji ciri ini?', 'Sudah berapa lama kamu mengetes fitur ini?']],
  salah: [['menyelidiki', 'menyiasat', 'BM memakai siasat untuk menyelidiki.']] },
trik: '“Have been + ing = sudah dan masih.” Stopwatch-nya masih berjalan.',
q: [['en', 'We have ___ the issue since two a.m.', ['investigated', 'been investigating', 'investigating'], 1], ['en', 'How long ___ you been working on this?', ['have', 'did', 'are'], 0], ['ms', 'Pola BM untuk “sudah dan masih”:', ['sudah … sejak', 'pernah … sejak', 'akan … sejak'], 0]] };

G[24] = { t: 'Past Perfect: masa lampau dari masa lampau',
guru: 'Laporan pasca-insiden butuh urutan kejadian yang jelas. Kalau ada dua kejadian di masa lampau, yang terjadi lebih dulu memakai had + V3. “The disk had filled up before the alert triggered.” Pembaca langsung tahu urutannya.',
en: { f: [['S + [had] + [V3]', 'The service had stopped before we noticed.'], ['[had + V3] + [before/when] + [V2]', 'We had rolled back before the client called.'], ['[After] + S + [had + V3], S + [V2]', 'After we had restarted the server, it worked.']],
  ex: [['The disk had filled up before the alert triggered.', 'Disk sudah penuh sebelum alert menyala.'], ['By the time we noticed, the job had failed twice.', 'Saat kami sadar, job itu sudah gagal dua kali.'], ['We found that someone had changed the config.', 'Kami menemukan bahwa seseorang sudah mengubah konfigurasinya.']],
  salah: [['We had roll back.', 'We had rolled back.', 'Had + V3.']] },
ms: { f: [['Subjek + [telah] + Kata kerja + [sebelum] + kejadian', 'Cakera telah penuh sebelum amaran berbunyi.'], ['[Selepas] + Subjek + [telah] + Kata kerja, …', 'Selepas kami memulakan semula pelayan, ia berfungsi.']],
  ex: [['Cakera telah penuh sebelum amaran berbunyi.', 'Disk sudah penuh sebelum alert berbunyi.'], ['Semasa kami sedar, tugas itu telah gagal dua kali.', 'Saat kami sadar, job itu sudah gagal dua kali.'], ['Kami dapati seseorang telah menukar konfigurasi.', 'Kami mendapati seseorang sudah mengubah konfigurasi.']],
  salah: [['setelah', 'selepas', 'BM lebih sering memakai selepas.']] },
trik: '“Masa lalunya masa lalu”: dari dua kejadian lampau, yang lebih dulu mendapat had + V3.',
q: [['en', 'The job ___ twice before we noticed.', ['failed had', 'had failed', 'has failed'], 1], ['en', 'After we had ___ the server, it worked.', ['restart', 'restarted', 'restarting'], 1], ['ms', '“Setelah” dalam BM yang lazim:', ['selepas', 'setelahnya', 'sesudah-sudah'], 0]] };

G[25] = { t: 'Kalimat tidak langsung: said, told, asked',
guru: 'Sebagian besar komunikasi kerja adalah meneruskan informasi: klien bilang apa, atasan minta apa. Dua hal yang perlu diingat: say sesuatu, tell seseorang. Dan saat melapor, waktunya mundur satu langkah.',
en: { f: [['S + [said (that)] + kalimat mundur 1 tense', 'The client said that the price was too high.'], ['S + [told] + orang + [(that)] + kalimat', 'She told me that she would follow up.'], ['S + [asked if/whether] + S + V', 'He asked if we could send a demo.']],
  tbl: [['is / are', 'was / were'], ['will', 'would'], ['can', 'could'], ['V1', 'V2']],
  ex: [['The client said the proposal looked good.', 'Klien bilang proposalnya terlihat bagus.'], ['My manager told me to follow up tomorrow.', 'Manajer saya menyuruh saya menindaklanjuti besok.'], ['They asked if we could reduce the price.', 'Mereka bertanya apakah kita bisa menurunkan harga.']],
  salah: [['He said me that…', 'He told me that…', 'Say tidak langsung diikuti orang; tell + orang.']] },
ms: { f: [['Subjek + [berkata bahawa] + ayat', 'Pelanggan berkata bahawa harganya terlalu tinggi.'], ['Subjek + [memberitahu] + orang + [bahawa] + ayat', 'Dia memberitahu saya bahawa dia akan buat susulan.'], ['Subjek + [bertanya sama ada] + ayat', 'Mereka bertanya sama ada kami boleh kurangkan harga.']],
  ex: [['Pelanggan berkata bahawa cadangan itu nampak bagus.', 'Klien bilang proposalnya terlihat bagus.'], ['Pengurus saya suruh saya buat susulan esok.', 'Manajer saya menyuruh saya menindaklanjuti besok.'], ['Mereka bertanya sama ada kita boleh kurangkan harga.', 'Mereka bertanya apakah kita bisa menurunkan harga.']],
  salah: [['bahwa', 'bahawa', 'Ejaan BM: bahawa.'], ['bertanya apakah', 'bertanya sama ada', 'Pola BM untuk pertanyaan tidak langsung.']] },
trik: '“SAY sesuatu, TELL seseorang.” Lalu mundurkan waktunya satu langkah: will → would, can → could.',
q: [['en', 'She ___ me that she would follow up.', ['said', 'told', 'asked'], 1], ['en', 'The client said the price ___ too high.', ['is', 'was', 'will'], 1], ['ms', '“Mereka bertanya apakah kami bisa…” dalam BM:', ['Mereka bertanya sama ada kami boleh…', 'Mereka bertanya apakah kami bisa…', 'Mereka tanya bahwa kami boleh…'], 0]] };

G[26] = { t: 'Gerund dan infinitive: V-ing atau to V1',
guru: 'Di wawancara kerja kamu akan bilang apa yang kamu suka dan apa yang ingin kamu capai. Beberapa kata kerja harus diikuti V-ing, sebagian lain to + V1. Jangan hafal acak; kelompokkan berdasarkan makna.',
en: { f: [['S + [enjoy/finish/avoid/suggest] + [V-ing]', 'I enjoy solving complex bugs.'], ['S + [want/plan/decide/hope] + [to V1]', 'I want to grow as a QA lead.'], ['[good at / interested in] + [V-ing]', 'I’m good at writing test automation.']],
  tbl: [['enjoy, finish, avoid, suggest, mind', '+ V-ing'], ['want, plan, decide, hope, need', '+ to V1'], ['good at, interested in, after, before', '+ V-ing']],
  ex: [['I enjoy working with cross-functional teams.', 'Saya senang bekerja dengan tim lintas fungsi.'], ['I want to improve our release quality.', 'Saya ingin meningkatkan kualitas rilis kami.'], ['I’m interested in learning performance testing.', 'Saya tertarik mempelajari performance testing.']],
  salah: [['I enjoy to test.', 'I enjoy testing.', 'Enjoy + V-ing.'], ['I want learning.', 'I want to learn.', 'Want + to V1.'], ['I’m good in testing.', 'I’m good at testing.', 'Good at, bukan good in.']] },
ms: { f: [['Subjek + [suka/gemar] + Kata kerja', 'Saya suka menyelesaikan pepijat yang rumit.'], ['Subjek + [mahu/ingin/bercadang untuk] + Kata kerja', 'Saya mahu berkembang sebagai ketua QA.'], ['Subjek + [mahir dalam] + Kata benda', 'Saya mahir dalam automasi ujian.']],
  ex: [['Saya suka bekerja dengan pasukan pelbagai fungsi.', 'Saya senang bekerja dengan tim lintas fungsi.'], ['Saya mahu meningkatkan kualiti keluaran kami.', 'Saya ingin meningkatkan kualitas rilis kami.'], ['Saya berminat untuk belajar ujian prestasi.', 'Saya tertarik belajar performance testing.']],
  salah: [['Saya berencana', 'Saya bercadang', 'BM memakai bercadang untuk berencana.']] },
trik: 'Kelompok “nikmat” (enjoy, finish, avoid, suggest) → ING. Kelompok “harapan” (want, plan, hope, decide) → TO.',
q: [['en', 'I enjoy ___ complex bugs.', ['to solve', 'solving', 'solve'], 1], ['en', 'I want ___ as a QA lead.', ['growing', 'to grow', 'grow'], 1], ['ms', '“Saya berencana pindah” dalam BM:', ['Saya bercadang untuk berpindah', 'Saya berencana berpindah', 'Saya rencana pindah'], 0]] };

G[27] = { t: 'Kata penghubung: because, so, but, although, however',
guru: 'Ini pelajaran penutup yang membuat semua rumus sebelumnya menyatu. Kata penghubung mengubah kalimat-kalimat pendek menjadi penjelasan yang mengalir: alasan, akibat, dan kontras. Dengan ini, kamu siap menulis email dan laporan yang terdengar profesional.',
en: { f: [['A + [because] + S + V', 'We delayed the release because we found a critical bug.'], ['[Because of] + Kata benda', 'Because of the bug, we delayed the release.'], ['A + [, so] + hasil', 'The cloud is cheaper, so we migrated.'], ['[Although] + A, + B', 'Although the docs are long, they are clear.'], ['A. [However,] + B.', 'The update is ready. However, we need approval.']],
  ex: [['The system is stable, but it is slow.', 'Sistemnya stabil, tapi lambat.'], ['We need more storage, so we are moving to the cloud.', 'Kami butuh lebih banyak penyimpanan, jadi kami pindah ke cloud.'], ['Although it’s Friday, we will deploy the hotfix.', 'Meskipun hari Jumat, kami akan deploy hotfix.']],
  salah: [['Because the bug, we delayed.', 'Because of the bug, we delayed.', 'Because + kalimat; because of + kata benda.'], ['Although …, but …', 'Although …, …', 'Jangan pakai although dan but bersamaan.']] },
ms: { f: [['A + [kerana] + alasan', 'Kami tangguhkan keluaran kerana ada pepijat kritikal.'], ['A, [jadi/oleh itu] + hasil', 'Awan lebih murah, jadi kami berpindah.'], ['A, [tetapi] + B', 'Sistem stabil, tetapi perlahan.'], ['[Walaupun] + A, + B', 'Walaupun dokumentasi panjang, ia jelas.']],
  ex: [['Sistem itu stabil, tetapi perlahan.', 'Sistemnya stabil, tapi lambat.'], ['Kami perlukan lebih banyak storan, jadi kami berpindah ke awan.', 'Kami butuh lebih banyak penyimpanan, jadi kami pindah ke cloud.'], ['Walaupun hari ini Jumaat, kami akan buat pembaikan segera.', 'Meskipun hari Jumat, kami akan membuat hotfix.']],
  salah: [['karena', 'kerana', 'Ejaan BM: kerana.'], ['Walaupun …, tetapi …', 'Walaupun …, …', 'Sama seperti although: jangan digabung dengan tetapi.']] },
trik: '“Walaupun tidak boleh bergandeng dengan tetapi.” Berlaku di tiga bahasa: although/but, walaupun/tetapi, meskipun/tetapi.',
q: [['en', 'We delayed the release ___ the bug.', ['because', 'because of', 'so'], 1], ['en', 'Although the docs are long, ___ they are clear.', ['but', '(tanpa kata hubung)', 'so'], 1], ['ms', 'Ejaan BM untuk “karena”:', ['kerana', 'karena', 'karna'], 0]] };

G[29]={t:'Rumus laporan bug yang jelas',guru:'Mulai minggu ini kita masuk dunia kerjamu sehari-hari. Laporan bug adalah tulisan yang paling sering dibaca developer. Laporan yang jelas dalam bahasa Inggris membuat bug cepat diperbaiki dan membuatmu terlihat profesional. Pakai rumus judul tiga bagian, lalu langkah, hasil yang diharapkan, dan hasil aktual.',
en:{f:[['[Title:] Komponen + masalah + [when/on] + kondisi','Checkout: total shows 0 when a voucher is applied'],['[Steps:] [1.] V1 … [2.] V1 …','1. Log in. 2. Add an item. 3. Apply voucher SAVE10.'],['[Expected:] S + [should] + V1','The total should be 90 ringgit.'],['[Actual:] S + V1/Vs (present)','The total shows 0 ringgit.']],
tbl:[['Title','Komponen: apa yang salah + kapan'],['Steps','kata kerja perintah: Open, Click, Enter'],['Expected','should + V1'],['Actual','simple present'],['Environment','browser, OS, versi, data']],
ex:[['Login: error 500 when the password contains a space','Login: error 500 saat kata sandi mengandung spasi'],['Expected: the user should see the dashboard.','Diharapkan: pengguna melihat dasbor.'],['Actual: the page stays on the loading spinner.','Aktual: halaman tetap di spinner pemuatan.']],
salah:[['Expected: the total is should 90.','Expected: the total should be 90.','should + V1 (be).'],['Steps: I am clicking the button.','Steps: Click the button.','Langkah memakai kata kerja perintah.']]},
ms:{f:[['[Tajuk:] Komponen + masalah + [apabila] + keadaan','Pembayaran: jumlah jadi 0 apabila baucar digunakan'],['[Dijangka:] Subjek + [sepatutnya] + Kata kerja','Jumlah sepatutnya 90 ringgit.'],['[Sebenar:] Subjek + Kata kerja','Jumlah menunjukkan 0 ringgit.']],
ex:[['Log masuk: ralat 500 apabila kata laluan ada ruang','Login: error 500 saat kata sandi ada spasi'],['Dijangka: pengguna sepatutnya nampak papan pemuka.','Diharapkan: pengguna melihat dasbor.']]},
trik:'Rumus judul “APA, DI MANA, KAPAN”: Komponen (di mana) + masalah (apa) + when (kapan). Developer harus paham bug-nya hanya dari judul.',
q:[['en','Expected: the button ___ enabled.',['should be','should is','is should'],0],['en','Langkah reproduksi yang benar:',['Click the Save button.','I clicked the Save button yesterday.','Clicking the Save button.'],0],['ms','“Seharusnya” dalam laporan BM:',['sepatutnya','seharusnya-lah','mesti-nya'],0]]};

G[30]={t:'Menjelaskan severity dan priority',guru:'Pertanyaan interview paling klasik: apa beda severity dan priority? Severity adalah seberapa parah dampak teknisnya, priority adalah seberapa cepat harus diperbaiki menurut bisnis. Hari ini kamu belajar rumus kalimat untuk menjelaskan dan mempertahankan penilaianmu.',
en:{f:[['This is a [severity] bug [because] + alasan','This is a critical bug because users cannot pay.'],['[The priority should be] + level + [since] + alasan bisnis','The priority should be high since the campaign starts tomorrow.'],['[Severity is about] … [, while priority is about] …','Severity is about impact, while priority is about urgency.']],
tbl:[['Critical','sistem mati, data hilang, tidak bisa bayar'],['Major','fitur utama rusak, ada workaround'],['Minor','fitur kecil terganggu'],['Trivial / cosmetic','tampilan, typo']],
ex:[['A typo in the company name is low severity but high priority.','Typo pada nama perusahaan severity rendah tapi priority tinggi.'],['A crash in an old admin report is high severity but low priority.','Crash di laporan admin lama severity tinggi tapi priority rendah.'],['I classified it as major because there is a workaround.','Saya klasifikasikan major karena ada workaround.']],
salah:[['The bug is very critical.','The bug is critical.','Critical sudah maksimal, tidak perlu very.']]},
ms:{f:[['Ini pepijat [kritikal] [kerana] + alasan','Ini pepijat kritikal kerana pengguna tidak boleh bayar.'],['[Keutamaan sepatutnya] + tahap + [memandangkan] + alasan','Keutamaan sepatutnya tinggi memandangkan kempen bermula esok.']],
ex:[['Salah ejaan pada nama syarikat: keterukan rendah, keutamaan tinggi.','Typo pada nama perusahaan: severity rendah, priority tinggi.'],['Saya klasifikasikan sebagai utama kerana ada penyelesaian sementara.','Saya klasifikasikan major karena ada workaround.']]},
trik:'“Severity = Sakitnya, Priority = Pentingnya.” Dokter menilai sakitnya (QA), pasien memutuskan pentingnya kapan berobat (PO).',
q:[['en','Severity is about impact, ___ priority is about urgency.',['while','because','so'],0],['en','Typo di logo perusahaan di halaman utama adalah:',['low severity, high priority','high severity, low priority','low severity, low priority'],0],['ms','“Mengingat” dalam BM formal:',['memandangkan','mengingatkan','ingatlah'],0]]};

G[31]={t:'Siklus hidup bug: pasif dan present perfect',guru:'Saat melaporkan status bug, kamu akan banyak memakai kalimat pasif (was moved, has been fixed), karena fokusnya pada bug, bukan pada orangnya. Ini menggabungkan dua rumus yang sudah kamu pelajari di bulan pertama.',
en:{f:[['The bug [was] + V3 + [to] + status','The bug was moved to In Progress.'],['The fix [has been] + V3 + [on] + environment','The fix has been deployed on staging.'],['I [reopened] it [because] + alasan','I reopened it because the issue still occurs on Safari.']],
tbl:[['New → Assigned','triage selesai'],['Assigned → In Progress','developer mulai'],['Fixed → Retest','siap dites QA'],['Retest → Closed / Reopened','lulus atau masih gagal'],['Rejected / Deferred / Duplicate','tidak dikerjakan sekarang']],
ex:[['The ticket has been assigned to Ali.','Tiket sudah ditugaskan ke Ali.'],['The fix was verified on staging yesterday.','Perbaikannya diverifikasi di staging kemarin.'],['It was marked as a duplicate of BUG-102.','Ditandai sebagai duplikat BUG-102.']],
salah:[['The bug has been fix.','The bug has been fixed.','has been + V3.']]},
ms:{f:[['Pepijat itu [telah] + [di-] + Kata kerja + [ke] + status','Pepijat itu telah dipindahkan ke Sedang Dijalankan.'],['Saya [buka semula] tiket [kerana] + alasan','Saya buka semula tiket kerana isu masih berlaku di Safari.']],
ex:[['Tiket itu telah ditugaskan kepada Ali.','Tiket itu sudah ditugaskan ke Ali.'],['Pembaikan disahkan di staging semalam.','Perbaikan diverifikasi di staging kemarin.']]},
trik:'Status bug selalu “diapakan”: was moved, was fixed, was closed. Ingat: bug tidak bisa memperbaiki dirinya sendiri, jadi pakai pasif.',
q:[['en','The fix has ___ deployed on staging.',['be','been','being'],1],['en','I ___ the ticket because it still fails.',['reopened','reopen-ed','was reopen'],0],['ms','“Sudah ditugaskan” dalam BM:',['telah ditugaskan','telah menugaskan','sudah tugas'],0]]};

G[32]={t:'Menjelaskan kondisi bug: only when, if, unless',guru:'Bug yang sulit direproduksi biasanya bergantung pada kondisi. Kalimat yang tepat seperti “It only happens when…” langsung memberi petunjuk ke developer. Hari ini kita latih kata hubung kondisi.',
en:{f:[['It [only happens when] + S + V','It only happens when the cart has more than ten items.'],['It [works on] A [but not on] B','It works on Chrome but not on Safari.'],['[I can’t reproduce it unless] + S + V','I can’t reproduce it unless I clear the cache.'],['[It fails] + [intermittently / consistently]','It fails intermittently, about one in five runs.']],
ex:[['The bug only happens when the time zone is GMT+8.','Bug hanya terjadi saat zona waktu GMT+8.'],['It works on the emulator but not on a real device.','Berfungsi di emulator tapi tidak di perangkat asli.'],['I could reproduce it three out of five times.','Saya bisa mereproduksinya tiga dari lima kali.']],
salah:[['It only happen when…','It only happens when…','It + V-s.']]},
ms:{f:[['Ia [hanya berlaku apabila] + ayat','Ia hanya berlaku apabila troli ada lebih sepuluh barang.'],['Ia [berfungsi di] A [tetapi tidak di] B','Ia berfungsi di Chrome tetapi tidak di Safari.']],
ex:[['Pepijat ini hanya berlaku apabila zon waktu GMT+8.','Bug ini hanya terjadi saat zona waktu GMT+8.'],['Saya boleh hasilkan semula tiga daripada lima kali.','Saya bisa reproduksi tiga dari lima kali.']]},
trik:'Tiga kata kunci investigasi: ONLY WHEN (kondisi), BUT NOT (perbandingan), OUT OF (frekuensi).',
q:[['en','It only ___ when the cart is empty.',['happen','happens','happening'],1],['en','I can’t reproduce it ___ I clear the cache.',['unless','if not when','because'],0],['ms','“Tiga dari lima kali” dalam BM:',['tiga daripada lima kali','tiga dari lima kalian','tiga per lima kali'],0]]};

G[33]={t:'Root cause: caused by, due to, because',guru:'Setelah bug ditemukan, pertanyaan berikutnya selalu “Why did it happen?” Kamu butuh kalimat sebab-akibat yang rapi untuk postmortem dan interview. Bedakan pasangan yang diikuti kalimat dan yang diikuti kata benda.',
en:{f:[['The issue [was caused by] + kata benda','The issue was caused by a missing index.'],['[This happened because] + S + V','This happened because the cache was not cleared.'],['[Due to] + kata benda, S + V','Due to a config change, the API returned 500.'],['[To prevent this,] we + [will] + V1','To prevent this, we will add a unit test.']],
ex:[['The crash was caused by a null pointer exception.','Crash disebabkan oleh null pointer exception.'],['It happened because the token was hardcoded.','Terjadi karena token di-hardcode.'],['To prevent this, we added a regression test.','Untuk mencegahnya, kami menambahkan tes regresi.']],
salah:[['Due to the cache was old…','Due to the old cache… / Because the cache was old…','due to + kata benda; because + kalimat.']]},
ms:{f:[['Isu itu [disebabkan oleh] + kata benda','Isu itu disebabkan oleh indeks yang tiada.'],['[Ini berlaku kerana] + ayat','Ini berlaku kerana cache tidak dikosongkan.'],['[Untuk mencegahnya,] kami + [akan] + Kata kerja','Untuk mencegahnya, kami akan tambah ujian unit.']],
ex:[['Ranap itu disebabkan oleh pengecualian penuding null.','Crash itu disebabkan null pointer exception.'],['Ini berlaku kerana token dikodkan tetap.','Ini terjadi karena token di-hardcode.']]},
trik:'“DUE TO + benda, BECAUSE + cerita.” Due to a bug. Because the bug broke the page.',
q:[['en','The crash was caused ___ a null pointer.',['by','of','from because'],0],['en','___ a config change, the API failed.',['Due to','Because','So'],0],['ms','“Disebabkan oleh” dalam BM:',['disebabkan oleh','sebabkan oleh','oleh sebab daripada'],0]]};

G[34]={t:'Tidak setuju dengan sopan saat triage',guru:'QA sering berbeda pendapat dengan developer: “It’s not a bug, it’s by design.” Kuncinya: akui sudut pandang mereka, bawa bukti, lalu tawarkan jalan keluar. Kalimat sopan ini akan sangat berguna di kantor Malaysia yang menghargai keharmonisan.',
en:{f:[['[I see your point, but] + S + V','I see your point, but the requirement says otherwise.'],['[Could we] + V1 + [?]','Could we check the acceptance criteria together?'],['[From the user’s perspective,] + S + V','From the user’s perspective, this looks broken.'],['[How about if] we + V1 + [?]','How about if we ask the product owner?']],
ex:[['I understand it’s by design, but users find it confusing.','Saya paham ini sesuai desain, tapi pengguna bingung.'],['Here is the evidence: a video and the logs.','Ini buktinya: video dan log.'],['Let’s agree on the severity before the release.','Mari sepakati severity sebelum rilis.']],
salah:[['You are wrong.','I see it differently.','Hindari menyalahkan orang; fokus pada masalah.']]},
ms:{f:[['[Saya faham pandangan awak, tetapi] + ayat','Saya faham pandangan awak, tetapi keperluan berkata lain.'],['[Bagaimana kalau] kita + Kata kerja + ?','Bagaimana kalau kita tanya pemilik produk?'],['[Dari sudut pengguna,] + ayat','Dari sudut pengguna, ini nampak rosak.']],
ex:[['Saya faham ia mengikut reka bentuk, tetapi pengguna keliru.','Saya paham ini sesuai desain, tapi pengguna bingung.'],['Ini buktinya: video dan log.','Ini buktinya: video dan log.']]},
trik:'Rumus “A-B-C”: Acknowledge (I see your point), Bring evidence (here is the video), Collaborate (could we…?).',
q:[['en','Respons paling profesional saat developer bilang “not a bug”:',['I see your point, but the spec says the total must include tax.','You are wrong, it is a bug.','OK, whatever.'],0],['en','How about if we ___ the product owner?',['ask','asking','to ask'],0],['ms','“Dari sudut pandang pengguna” dalam BM:',['dari sudut pengguna','dari pandangan sudut pengguna','dari pengguna sudut'],0]]};

G[36]={t:'Menjelaskan proses: first, then, after that, finally',guru:'Di interview kamu akan diminta menjelaskan proses kerja: SDLC, sprint, atau alur testing. Rahasianya adalah kata penanda urutan. Dengan itu, penjelasan panjang pun terdengar terstruktur.',
en:{f:[['[First,] we + V1 …','First, we refine the user stories.'],['[Then / After that,] we + V1 …','Then we estimate them in sprint planning.'],['[Once] + S + V, we + V1','Once the story is done, we demo it in the sprint review.'],['[Finally,] we + V1 …','Finally, we discuss improvements in the retrospective.']],
ex:[['In our team, testing starts during refinement, not after coding.','Di tim kami, testing dimulai saat refinement, bukan setelah coding.'],['Once a story meets the definition of done, we close it.','Begitu story memenuhi definition of done, kami tutup.'],['Each sprint lasts two weeks.','Setiap sprint berlangsung dua minggu.']],
salah:[['After that we are estimate.','After that, we estimate.','Simple present untuk proses rutin.']]},
ms:{f:[['[Pertama,] kami + Kata kerja','Pertama, kami halusi cerita pengguna.'],['[Kemudian / Selepas itu,] kami + Kata kerja','Kemudian kami anggarkan dalam perancangan sprint.'],['[Akhir sekali,] kami + Kata kerja','Akhir sekali, kami bincang penambahbaikan dalam retrospektif.']],
ex:[['Dalam pasukan kami, ujian bermula semasa penghalusan.','Di tim kami, testing dimulai saat refinement.'],['Setiap sprint berlangsung selama dua minggu.','Setiap sprint berlangsung dua minggu.']]},
trik:'Empat anak tangga: FIRST → THEN → ONCE → FINALLY. Pendengar selalu tahu kamu ada di langkah mana.',
q:[['en','___ the story is done, we demo it.',['Once','First','Finally of'],0],['en','Proses rutin tim memakai tense:',['simple present','past continuous','future perfect'],0],['ms','“Terakhir” untuk urutan dalam BM:',['akhir sekali','terakhirnya kali','paling akhirlah'],0]]};

G[37]={t:'User story dan requirement: As a…, I want…, so that…',guru:'User story punya rumus baku yang dipakai di seluruh dunia. Kalau kamu menguasainya, kamu bisa membaca, menulis, dan mengkritisi requirement dalam bahasa Inggris. QA yang baik juga bertanya saat requirement ambigu.',
en:{f:[['[As a] + peran, [I want] + to V1, [so that] + manfaat','As a shopper, I want to save my cart so that I can pay later.'],['[The system must / should / may] + V1','The system must send a confirmation email.'],['[What should happen if] + S + V + ?','What should happen if the email is already registered?']],
tbl:[['must','wajib'],['should','sebaiknya, diharapkan'],['may','boleh, opsional'],['must not','dilarang']],
ex:[['As an admin, I want to export users so that I can audit them.','Sebagai admin, saya ingin mengekspor pengguna agar bisa mengauditnya.'],['This requirement is ambiguous: what does fast mean?','Requirement ini ambigu: “cepat” itu seperti apa?'],['Performance is a non-functional requirement.','Performa adalah requirement non-fungsional.']],
salah:[['As a user, I want save the cart.','As a user, I want to save the cart.','want + to V1.']]},
ms:{f:[['[Sebagai] + peranan, [saya mahu] + Kata kerja [supaya] + manfaat','Sebagai pembeli, saya mahu simpan troli supaya boleh bayar kemudian.'],['Sistem [mesti / patut / boleh] + Kata kerja','Sistem mesti hantar e-mel pengesahan.']],
ex:[['Sebagai pentadbir, saya mahu eksport pengguna supaya boleh mengaudit.','Sebagai admin, saya ingin ekspor pengguna agar bisa audit.'],['Keperluan ini samar-samar.','Requirement ini ambigu.']]},
trik:'Rumus “SIAPA, MAU APA, BIAR APA”: As a (siapa), I want (mau apa), so that (biar apa). Kalau bagian “so that” kosong, tanyakan ke PO.',
q:[['en','As a user, I want ___ my password.',['reset','to reset','resetting'],1],['en','“The system ___ store passwords in plain text.” (dilarang)',['must not','may not be','should'],0],['ms','“Agar” dalam user story BM:',['supaya','agarlah','biar'],0]]};

G[38]={t:'Menjelaskan arsitektur: which, that, who',guru:'Menjelaskan arsitektur aplikasi butuh kalimat yang menyambung komponen satu dengan lainnya. Kata sambung which dan that membuat kalimatmu mengalir: “The frontend sends a request to the API, which…”',
en:{f:[['A + V-s + B, [which] + V-s …','The app calls the API, which reads from the database.'],['The service [that] + V-s … + [is] …','The service that handles payments is written in Go.'],['The user [who] + V-s … + V-s …','The user who places the order receives an email.'],['When + S + V, the server + [returns] + kode','When the token is missing, the server returns 401.']],
ex:[['The frontend is built with React and talks to a PHP backend.','Frontend dibangun dengan React dan berkomunikasi dengan backend PHP.'],['The load balancer sends traffic to three servers.','Load balancer mengirim trafik ke tiga server.'],['We use a third-party gateway that processes card payments.','Kami pakai gateway pihak ketiga yang memproses kartu.']],
salah:[['The API which it reads the database.','The API, which reads the database…','Jangan ulangi subjek setelah which.']]},
ms:{f:[['A + Kata kerja + B, [yang] + Kata kerja …','Aplikasi memanggil API, yang membaca daripada pangkalan data.'],['Apabila + ayat, pelayan [memulangkan] + kod','Apabila token tiada, pelayan memulangkan 401.']],
ex:[['Bahagian hadapan dibina dengan React dan berhubung dengan bahagian belakang PHP.','Frontend dibangun dengan React dan terhubung ke backend PHP.'],['Pengimbang beban menghantar trafik ke tiga pelayan.','Load balancer mengirim trafik ke tiga server.']]},
trik:'WHICH untuk benda, WHO untuk orang, THAT untuk keduanya. Di BM cukup satu kata: yang.',
q:[['en','The user ___ places the order gets an email.',['who','which','what'],0],['en','When the token is missing, the server ___ 401.',['return','returns','returning'],1],['ms','Kata penghubung BM untuk which/that/who:',['yang','mana','siapa'],0]]};

G[39]={t:'Menjelaskan data dan relasi tabel',guru:'Sebagai QA dengan stack PostgreSQL, kamu sering menjelaskan struktur data dan hasil query. Rumusnya pendek tapi sering dipakai: tabel menyimpan apa, relasinya bagaimana, dan query mengembalikan apa.',
en:{f:[['The [table] + [stores] + data','The orders table stores one row per order.'],['Each A [has many / belongs to] B','Each order has many items. Each item belongs to one order.'],['The query [returns] + jumlah + rows [where] + kondisi','The query returns three rows where status is pending.'],['[This column must not be] + null/duplicate','This column must not be null.']],
ex:[['The foreign key links order_items to orders.','Foreign key menghubungkan order_items ke orders.'],['The stored procedure calculates the total and updates the order.','Stored procedure menghitung total dan memperbarui order.'],['I verified the insert with a SELECT query.','Saya memverifikasi insert dengan query SELECT.']],
salah:[['Each order have many items.','Each order has many items.','Each + kata benda tunggal → has.']]},
ms:{f:[['Jadual + [menyimpan] + data','Jadual pesanan menyimpan satu baris bagi setiap pesanan.'],['Setiap A [ada banyak] B','Setiap pesanan ada banyak barang.'],['Pertanyaan itu [memulangkan] + jumlah + baris','Pertanyaan itu memulangkan tiga baris.']],
ex:[['Kunci asing menghubungkan jadual barang dengan jadual pesanan.','Foreign key menghubungkan tabel item dengan tabel order.'],['Saya sahkan sisipan dengan pertanyaan SELECT.','Saya verifikasi insert dengan query SELECT.']]},
trik:'“EACH selalu tunggal”: Each order HAS, each user IS. Sama seperti “setiap” yang diikuti satu benda.',
q:[['en','Each order ___ many items.',['have','has','having'],1],['en','The query ___ three rows.',['returns','return','is return'],0],['ms','“Tabel” dalam BM:',['jadual','tabel','meja'],0]]};

G[40]={t:'Menjelaskan pipeline CI/CD: once, as soon as, every time',guru:'Pipeline adalah rangkaian peristiwa otomatis. Untuk menjelaskannya, kamu butuh kata waktu yang menunjukkan pemicu: every time, once, as soon as. Dipadukan dengan pasif, penjelasanmu terdengar seperti engineer senior.',
en:{f:[['[Every time] + S + V, the pipeline + V-s','Every time someone pushes code, the pipeline runs unit tests.'],['[As soon as] + S + V, + S + [is] + V3','As soon as the build passes, the image is pushed.'],['[If] + check + [fails], the pipeline + [stops]','If the quality gate fails, the pipeline stops.']],
ex:[['The app is deployed to staging automatically.','Aplikasi di-deploy ke staging secara otomatis.'],['New features are hidden behind feature flags.','Fitur baru disembunyikan di balik feature flag.'],['A canary release goes to five percent of users first.','Rilis canary dikirim ke lima persen pengguna dulu.']],
salah:[['As soon as the build will pass…','As soon as the build passes…','Setelah as soon as / once → present.']]},
ms:{f:[['[Setiap kali] + ayat, saluran + Kata kerja','Setiap kali kod ditolak, saluran menjalankan ujian unit.'],['[Sebaik sahaja] + ayat, + Objek + [di-]Kata kerja','Sebaik sahaja binaan lulus, imej ditolak.']],
ex:[['Aplikasi diatur gerak ke staging secara automatik.','Aplikasi di-deploy ke staging otomatis.'],['Ciri baharu disembunyikan di sebalik bendera ciri.','Fitur baru disembunyikan di balik feature flag.']]},
trik:'Kata waktu pemicu (once, as soon as, every time, if) selalu diikuti present, persis seperti aturan “IF tidak suka WILL”.',
q:[['en','As soon as the build ___, the image is pushed.',['passes','will pass','passed will'],0],['en','The app ___ deployed automatically.',['is','are being','be'],0],['ms','“Begitu / segera setelah” dalam BM:',['sebaik sahaja','sebaik-baiknya','sesegera-segera'],0]]};

G[41]={t:'Komentar code review yang sopan',guru:'Komentar code review yang terlalu langsung bisa terdengar kasar. Penutur asli memakai kalimat lunak: “Could we…?”, “What do you think about…?”. Ini juga berlaku saat kamu me-review test code temanmu.',
en:{f:[['[Could we] + V1 + [?]','Could we extract this into a helper function?'],['[What do you think about] + V-ing + [?]','What do you think about renaming this variable?'],['[I’d suggest] + V-ing / [that] we + V1','I’d suggest adding a unit test for this case.'],['[Nit:] + saran kecil','Nit: missing semicolon on line ten.']],
ex:[['Looks good to me, just one small comment.','Sudah bagus, hanya satu komentar kecil.'],['This might cause a race condition if two users submit at once.','Ini bisa menyebabkan race condition jika dua pengguna submit bersamaan.'],['Thanks for the review, I’ve addressed your comments.','Terima kasih atas review-nya, komentarmu sudah saya tangani.']],
salah:[['Change this.','Could we change this to a constant?','Perintah langsung terdengar kasar di code review.']]},
ms:{f:[['[Boleh kita] + Kata kerja + ?','Boleh kita pindahkan ini ke fungsi pembantu?'],['[Apa pendapat awak kalau] kita + Kata kerja?','Apa pendapat awak kalau kita tukar nama pemboleh ubah ini?'],['[Saya cadangkan] + Kata kerja','Saya cadangkan tambah ujian unit.']],
ex:[['Nampak bagus, cuma satu komen kecil.','Sudah bagus, hanya satu komentar kecil.'],['Terima kasih atas semakan, saya sudah ambil tindakan.','Terima kasih atas review, sudah saya tindak lanjuti.']]},
trik:'Ubah perintah jadi pertanyaan: “Fix this” → “Could we fix this?”. Satu kata “could” mengubah nada dari bos menjadi rekan.',
q:[['en','What do you think about ___ this variable?',['rename','renaming','to rename'],1],['en','I’d suggest ___ a unit test.',['adding','add','to adding'],0],['ms','“Saya sarankan” dalam BM:',['saya cadangkan','saya sarankankan','saya mencadang-cadang'],0]]};
G[43]={t:'Aturan bisnis: must, should, cannot, only if',guru:'Logika bisnis adalah kumpulan aturan. Untuk mengujinya, kamu harus bisa membaca dan menulis aturan dengan tepat. Modal verb menentukan seberapa ketat aturannya, jadi pilih dengan hati-hati.',
en:{f:[['[If] + kondisi, the system [must] + V1','If the cart total is below 50, the system must charge shipping.'],['S + [cannot] + V1 + [unless] + kondisi','Users cannot check out unless their email is verified.'],['S + [is allowed to] + V1 + [only if] + kondisi','A user is allowed to cancel only if the order is not shipped.'],['The [minimum / maximum] + benda + [is] + nilai','The maximum quantity per item is five.']],
ex:[['The backend must enforce the rule, not only the frontend.','Backend harus menegakkan aturan, bukan hanya frontend.'],['Only verified users are eligible for the voucher.','Hanya pengguna terverifikasi yang berhak atas voucher.'],['The daily transfer limit is ten thousand ringgit.','Batas transfer harian sepuluh ribu ringgit.']],
salah:[['User can’t checkout if not verified email.','Users cannot check out unless their email is verified.','Pakai unless + kalimat lengkap.']]},
ms:{f:[['[Jika] + syarat, sistem [mesti] + Kata kerja','Jika jumlah troli bawah 50, sistem mesti kenakan caj penghantaran.'],['Pengguna [tidak boleh] + Kata kerja [kecuali] + syarat','Pengguna tidak boleh bayar kecuali e-mel disahkan.'],['Had [maksimum] + benda + [ialah] + nilai','Kuantiti maksimum setiap barang ialah lima.']],
ex:[['Bahagian belakang mesti menguatkuasakan peraturan itu.','Backend harus menegakkan aturan itu.'],['Hanya pengguna yang disahkan layak untuk baucar.','Hanya pengguna terverifikasi yang berhak atas voucher.']]},
trik:'Setiap aturan = satu test case positif + satu negatif. “Must charge shipping below 50” → uji 49.99 dan 50.00.',
q:[['en','Users cannot check out ___ their email is verified.',['unless','if','so'],0],['en','A user is allowed to cancel ___ the order is not shipped.',['only if','only when if','if only of'],0],['ms','“Tidak boleh … kecuali …” artinya:',['tidak boleh … kecuali …','boleh … asalkan tidak …','harus … tanpa …'],0]]};

G[44]={t:'Alur status: when … changes to …',guru:'Pesanan, pembayaran, dan approval punya status yang berpindah-pindah. Menjelaskan transisi status dengan jelas adalah kunci state transition testing yang akan kamu pelajari minggu depan.',
en:{f:[['[When] + event, the status [changes from] A [to] B','When the payment succeeds, the status changes from Pending to Paid.'],['A [cannot go back to] B','A delivered order cannot go back to pending.'],['[After] + durasi, S + [expires / is cancelled]','After 24 hours, an unpaid order is cancelled.']],
tbl:[['Pending','menunggu pembayaran'],['Paid','sudah dibayar'],['Shipped','dikirim'],['Delivered','diterima'],['Cancelled / Refunded','dibatalkan / dikembalikan']],
ex:[['The inventory decreases only after payment.','Persediaan berkurang hanya setelah pembayaran.'],['The customer gets a notification at every status change.','Pelanggan dapat notifikasi di setiap perubahan status.'],['Cancelled to Paid is an invalid transition.','Cancelled ke Paid adalah transisi tidak valid.']],
salah:[['The status change to Paid.','The status changes to Paid.','The status + V-s.']]},
ms:{f:[['[Apabila] + peristiwa, status [bertukar daripada] A [kepada] B','Apabila pembayaran berjaya, status bertukar daripada Belum Selesai kepada Dibayar.'],['Selepas + tempoh, pesanan + [dibatalkan]','Selepas 24 jam, pesanan yang belum dibayar dibatalkan.']],
ex:[['Inventori berkurang hanya selepas pembayaran.','Persediaan berkurang hanya setelah pembayaran.'],['Pelanggan menerima pemberitahuan setiap kali status bertukar.','Pelanggan menerima notifikasi tiap status berubah.']]},
trik:'Gambarkan status sebagai stasiun kereta: tiap event adalah tiket yang memindahkanmu dari satu stasiun ke stasiun berikutnya. Tanpa tiket, tidak boleh pindah.',
q:[['en','When the payment succeeds, the status ___ to Paid.',['changes','change','changing'],0],['en','A delivered order cannot go back ___ pending.',['to','from','at'],0],['ms','“Berubah dari A ke B” dalam BM:',['bertukar daripada A kepada B','berubah dari A ke B-lah','tukar A daripada B'],0]]};

G[45]={t:'Angka dan perhitungan: is calculated as, rounded to',guru:'Bug paling mahal sering ada di perhitungan: diskon, pajak, pembulatan. Kamu harus bisa membaca angka, persen, dan rumus dengan lancar dalam bahasa Inggris maupun Malaysia.',
en:{f:[['The total [is calculated as] + rumus','The total is calculated as subtotal minus discount plus tax.'],['The amount [is rounded to] + presisi','The amount is rounded to two decimal places.'],['[X percent of] + angka [is] + hasil','Ten percent of 200 is 20.'],['[A discount of] + nilai + [is applied]','A discount of 15 ringgit is applied.']],
tbl:[['12.50','twelve point five zero'],['10%','ten percent'],['1,250','one thousand two hundred and fifty'],['RM 99.90','ninety-nine ringgit ninety']],
ex:[['The discount is applied before tax.','Diskon diterapkan sebelum pajak.'],['The shipping fee is free for orders above 100 ringgit.','Ongkir gratis untuk pesanan di atas 100 ringgit.'],['There is a rounding issue in the last decimal.','Ada masalah pembulatan di desimal terakhir.']],
salah:[['Ten percents','ten percent','Percent tidak diberi s.']]},
ms:{f:[['Jumlah [dikira sebagai] + formula','Jumlah dikira sebagai jumlah kecil tolak diskaun tambah cukai.'],['Amaun [dibundarkan kepada] + dua titik perpuluhan','Amaun dibundarkan kepada dua titik perpuluhan.'],['[Sepuluh peratus daripada] 200 [ialah] 20','Sepuluh peratus daripada 200 ialah 20.']],
ex:[['Diskaun digunakan sebelum cukai.','Diskon diterapkan sebelum pajak.'],['Caj penghantaran percuma untuk pesanan melebihi 100 ringgit.','Ongkir gratis untuk pesanan di atas 100 ringgit.']]},
trik:'Untuk perhitungan, selalu tanya tiga hal: URUTAN (diskon dulu atau pajak dulu?), PEMBULATAN (ke atas/bawah?), BATAS (minimum/maksimum).',
q:[['en','The amount is rounded ___ two decimal places.',['to','at','by'],0],['en','“10%” dibaca:',['ten percent','ten percents','ten per cents'],0],['ms','“Persen” dalam BM:',['peratus','persen','perseratus'],0]]};

G[46]={t:'Hak akses: only, not allowed to, has permission to',guru:'Pengujian hak akses adalah area di mana bug keamanan bersembunyi. Kamu harus bisa menyatakan siapa boleh melakukan apa, dan apa yang harus terjadi jika dilanggar.',
