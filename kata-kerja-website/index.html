en:{f:[['[Only] + peran + [can] + V1','Only admins can delete users.'],['Peran + [is not allowed to] + V1','A viewer is not allowed to edit reports.'],['[If] + peran + [tries to] + V1, the API [should return] + kode','If a viewer tries to edit, the API should return 403.'],['S + [has / doesn’t have] + [permission to] + V1','This user doesn’t have permission to export.']],
ex:[['A logged-out user gets 401, a logged-in user without rights gets 403.','User belum login dapat 401, user tanpa hak dapat 403.'],['I tested privilege escalation by changing the user ID in the URL.','Saya menguji eskalasi hak dengan mengganti user ID di URL.'],['Every admin action is written to the audit log.','Setiap aksi admin dicatat di audit log.']],
salah:[['Viewer not allowed edit.','A viewer is not allowed to edit.','be + not allowed + to V1.']]},
ms:{f:[['[Hanya] + peranan + [boleh] + Kata kerja','Hanya pentadbir boleh memadam pengguna.'],['Peranan + [tidak dibenarkan] + Kata kerja','Penonton tidak dibenarkan mengedit laporan.'],['[Jika] + peranan + [cuba] + Kata kerja, API [sepatutnya memulangkan] + kod','Jika penonton cuba mengedit, API sepatutnya memulangkan 403.']],
ex:[['Pengguna tanpa kebenaran mendapat 403.','Pengguna tanpa izin mendapat 403.'],['Setiap tindakan pentadbir direkod dalam log audit.','Setiap aksi admin dicatat di audit log.']]},
trik:'401 = “Kamu siapa?” (belum login). 403 = “Saya tahu kamu, tapi tidak boleh” (tidak punya izin).',
q:[['en','A viewer is not allowed ___ reports.',['to edit','edit','editing'],0],['en','Pengguna sudah login tapi tidak punya izin mendapat:',['403 Forbidden','401 Unauthorized','404 Not Found'],0],['ms','“Tidak diizinkan” dalam BM:',['tidak dibenarkan','tidak diizinkankan','tak benarkan-lah'],0]]};

G[47]={t:'Gherkin: Given, When, Then',guru:'Gherkin adalah bahasa jembatan antara bisnis, developer, dan QA. Rumusnya sangat kaku, dan itu kabar baik: begitu kamu hafal, kamu bisa menulis acceptance criteria yang profesional dan langsung dipakai di Cucumber.',
en:{f:[['[Given] + kondisi awal (present / present perfect)','Given the user has an item in the cart'],['[When] + aksi pengguna (present)','When the user applies the voucher SAVE10'],['[Then] + hasil yang terlihat (should / present)','Then the total should be reduced by 10 percent'],['[And / But] + langkah tambahan','And a success message is displayed']],
ex:[['Scenario: Expired voucher is rejected','Skenario: Voucher kedaluwarsa ditolak'],['Given the voucher expired yesterday','Diberikan voucher kedaluwarsa kemarin'],['Then an error message "Voucher expired" is shown','Maka pesan error “Voucher expired” ditampilkan']],
salah:[['When I click on the button with id btn-submit','When the user submits the order','Tulis perilaku bisnis, bukan detail UI.']]},
ms:{f:[['[Diberi] + keadaan awal','Diberi pengguna ada barang dalam troli'],['[Apabila] + tindakan pengguna','Apabila pengguna menggunakan baucar SAVE10'],['[Maka] + hasil yang dijangka','Maka jumlah sepatutnya berkurang 10 peratus']],
ex:[['Senario: Baucar tamat tempoh ditolak','Skenario: Voucher kedaluwarsa ditolak'],['Maka mesej ralat dipaparkan','Maka pesan error ditampilkan']]},
trik:'“KONDISI – AKSI – HASIL”. Given (latar), When (satu aksi saja), Then (yang bisa dilihat). Satu When per skenario.',
q:[['en','Langkah “When” sebaiknya berisi:',['satu aksi pengguna','beberapa aksi dan hasil','kondisi awal'],0],['en','Then the total ___ reduced by 10 percent.',['should be','should','is should'],0],['ms','Padanan “Then” dalam Gherkin BM:',['Maka','Kemudian-lah','Jadinya'],0]]};

G[48]={t:'Edge case dan negative test: What happens if…?',guru:'Tester hebat berpikir “bagaimana kalau…”. Kalimat what if adalah alat utama untuk menggali edge case di rapat refinement dan di interview. Hari ini kamu belajar bertanya seperti tester senior.',
en:{f:[['[What happens if] + S + V + ?','What happens if the user clicks Pay twice?'],['[The system should not] + V1','The system should not create two orders.'],['[What if] + S + V + ?','What if the session expires during checkout?'],['[I would also test] + kata benda','I would also test empty values and special characters.']],
ex:[['The payment API must be idempotent.','API pembayaran harus idempoten.'],['What happens if the quantity is a negative number?','Apa yang terjadi kalau jumlahnya negatif?'],['The app should fail gracefully with a clear message.','Aplikasi harus gagal dengan baik dan pesan jelas.']],
salah:[['What happen if…?','What happens if…?','What + happens (tunggal).']]},
ms:{f:[['[Apa berlaku jika] + ayat + ?','Apa berlaku jika pengguna klik Bayar dua kali?'],['Sistem [tidak sepatutnya] + Kata kerja','Sistem tidak sepatutnya mencipta dua pesanan.'],['[Bagaimana pula jika] + ayat + ?','Bagaimana pula jika sesi tamat semasa pembayaran?']],
ex:[['API pembayaran mesti idempoten.','API pembayaran harus idempoten.'],['Apa berlaku jika kuantiti nombor negatif?','Apa yang terjadi jika jumlahnya negatif?']]},
trik:'Daftar “KOSONG-BATAS-DOBEL-TELAT”: input kosong, nilai batas, klik dobel, sesi kedaluwarsa. Empat sumber edge case paling umum.',
q:[['en','What ___ if the user clicks Pay twice?',['happens','happen','happening'],0],['en','The system should not ___ two orders.',['create','creates','creating'],0],['ms','“Apa yang terjadi jika” dalam BM:',['apa berlaku jika','apa jadi kalau-kalau','apa terjadi bila-bila'],0]]};

G[50]={t:'Test plan: scope includes, excludes, entry/exit',guru:'Test plan adalah dokumen yang menunjukkan kamu berpikir strategis, bukan hanya mengeksekusi. Bahasa test plan formal tapi polanya sederhana: apa yang termasuk, apa yang tidak, kapan mulai, kapan selesai.',
en:{f:[['[The scope of testing includes] + daftar','The scope of testing includes web, API, and Android.'],['[Out of scope:] + daftar','Out of scope: iOS and performance testing.'],['[Testing will start once] + kriteria masuk','Testing will start once the build passes smoke tests.'],['[We will sign off when] + kriteria keluar','We will sign off when there are no open critical bugs.']],
ex:[['Our test strategy is risk-based, so payments are tested first.','Strategi kami berbasis risiko, jadi pembayaran dites dulu.'],['The test estimation is five days for two testers.','Estimasi pengujian lima hari untuk dua tester.'],['The main risk is the unstable test environment.','Risiko utama adalah environment yang tidak stabil.']],
salah:[['Testing will start once the build will pass.','Testing will start once the build passes.','Once + present.']]},
ms:{f:[['[Skop ujian merangkumi] + senarai','Skop ujian merangkumi web, API, dan Android.'],['[Di luar skop:] + senarai','Di luar skop: iOS dan ujian prestasi.'],['[Ujian akan bermula sebaik sahaja] + kriteria','Ujian akan bermula sebaik sahaja binaan lulus ujian asap.']],
ex:[['Strategi ujian kami berasaskan risiko.','Strategi pengujian kami berbasis risiko.'],['Risiko utama ialah persekitaran ujian yang tidak stabil.','Risiko utama adalah lingkungan uji yang tidak stabil.']]},
trik:'Test plan = jawaban 5W1H: What (scope), Why (risk), Who (resource), When (schedule), Where (environment), How (strategy).',
q:[['en','The scope of testing ___ web and API.',['includes','include','including'],0],['en','We will sign off ___ there are no critical bugs.',['when','what','which'],0],['ms','“Mencakup” dalam BM formal:',['merangkumi','mencakupkan','meliputilah'],0]]};

G[51]={t:'EP dan BVA: between, below, above, inclusive',guru:'Equivalence partitioning dan boundary value analysis adalah teknik yang hampir pasti ditanyakan di interview QA. Kamu perlu kosakata angka dan batas yang tepat agar penjelasanmu meyakinkan.',
en:{f:[['Valid values are [between] X [and] Y [inclusive]','Valid ages are between 18 and 60 inclusive.'],['I would test [just below], [at], and [just above] + batas','I would test 17, 18, and 19 for the lower boundary.'],['[One value from each partition] + [is enough]','One value from each partition is enough, for example 30.'],['Values [below] X / [above] Y [are invalid]','Values below 18 or above 60 are invalid.']],
tbl:[['17','just below (invalid)'],['18','lower bound (valid)'],['19','just above (valid)'],['59 / 60 / 61','sekitar upper bound']],
ex:[['BVA finds bugs where developers use < instead of <=.','BVA menemukan bug saat developer pakai < bukan <=.'],['We have three partitions: below 18, 18 to 60, and above 60.','Ada tiga partisi: di bawah 18, 18 sampai 60, dan di atas 60.'],['EP reduces the number of test cases without losing coverage.','EP mengurangi jumlah test case tanpa kehilangan cakupan.']],
salah:[['between 18 until 60','between 18 and 60','between … and …']]},
ms:{f:[['Nilai sah [antara] X [hingga] Y','Umur sah antara 18 hingga 60.'],['Saya akan uji [tepat di bawah], [pada], dan [tepat di atas] sempadan','Saya akan uji 17, 18, dan 19 untuk sempadan bawah.']],
ex:[['Ada tiga partisi: bawah 18, 18 hingga 60, dan atas 60.','Ada tiga partisi: di bawah 18, 18 sampai 60, di atas 60.'],['Pemetakan kesetaraan mengurangkan bilangan kes ujian.','EP mengurangi jumlah test case.']]},
trik:'Rumus BVA “MIN-1, MIN, MIN+1, MAX-1, MAX, MAX+1”. Enam angka, hampir semua bug batas tertangkap.',
q:[['en','Valid ages are ___ 18 and 60.',['between','from','among'],0],['en','Untuk batas bawah 18, nilai “just below” adalah:',['17','18','19'],0],['ms','“Sampai” untuk rentang angka dalam BM:',['hingga','sampaikan','ke-sampai'],0]]};

G[52]={t:'Decision table: if both…, if either…',guru:'Decision table dipakai saat aturan bisnis punya banyak kondisi yang saling memengaruhi. Kunci bahasanya adalah kata both, either, neither untuk menggabungkan kondisi.',
en:{f:[['[If both] A [and] B [are true], then + hasil','If both the user is a member and the cart is above 100, shipping is free.'],['[If either] A [or] B + V, then + hasil','If either the card is expired or the CVV is wrong, the payment fails.'],['[If neither] A [nor] B + V, then + hasil','If neither condition is met, no discount is applied.'],['[With] N [conditions, there are] 2^N [combinations]','With three conditions, there are eight combinations.']],
ex:[['A decision table makes sure we don’t miss a combination.','Decision table memastikan tidak ada kombinasi yang terlewat.'],['We can collapse rules that lead to the same action.','Kita bisa menggabungkan aturan yang menghasilkan aksi sama.'],['State transition testing covers valid and invalid transitions.','State transition testing mencakup transisi valid dan tidak valid.']],
salah:[['If both A or B…','If both A and B… / If either A or B…','both + and, either + or, neither + nor.']]},
ms:{f:[['[Jika kedua-dua] A [dan] B [benar], maka + hasil','Jika kedua-dua pengguna ahli dan troli melebihi 100, penghantaran percuma.'],['[Jika sama ada] A [atau] B, maka + hasil','Jika sama ada kad tamat tempoh atau CVV salah, pembayaran gagal.']],
ex:[['Jadual keputusan memastikan tiada gabungan yang terlepas.','Decision table memastikan tidak ada kombinasi terlewat.'],['Dengan tiga syarat, ada lapan gabungan.','Dengan tiga kondisi, ada delapan kombinasi.']]},
trik:'Pasangan tetap: BOTH–AND, EITHER–OR, NEITHER–NOR. Seperti pasangan sepatu, jangan ditukar.',
q:[['en','If ___ the card is expired or the CVV is wrong, it fails.',['either','both','neither'],0],['en','With three conditions, there are ___ combinations.',['eight','six','nine'],0],['ms','“Baik A maupun B” dalam BM:',['kedua-dua A dan B','dua-dua A atau B','sama ada A dan B'],0]]};

G[53]={t:'Exploratory testing: I explored…, focusing on…',guru:'Exploratory testing bukan klik acak. Ia sesi terencana dengan charter dan catatan. Saat melapor, kamu perlu menjelaskan apa yang dieksplorasi, fokusnya, dan temuannya dengan bahasa yang rapi.',
en:{f:[['[I explored] + area, [focusing on] + fokus','I explored the checkout, focusing on vouchers and payment errors.'],['[During the session, I found] + temuan','During the session, I found two bugs and one usability issue.'],['[Charter:] Explore + target + [with] + sumber + [to discover] + informasi','Charter: Explore the cart with invalid vouchers to discover pricing bugs.']],
ex:[['I time-boxed the session to sixty minutes.','Saya membatasi sesi enam puluh menit.'],['I used the CRUD heuristic on the user profile.','Saya pakai heuristik CRUD pada profil pengguna.'],['Exploratory testing complements scripted testing.','Exploratory testing melengkapi pengujian terskrip.']],
salah:[['I explored the checkout focus on vouchers.','I explored the checkout, focusing on vouchers.','Pakai focusing (V-ing).']]},
ms:{f:[['[Saya meneroka] + kawasan, [dengan fokus kepada] + fokus','Saya meneroka pembayaran akhir dengan fokus kepada baucar.'],['[Semasa sesi, saya menemui] + temuan','Semasa sesi, saya menemui dua pepijat.']],
ex:[['Saya hadkan sesi kepada enam puluh minit.','Saya batasi sesi enam puluh menit.'],['Ujian penerokaan melengkapi ujian berskrip.','Exploratory testing melengkapi pengujian terskrip.']]},
trik:'Rumus charter “EXPLORE – WITH – TO DISCOVER”: apa yang dieksplorasi, dengan alat apa, untuk menemukan apa.',
q:[['en','I explored the cart, ___ on vouchers.',['focusing','focus','focused on to'],0],['en','During the session, I ___ two bugs.',['found','find','founded'],0],['ms','“Menjelajah” dalam konteks ujian BM:',['meneroka','menjelajah-jelah','menerokai-lah'],0]]};

G[54]={t:'Membandingkan jenis testing',guru:'“What is the difference between smoke and sanity testing?” adalah pertanyaan wajib interview. Kamu sudah belajar rumus perbandingan di bulan pertama; sekarang kita pakai untuk konsep testing.',
en:{f:[['A [is broader but shallower than] B','Smoke testing is broader but shallower than regression testing.'],['A [focuses on] X, [whereas] B [focuses on] Y','Smoke testing focuses on critical paths, whereas sanity testing focuses on one fix.'],['A [is done by] + pelaku + [before/after] + waktu','UAT is done by the client before go-live.']],
tbl:[['Smoke','luas, dangkal, build baru'],['Sanity','sempit, dalam, setelah fix'],['Regression','luas dan dalam, fitur lama'],['UAT','oleh pengguna/klien, sebelum rilis']],
ex:[['Regression testing makes sure new changes don’t break old features.','Regression testing memastikan perubahan baru tidak merusak fitur lama.'],['End-to-end testing covers the full user journey.','E2E testing mencakup perjalanan pengguna penuh.'],['Integration testing checks how modules work together.','Integration testing mengecek bagaimana modul bekerja sama.']],
salah:[['Smoke is more broad than…','Smoke is broader than…','Kata pendek pakai -er.']]},
ms:{f:[['A [lebih luas tetapi lebih cetek daripada] B','Ujian asap lebih luas tetapi lebih cetek daripada ujian regresi.'],['A [memberi fokus kepada] X, [manakala] B [memberi fokus kepada] Y','Ujian asap memberi fokus kepada laluan kritikal, manakala ujian kewarasan memberi fokus kepada satu pembaikan.']],
ex:[['Ujian regresi memastikan perubahan baharu tidak merosakkan ciri lama.','Regression memastikan perubahan baru tidak merusak fitur lama.'],['UAT dilakukan oleh pelanggan sebelum pelancaran.','UAT dilakukan klien sebelum go-live.']]},
trik:'Bayangkan rumah baru: SMOKE = nyalakan semua lampu sekali (luas, cepat). SANITY = cek satu keran yang baru diperbaiki. REGRESSION = periksa seluruh rumah setelah renovasi.',
q:[['en','Smoke testing is ___ than regression testing.',['shallower','more shallow','shallowest'],0],['en','Smoke focuses on critical paths, ___ sanity focuses on one fix.',['whereas','because','so that'],0],['ms','“Sedangkan” dalam BM formal:',['manakala','sedangkan-lah','padahal-nya'],0]]};

G[55]={t:'Melaporkan hasil tes dengan angka',guru:'Manajer menyukai angka. Laporan tes yang baik dimulai dengan ringkasan kuantitatif, lalu risiko dan rekomendasi. Hari ini kita latih membaca dan menulis statistik tes.',
en:{f:[['[Out of] N [test cases,] X [passed,] Y [failed, and] Z [were blocked]','Out of 120 test cases, 110 passed, 6 failed, and 4 were blocked.'],['[The pass rate is] + persen','The pass rate is 92 percent.'],['[There are] N [open bugs, including] M [critical]','There are five open bugs, including one critical.'],['[My recommendation is to] + V1','My recommendation is to delay the release by two days.']],
ex:[['The bug trend is going down week by week.','Tren bug turun dari minggu ke minggu.'],['Two known issues are listed in the release notes.','Dua known issue dicantumkan di release notes.'],['The quality gate status is green, so we are ready to go.','Status quality gate hijau, jadi kita siap rilis.']],
salah:[['The pass rate is 92 percents.','The pass rate is 92 percent.','Percent tanpa s.']]},
ms:{f:[['[Daripada] N [kes ujian,] X [lulus,] Y [gagal]','Daripada 120 kes ujian, 110 lulus dan 6 gagal.'],['[Kadar lulus ialah] + peratus','Kadar lulus ialah 92 peratus.'],['[Cadangan saya ialah] + Kata kerja','Cadangan saya ialah menangguhkan keluaran dua hari.']],
ex:[['Trend pepijat semakin menurun setiap minggu.','Tren bug terus turun setiap minggu.'],['Ada lima pepijat terbuka, termasuk satu kritikal.','Ada lima bug terbuka, termasuk satu kritis.']]},
trik:'Laporan “ANGKA – RISIKO – SARAN”: mulai dengan statistik, lanjut ke risiko terbesar, tutup dengan rekomendasi go/no-go.',
q:[['en','___ 120 test cases, 110 passed.',['Out of','From of','Between'],0],['en','My recommendation is ___ the release.',['to delay','delay','delaying to'],0],['ms','“Dari 120 kasus uji” dalam BM:',['daripada 120 kes ujian','dari 120 kasus-kasus uji','oleh 120 kes ujian'],0]]};
G[57]={t:'Menjelaskan framework: consists of, is responsible for',guru:'Mulai minggu ini kita masuk automation. Saat menjelaskan framework, kamu harus bisa memecahnya menjadi bagian-bagian dan menyebut tanggung jawab tiap bagian. Dua frasa ini akan kamu pakai berulang kali.',
en:{f:[['The framework [consists of] + daftar bagian','The framework consists of page objects, fixtures, tests, and utilities.'],['Bagian + [is responsible for] + V-ing','The page object is responsible for locating elements.'],['We [use] A [to] + V1','We use fixtures to set up the browser and test data.'],['[This makes the tests] + adjektiva','This makes the tests readable and maintainable.']],
ex:[['Each page object encapsulates the locators of one page.','Setiap page object membungkus locator satu halaman.'],['Tests only call page methods, never raw selectors.','Tes hanya memanggil method halaman, tidak pernah selector mentah.'],['We follow the single responsibility principle.','Kami mengikuti prinsip single responsibility.']],
salah:[['The framework is consist of…','The framework consists of…','consist tidak dipakai dengan is.']]},
ms:{f:[['Rangka kerja [terdiri daripada] + senarai','Rangka kerja terdiri daripada objek halaman, fixture, dan ujian.'],['Bahagian + [bertanggungjawab untuk] + Kata kerja','Objek halaman bertanggungjawab untuk mencari elemen.'],['Kami [guna] A [untuk] + Kata kerja','Kami guna fixture untuk menyediakan pelayar.']],
ex:[['Setiap objek halaman membalut pencari elemen satu halaman.','Setiap page object membungkus locator satu halaman.'],['Ini menjadikan ujian mudah dibaca dan diselenggara.','Ini membuat tes mudah dibaca dan dipelihara.']]},
trik:'Jelaskan framework seperti rumah: CONSISTS OF (ruangan apa saja), RESPONSIBLE FOR (fungsi tiap ruangan), USE … TO (alat apa untuk apa).',
q:[['en','The framework ___ page objects and fixtures.',['consists of','is consist of','consist'],0],['en','The page object is responsible for ___ elements.',['locating','locate','to locate'],0],['ms','“Terdiri dari” dalam BM baku:',['terdiri daripada','terdiri dari-pada','terdiri oleh'],0]]};

G[58]={t:'Memilih locator: prefer A over B because…',guru:'Locator yang buruk adalah penyebab utama tes rapuh. Di interview kamu akan ditanya strategi locatormu. Pola “prefer … over …” menunjukkan kamu punya prinsip, bukan sekadar kebiasaan.',
en:{f:[['I [prefer] A [over] B [because] + alasan','I prefer role selectors over XPath because they are more stable.'],['[Avoid] + V-ing / kata benda + [since] + alasan','Avoid dynamic IDs since they change on every load.'],['[If possible, we ask developers to] + V1','If possible, we ask developers to add data-testid attributes.']],
tbl:[['getByRole','terbaik: mirip cara pengguna'],['getByTestId','stabil, butuh bantuan dev'],['CSS selector','oke jika pendek'],['XPath','hindari jika bisa']],
ex:[['This locator is fragile because it depends on the DOM structure.','Locator ini rapuh karena bergantung pada struktur DOM.'],['The payment form is inside an iframe.','Form pembayaran ada di dalam iframe.'],['Strict mode fails when two elements match.','Strict mode gagal jika dua elemen cocok.']],
salah:[['I prefer role selector than XPath.','I prefer role selectors over / to XPath.','prefer A over/to B, bukan than.']]},
ms:{f:[['Saya [lebih suka] A [berbanding] B [kerana] + alasan','Saya lebih suka pemilih peranan berbanding XPath kerana lebih stabil.'],['[Elakkan] + benda + [kerana] + alasan','Elakkan ID dinamik kerana ia berubah setiap kali dimuat.']],
ex:[['Pencari elemen ini rapuh kerana bergantung pada struktur DOM.','Locator ini rapuh karena bergantung struktur DOM.'],['Borang pembayaran berada dalam iframe.','Form pembayaran berada di iframe.']]},
trik:'Pilih locator seperti pengguna melihat layar: ROLE dan teks dulu, TEST ID kalau perlu, CSS kalau terpaksa, XPATH paling akhir.',
q:[['en','I prefer role selectors ___ XPath.',['over','than','from'],0],['en','Avoid dynamic IDs ___ they change on every load.',['since','despite','unless'],0],['ms','“Lebih suka A dibanding B” dalam BM:',['lebih suka A berbanding B','lebih suka A daripada-pada B','suka lebih A dari B'],0]]};

G[59]={t:'Mengatasi flaky test: instead of…, we should…',guru:'Flaky test adalah musuh setiap automation engineer. Kamu perlu kalimat yang menjelaskan masalah dan solusi sekaligus. Pola “instead of … we should …” sangat efektif untuk itu.',
en:{f:[['[Instead of] + V-ing, we [should] + V1','Instead of using a hard wait, we should wait for the response.'],['[The test is flaky because] + S + V','The test is flaky because it depends on shared data.'],['[To make it deterministic, I] + V2','To make it deterministic, I created unique data per test.']],
ex:[['Playwright has auto-wait, so we rarely need explicit waits.','Playwright punya auto-wait, jadi jarang butuh explicit wait.'],['We quarantine flaky tests until they are fixed.','Kami mengkarantina tes flaky sampai diperbaiki.'],['I opened the trace viewer to see what happened.','Saya buka trace viewer untuk melihat apa yang terjadi.']],
salah:[['Instead of use sleep…','Instead of using sleep…','Instead of + V-ing.']]},
ms:{f:[['[Daripada] + Kata kerja, kita [patut] + Kata kerja','Daripada guna tunggu keras, kita patut tunggu respons.'],['[Ujian ini tidak stabil kerana] + ayat','Ujian ini tidak stabil kerana bergantung pada data dikongsi.']],
ex:[['Playwright ada tunggu automatik.','Playwright punya auto-wait.'],['Kami kuarantin ujian tidak stabil sehingga dibaiki.','Kami karantina tes flaky sampai diperbaiki.']]},
trik:'“INSTEAD OF selalu diikuti ING”, sama seperti preposisi lain (before testing, after deploying, without waiting).',
q:[['en','Instead of ___ a hard wait, wait for the response.',['using','use','to use'],0],['en','Penyebab paling umum flaky test:',['masalah sinkronisasi dan data bersama','terlalu banyak komentar','nama file panjang'],0],['ms','“Daripada (alih-alih)” dalam BM:',['daripada','dari pada-nya','alih-alih-lah'],0]]};

G[60]={t:'Menjelaskan API test: sends…, asserts that…',guru:'API test lebih cepat dan stabil daripada UI test. Saat menjelaskannya, ikuti alur: kirim apa, ke mana, lalu verifikasi apa. Kata kerja “assert” dan “validate” akan menjadi teman setiamu.',
en:{f:[['The test [sends a] + method + [request to] + endpoint','The test sends a POST request to /orders.'],['[It asserts that] + S + V','It asserts that the status code is 201.'],['[It validates] + benda + [against] + skema','It validates the response body against the JSON schema.'],['[Without a valid token, the API returns] + kode','Without a valid token, the API returns 401.']],
ex:[['We chain requests to pass the order ID to the next call.','Kami merangkai request untuk meneruskan order ID.'],['We mock the payment API in negative tests.','Kami me-mock API pembayaran di tes negatif.'],['The API returns 429 when the rate limit is reached.','API mengembalikan 429 saat batas laju tercapai.']],
salah:[['It asserts the status code 201.','It asserts that the status code is 201.','Butuh kalimat lengkap setelah that.']]},
ms:{f:[['Ujian [menghantar permintaan] + kaedah + [ke] + titik akhir','Ujian menghantar permintaan POST ke /orders.'],['[Ia menegaskan bahawa] + ayat','Ia menegaskan bahawa kod status ialah 201.']],
ex:[['Tanpa token sah, API memulangkan 401.','Tanpa token valid, API mengembalikan 401.'],['Kami merantai permintaan untuk menghantar ID pesanan.','Kami merangkai request untuk meneruskan ID order.']]},
trik:'Rumus API test “KIRIM – TERIMA – CEK”: sends a request, receives a response, asserts status, body, schema, dan header.',
q:[['en','The test sends a POST request ___ /orders.',['to','at','in'],0],['en','It asserts ___ the status code is 201.',['that','what','which'],0],['ms','“Mengembalikan (return)” dalam konteks API BM:',['memulangkan','mengembalikan-kan','pulangkanlah'],0]]};

G[61]={t:'CI dan laporan: runs on every…, is uploaded to…',guru:'Tes otomatis baru bernilai kalau berjalan rutin dan hasilnya terlihat. Hari ini kamu belajar menjelaskan kapan tes jalan, bagaimana diparalelkan, dan ke mana hasilnya dikirim.',
en:{f:[['The tests [run on every] + peristiwa','The tests run on every pull request.'],['We [run] N tests [in parallel across] M [workers]','We run 600 tests in parallel across four workers.'],['Results [are uploaded to] + tujuan','Results are uploaded to Allure and a Slack channel.'],['[This reduced] + metrik + [from] A [to] B','This reduced execution time from 40 to 12 minutes.']],
ex:[['We attach screenshots and videos on failure.','Kami melampirkan screenshot dan video saat gagal.'],['The nightly run covers cross-browser tests.','Run malam mencakup tes lintas peramban.'],['Our flaky rate is below two percent.','Tingkat flaky kami di bawah dua persen.']],
salah:[['This reduced the time from 40 into 12.','This reduced the time from 40 to 12.','from … to …']]},
ms:{f:[['Ujian [berjalan pada setiap] + peristiwa','Ujian berjalan pada setiap permintaan tarik.'],['Keputusan [dimuat naik ke] + destinasi','Keputusan dimuat naik ke Allure.'],['[Ini mengurangkan] + metrik + [daripada] A [kepada] B','Ini mengurangkan masa daripada 40 kepada 12 minit.']],
ex:[['Kami lampirkan tangkapan skrin semasa gagal.','Kami lampirkan screenshot saat gagal.'],['Larian malam meliputi ujian merentas pelayar.','Run malam mencakup tes lintas peramban.']]},
trik:'Selalu sebut DAMPAK dengan angka: “from 40 to 12 minutes”. Angka “dari–ke” adalah bahasa favorit pewawancara dan manajer.',
q:[['en','We run tests in parallel ___ four workers.',['across','between of','among in'],0],['en','This reduced the time ___ 40 ___ 12 minutes.',['from / to','since / until','of / at'],0],['ms','“Diunggah ke” dalam BM:',['dimuat naik ke','diunggah-kan ke','dinaikkan muat ke'],0]]};

G[62]={t:'BDD dan Cucumber: maps to, is shared via',guru:'BDD membuat skenario bisa dibaca orang bisnis. Sebagai automation engineer, kamu menjelaskan bagaimana kalimat Gherkin terhubung ke kode. Bedakan langkah deklaratif (perilaku) dan imperatif (klik-klik UI).',
en:{f:[['Each Gherkin step [maps to] + a step definition','Each Gherkin step maps to a step definition in TypeScript.'],['Shared data [is stored in] + the world object','Shared data is stored in the world object.'],['Hooks [run before/after] + each scenario','The Before hook runs before each scenario and opens the browser.'],['[Write] declarative steps [like] … [instead of] …','Write declarative steps like “When the user logs in” instead of listing clicks.']],
ex:[['We use cucumber expressions like {string} and {int}.','Kami pakai cucumber expression seperti {string} dan {int}.'],['Tags help us run only smoke scenarios.','Tag membantu kami menjalankan skenario smoke saja.'],['Step definitions call page objects, not raw locators.','Step definition memanggil page object, bukan locator mentah.']],
salah:[['Each step map to…','Each step maps to…','Each + V-s.']]},
ms:{f:[['Setiap langkah Gherkin [dipetakan kepada] + definisi langkah','Setiap langkah Gherkin dipetakan kepada definisi langkah.'],['Cangkuk [berjalan sebelum] + setiap senario','Cangkuk Before berjalan sebelum setiap senario.']],
ex:[['Tag membantu kami menjalankan senario asap sahaja.','Tag membantu kami jalankan skenario smoke saja.'],['Definisi langkah memanggil objek halaman.','Step definition memanggil page object.']]},
trik:'Deklaratif = “APA” (the user logs in). Imperatif = “BAGAIMANA” (click, type, click). Gherkin untuk APA, kode untuk BAGAIMANA.',
q:[['en','Each Gherkin step ___ to a step definition.',['maps','map','mapping'],0],['en','Langkah Gherkin yang lebih baik:',['When the user logs in with valid credentials','When I click on #username and type text','When click button id 23'],0],['ms','“Dipetakan ke” dalam BM:',['dipetakan kepada','dipeta ke','memetakan oleh'],0]]};
G[64]={t:'Tell me about yourself: rumus Present–Past–Future',guru:'Minggu interview dimulai. Pertanyaan pertama hampir selalu “Tell me about yourself.” Jangan menceritakan hidupmu dari lahir. Pakai rumus tiga bagian ini dan latih sampai kamu bisa mengucapkannya dalam 60–90 detik tanpa melihat catatan.',
en:{f:[['[Present:] I’m currently + peran + [at] + perusahaan, [where I] + V1','I’m currently a QA engineer at a fintech company, where I test web and API.'],['[Past:] [Before that,] I + V2 / I have + V3 … [for] + durasi','Before that, I worked as a manual tester for three years.'],['[Future:] [Now I’m looking for] + peluang + [where I can] + V1','Now I’m looking for a role where I can grow in automation.']],
ex:[['I specialize in web and API testing using Playwright and Postman.','Saya berspesialisasi di pengujian web dan API dengan Playwright dan Postman.'],['I have hands-on experience with PostgreSQL and CI pipelines.','Saya punya pengalaman langsung dengan PostgreSQL dan pipeline CI.'],['I’m passionate about building quality into the process early.','Saya bersemangat membangun kualitas sejak awal proses.']],
salah:[['I born in Jakarta and I like football.','Start with your current role.','Fokus pada karier, bukan hobi atau tempat lahir.']]},
ms:{f:[['[Kini] saya + peranan + [di] + syarikat','Kini saya jurutera QA di sebuah syarikat fintech.'],['[Sebelum itu,] saya + Kata kerja + [selama] + tempoh','Sebelum itu, saya bekerja sebagai penguji manual selama tiga tahun.'],['[Sekarang saya mencari] + peluang + [untuk] + Kata kerja','Sekarang saya mencari peluang untuk berkembang dalam automasi.']],
ex:[['Saya mengkhusus dalam ujian web dan API.','Saya berspesialisasi di pengujian web dan API.'],['Saya bersemangat tentang kualiti perisian.','Saya bersemangat soal kualitas perangkat lunak.']]},
trik:'“SEKARANG – DULU – NANTI” dalam 90 detik. Tutup dengan alasan kenapa kamu cocok untuk posisi itu.',
q:[['en','Bagian pertama jawaban “Tell me about yourself” sebaiknya:',['peran dan pekerjaanmu saat ini','tempat dan tanggal lahir','hobi favorit'],0],['en','I’m currently a QA engineer, ___ I test web and API.',['where','which','who'],0],['ms','“Saat ini” dalam BM formal:',['kini','kininya','saat-kini'],0]]};

G[65]={t:'Jawaban STAR: Situation, Task, Action, Result',guru:'Pertanyaan perilaku seperti “Tell me about a time when…” dijawab dengan rumus STAR. Perhatikan tense-nya: semua cerita memakai simple past, dan bagian Result wajib punya angka. Pewawancara menilai struktur, bukan hanya isinya.',
en:{f:[['[Situation:] [In my last project,] + S + V2','In my last project, our regression took three days.'],['[Task:] [My task was to] + V1','My task was to reduce the regression time.'],['[Action:] [So I] + V2 … [and] + V2','So I automated the top 200 test cases and ran them in parallel.'],['[Result:] [As a result,] + angka','As a result, regression dropped from three days to two hours.']],
ex:[['The biggest challenge was a tight deadline.','Tantangan terbesar adalah tenggat yang ketat.'],['I took the initiative to talk to the product owner.','Saya berinisiatif bicara dengan product owner.'],['The lesson I learned was to involve QA earlier.','Pelajaran yang saya petik adalah melibatkan QA lebih awal.']],
salah:[['As a result, it was better.','As a result, escaped bugs dropped by 40 percent.','Result harus terukur.']]},
ms:{f:[['[Dalam projek terakhir saya,] + ayat lampau','Dalam projek terakhir saya, regresi mengambil masa tiga hari.'],['[Tugas saya ialah] + Kata kerja','Tugas saya ialah mengurangkan masa regresi.'],['[Hasilnya,] + angka','Hasilnya, regresi turun daripada tiga hari kepada dua jam.']],
ex:[['Cabaran terbesar ialah tarikh akhir yang ketat.','Tantangan terbesar adalah tenggat yang ketat.'],['Saya mengambil inisiatif untuk berbincang dengan pemilik produk.','Saya berinisiatif bicara dengan product owner.']]},
trik:'STAR = 20% Situation-Task, 60% Action, 20% Result. Ceritakan apa yang KAMU lakukan (I), bukan tim (we).',
q:[['en','Bagian terpanjang jawaban STAR sebaiknya:',['Action','Situation','Task'],0],['en','In my last project, our regression ___ three days.',['took','takes','has took'],0],['ms','“Hasilnya” dalam BM:',['Hasilnya','Hasil-hasilnya','Berhasilnya'],0]]};

G[66]={t:'“How would you test…?”: rumus would',guru:'Pertanyaan desain test case (login, keranjang, lift, pensil) menguji cara berpikirmu. Karena situasinya hipotetis, pakai would. Strukturnya: tanya dulu, lalu jelaskan kategori pengujian secara berurutan.',
en:{f:[['[First, I would ask] + pertanyaan klarifikasi','First, I would ask about the password policy and lockout rules.'],['[Then I would cover] + kategori','Then I would cover functional, negative, security, and UI tests.'],['[For example, I would check that] + S + V','For example, I would check that the account locks after five failed attempts.'],['[Finally, I would] + V1','Finally, I would automate the critical scenarios.']],
ex:[['I would test valid and invalid credentials, empty fields, and case sensitivity.','Saya akan menguji kredensial valid/tidak valid, field kosong, dan case sensitivity.'],['On the security side, I would test SQL injection and brute force.','Dari sisi keamanan, saya akan menguji SQL injection dan brute force.'],['I would also check accessibility and keyboard navigation.','Saya juga akan cek aksesibilitas dan navigasi keyboard.']],
salah:[['I will test…','I would test…','Untuk situasi hipotetis di interview, pakai would.']]},
ms:{f:[['[Pertama, saya akan tanya] + soalan','Pertama, saya akan tanya tentang polisi kata laluan.'],['[Kemudian saya akan meliputi] + kategori','Kemudian saya akan meliputi ujian fungsian, negatif, dan keselamatan.']],
ex:[['Saya akan uji kelayakan sah dan tidak sah serta medan kosong.','Saya akan uji kredensial valid dan tidak valid serta field kosong.'],['Saya juga akan semak navigasi papan kekunci.','Saya juga akan cek navigasi keyboard.']]},
trik:'Rumus “TANYA – KATEGORI – CONTOH – OTOMASI”. Kategori: Functional, Negative, Boundary, Security, UI/UX, Performance, Compatibility.',
q:[['en','In a hypothetical interview question, use:',['I would test…','I tested…','I have tested…'],0],['en','First, I would ___ clarifying questions.',['ask','asking','asked'],0],['ms','“Saya akan” dalam BM:',['saya akan','saya mahu-akan','saya hendak-lah'],0]]};

G[67]={t:'Bercerita tentang bug terbaikmu',guru:'“Tell me about the best bug you found” adalah kesempatan emas untuk pamer kemampuan analisis. Gabungkan STAR dengan bahasa bug yang sudah kamu pelajari: kondisi, dampak, root cause, dan pencegahan.',
en:{f:[['[The most interesting bug I found was] + deskripsi','The most interesting bug I found was a rounding issue in the discount.'],['[It only happened when] + kondisi','It only happened when two vouchers were combined.'],['[The impact was] + dampak','The impact was a financial loss on every order.'],['[I caught it by] + V-ing','I caught it by comparing the API total with a database query.']],
ex:[['I reported it with logs, a SQL query, and a video.','Saya melaporkannya dengan log, query SQL, dan video.'],['After the fix, I added a regression test as a preventive action.','Setelah fix, saya menambah tes regresi sebagai pencegahan.'],['When I missed a bug, I analyzed why and updated our checklist.','Saat saya melewatkan bug, saya analisis sebabnya dan memperbarui checklist.']],
salah:[['I caught it by compare…','I caught it by comparing…','by + V-ing.']]},
ms:{f:[['[Pepijat paling menarik yang saya jumpa ialah] + deskripsi','Pepijat paling menarik yang saya jumpa ialah isu pembundaran pada diskaun.'],['[Kesannya ialah] + kesan','Kesannya ialah kerugian kewangan pada setiap pesanan.']],
ex:[['Saya laporkannya dengan log dan pertanyaan SQL.','Saya laporkan dengan log dan query SQL.'],['Selepas pembaikan, saya tambah ujian regresi.','Setelah fix, saya tambah tes regresi.']]},
trik:'Cerita bug terbaik = “KONDISI LANGKA + DAMPAK BESAR + CARA MENEMUKAN YANG CERDAS”. Siapkan dua cerita: satu bug teknis, satu bug logika bisnis.',
q:[['en','I caught it by ___ the API total with a SQL query.',['comparing','compare','compared'],0],['en','Unsur terpenting cerita bug di interview:',['dampak dan cara menemukannya','warna tombolnya','nama developernya'],0],['ms','“Dampaknya adalah” dalam BM:',['kesannya ialah','dampaknya adalah-lah','impaknya iaitu-nya'],0]]};

G[68]={t:'Situasi sulit: In that situation, I would…',guru:'Pertanyaan situasional menguji kematangan profesionalmu: tanpa requirement, tenggat mepet, konflik dengan developer. Jawaban terbaik selalu tenang, berbasis data, dan kolaboratif. Pakai would untuk hipotetis, atau STAR jika pernah mengalaminya.',
en:{f:[['[In that situation, I would first] + V1','In that situation, I would first talk to the product owner.'],['[If there were no requirements, I would] + V1','If there were no requirements, I would learn from the existing app and competitors.'],['[I would push back politely by] + V-ing','I would push back politely by showing the risk with data.'],['[My priority would be to] + V1','My priority would be to test the critical paths first.']],
ex:[['I stay calm under pressure and focus on facts.','Saya tetap tenang di bawah tekanan dan fokus pada fakta.'],['I would be transparent about what was not tested.','Saya akan transparan tentang apa yang belum dites.'],['We found a compromise: release with a feature flag.','Kami menemukan kompromi: rilis dengan feature flag.']],
salah:[['If there are no requirements, I would…','If there were no requirements, I would…','Pengandaian hipotetis: were + would.']]},
ms:{f:[['[Dalam situasi itu, saya akan] + Kata kerja','Dalam situasi itu, saya akan berbincang dengan pemilik produk dahulu.'],['[Jika tiada keperluan, saya akan] + Kata kerja','Jika tiada keperluan, saya akan kaji aplikasi sedia ada.']],
ex:[['Saya kekal tenang di bawah tekanan.','Saya tetap tenang di bawah tekanan.'],['Saya akan telus tentang perkara yang belum diuji.','Saya akan transparan tentang yang belum dites.']]},
trik:'Rumus “TENANG – DATA – SOLUSI”: jangan menyalahkan siapa pun, bawa angka risiko, tawarkan opsi kompromi.',
q:[['en','If there ___ no requirements, I would ask the PO.',['were','are','will be'],0],['en','I would push back politely by ___ the risk.',['showing','show','to show'],0],['ms','“Tetap tenang” dalam BM:',['kekal tenang','tetap tenang-lah','tenang tetap'],0]]};

G[69]={t:'Bertanya balik ke pewawancara dan menutup interview',guru:'Di akhir interview kamu akan ditanya “Do you have any questions for us?” Jangan jawab “No.” Pertanyaan yang cerdas menunjukkan minat dan kedewasaan. Tutup dengan ucapan terima kasih yang hangat.',
en:{f:[['[Could you tell me more about] + topik + [?]','Could you tell me more about the QA team structure?'],['[What does success look like in] + periode + [?]','What does success look like in the first ninety days?'],['[How do you] + V1 + [?]','How do you measure quality in your team?'],['[Thank you for your time. I look forward to] + V-ing','Thank you for your time. I look forward to hearing from you.']],
ex:[['What is the ratio of testers to developers?','Berapa rasio tester terhadap developer?'],['What is the next step in the process?','Apa langkah berikutnya dalam proses ini?'],['I really enjoyed our conversation today.','Saya sangat menikmati percakapan kita hari ini.']],
salah:[['I look forward to hear from you.','I look forward to hearing from you.','look forward to + V-ing.']]},
ms:{f:[['[Boleh terangkan lebih lanjut tentang] + topik?','Boleh terangkan lebih lanjut tentang struktur pasukan QA?'],['[Apakah langkah seterusnya] + dalam proses?','Apakah langkah seterusnya dalam proses?'],['[Terima kasih atas masa anda. Saya menantikan] + benda','Terima kasih atas masa anda. Saya menantikan maklum balas anda.']],
ex:[['Bagaimana anda mengukur kualiti dalam pasukan?','Bagaimana Anda mengukur kualitas di tim?'],['Saya sangat menghargai perbualan kita hari ini.','Saya sangat menghargai percakapan kita hari ini.']]},
trik:'“LOOK FORWARD TO + ING” adalah jebakan klasik: to di sini preposisi, bukan to infinitive.',
q:[['en','I look forward to ___ from you.',['hearing','hear','heard'],0],['en','Jawaban terbaik untuk “Do you have any questions?”:',['Could you tell me more about the QA team?','No, thank you.','How much is the salary?'],0],['ms','“Saya menantikan” artinya:',['saya menantikan','saya menunggu-nunggu-kan','saya menanti-lah'],0]]};

G[71]={t:'Menjelaskan framework di interview: I designed/built…',guru:'“Walk me through your framework” adalah pertanyaan inti interview automation. Pakai past tense untuk apa yang kamu bangun dan present tense untuk cara kerjanya sekarang. Sebut keputusan desain dan alasannya.',
en:{f:[['[I built] + framework + [using] + tools','I built a framework using Playwright, TypeScript, and Allure.'],['[It follows] + pola + [with] + bagian','It follows the Page Object Model with component objects for shared parts.'],['[We chose] A [because] + alasan','We chose Playwright because of auto-wait and network interception.'],['[It currently runs] + angka + [on] + platform','It currently runs 800 tests on GitHub Actions.']],
ex:[['Test data is created through API calls, not through the UI.','Data tes dibuat lewat API, bukan lewat UI.'],['Secrets are stored in the CI vault, not in the repository.','Rahasia disimpan di vault CI, bukan di repositori.'],['The design is extensible, so other teams can add their own tests.','Desainnya bisa diperluas sehingga tim lain bisa menambah tes.']],
salah:[['I build it last year.','I built it last year.','last year → past (build → built).']]},
ms:{f:[['[Saya membina] + rangka kerja + [menggunakan] + alat','Saya membina rangka kerja menggunakan Playwright dan TypeScript.'],['[Kami memilih] A [kerana] + alasan','Kami memilih Playwright kerana tunggu automatik.']],
ex:[['Data ujian dicipta melalui API, bukan melalui UI.','Data tes dibuat lewat API, bukan lewat UI.'],['Rahsia disimpan dalam peti besi CI.','Rahasia disimpan di vault CI.']]},
trik:'Rumus “ALAT – POLA – ALASAN – ANGKA”: tools apa, pola desain apa, kenapa memilihnya, dan berapa tes/berapa cepat sekarang.',
q:[['en','I ___ a framework using Playwright last year.',['built','build','have build'],0],['en','We chose Playwright ___ auto-wait.',['because of','because','so'],0],['ms','“Membangun” framework dalam BM:',['membina','membangunkan-lah','bangun-kan'],0]]};

G[72]={t:'Membandingkan tool: Playwright, WDIO, Selenium, Cypress',guru:'Pewawancara ingin tahu apakah kamu memilih tool berdasarkan alasan, bukan tren. Pakai rumus perbandingan dari bulan pertama dan tambahkan kata transisi untuk menyeimbangkan kelebihan dan kekurangan.',
en:{f:[['A [is faster than] B [because] + alasan','Playwright is faster than Selenium because it uses the DevTools protocol.'],['A [supports] X, [while] B [doesn’t]','WebdriverIO supports native mobile with Appium, while Playwright doesn’t.'],['[On the other hand,] + S + V','On the other hand, Selenium has a bigger community.'],['[It depends on] + faktor','It depends on the project, the team’s skills, and the platforms.']],
ex:[['Playwright handles multiple tabs and iframes easily.','Playwright menangani banyak tab dan iframe dengan mudah.'],['Cypress runs inside the browser, which has some limitations.','Cypress berjalan di dalam browser, yang punya beberapa batasan.'],['Tool selection should match the product and the team.','Pemilihan tool harus sesuai produk dan tim.']],
salah:[['Playwright is more fast…','Playwright is faster…','Kata pendek → -er.']]},
ms:{f:[['A [lebih pantas daripada] B [kerana] + alasan','Playwright lebih pantas daripada Selenium kerana guna protokol DevTools.'],['[Sebaliknya,] + ayat','Sebaliknya, Selenium ada komuniti yang lebih besar.'],['[Ia bergantung pada] + faktor','Ia bergantung pada projek dan kemahiran pasukan.']],
ex:[['Playwright mengendalikan berbilang tab dengan mudah.','Playwright menangani banyak tab dengan mudah.'],['Pemilihan alat patut sesuai dengan produk.','Pemilihan tool harus sesuai produk.']]},
trik:'Jangan pernah bilang satu tool “paling bagus”. Jawaban senior selalu: “It depends on…” lalu sebut 2–3 faktor.',
q:[['en','WebdriverIO supports native mobile, ___ Playwright doesn’t.',['while','because','so that'],0],['en','Jawaban paling senior untuk “Which tool is best?”:',['It depends on the project and the team.','Playwright is always the best.','I only know one tool.'],0],['ms','“Di sisi lain” dalam BM:',['sebaliknya','di sebelah lain-nya','pada pihak lain-lah'],0]]};

G[73]={t:'Cerita memperbaiki flaky test',guru:'Hampir semua interview automation menanyakan flaky test. Jawaban terbaik menunjukkan proses investigasi, bukan sekadar “I added a retry.” Gabungkan root cause, solusi, dan metrik keberhasilan.',
en:{f:[['[First, I looked for a failure pattern in] + sumber','First, I looked for a failure pattern in the Allure history.'],['[The root cause was] + kata benda','The root cause was shared test data between parallel workers.'],['[So I] + V2 + [so that] + S + V','So I generated unique data per test so that tests no longer collide.'],['[As a result, the flaky rate dropped from] A [to] B','As a result, the flaky rate dropped from 8 to 1 percent.']],
ex:[['Retrying hides the problem; it doesn’t fix it.','Retry menyembunyikan masalah, bukan memperbaikinya.'],['A flaky test gives no reliable signal.','Tes flaky tidak memberi sinyal yang andal.'],['We also cleaned up data after each test.','Kami juga membersihkan data setelah setiap tes.']],
salah:[['I fix it with add retry.','I fixed it by removing the shared state.','Sebut solusi akar, bukan retry.']]},
ms:{f:[['[Punca utamanya ialah] + kata benda','Punca utamanya ialah data ujian yang dikongsi.'],['[Jadi saya] + Kata kerja + [supaya] + ayat','Jadi saya jana data unik supaya ujian tidak bertembung.']],
ex:[['Cuba semula menyembunyikan masalah, bukan membaikinya.','Retry menyembunyikan masalah, bukan memperbaiki.'],['Kami bersihkan data selepas setiap ujian.','Kami bersihkan data setelah setiap tes.']]},
trik:'Rumus “POLA – AKAR – SOLUSI – ANGKA”. Retry hanya boleh disebut sebagai pengaman sementara, bukan solusi.',
q:[['en','The root cause ___ shared test data.',['was','were','been'],0],['en','Solusi terbaik untuk flaky karena data bersama:',['data unik per tes','retry tiga kali','menambah sleep 5 detik'],0],['ms','“Akar masalahnya adalah” dalam BM:',['punca utamanya ialah','akar masalahnya adalah-lah','sumber akar ialah'],0]]};

G[74]={t:'API dan database di interview: I validate… by…',guru:'Dengan stack-mu (REST, PostgreSQL), pertanyaan backend testing adalah kesempatan bersinar. Kamu perlu menjelaskan apa yang kamu validasi dan caranya, plus mampu membacakan query SQL dengan lancar.',
en:{f:[['[I validate] + benda + [by] + V-ing','I validate the order by querying the orders table after the API call.'],['[To find] + target, [I would use] + teknik SQL','To find duplicate emails, I would use GROUP BY with HAVING COUNT greater than one.'],['[A] left join [returns] … [, while an] inner join [returns] …','A left join returns all rows from the left table, while an inner join returns only matches.']],
ex:[['I never trust frontend validation alone; I test the API directly.','Saya tidak pernah hanya percaya validasi frontend; saya tes API langsung.'],['I check status code, schema, headers, and business rules.','Saya cek status code, skema, header, dan aturan bisnis.'],['I use EXPLAIN ANALYZE to understand slow queries.','Saya pakai EXPLAIN ANALYZE untuk memahami query lambat.']],
salah:[['I validate by query the table.','I validate it by querying the table.','by + V-ing.']]},
ms:{f:[['[Saya sahkan] + benda + [dengan] + Kata kerja','Saya sahkan pesanan dengan membuat pertanyaan pada jadual pesanan.'],['[Untuk mencari] + sasaran, [saya akan guna] + teknik','Untuk mencari e-mel pendua, saya akan guna GROUP BY dan HAVING.']],
ex:[['Saya tidak bergantung pada validasi bahagian hadapan sahaja.','Saya tidak hanya bergantung pada validasi frontend.'],['Saya semak kod status, skema, dan peraturan perniagaan.','Saya cek status code, skema, dan aturan bisnis.']]},
trik:'Lapisan validasi “STATUS – SKEMA – DATA – DB”: kode HTTP, bentuk JSON, nilai bisnis, lalu cek di database.',
q:[['en','I validate the order by ___ the database.',['querying','query','queried'],0],['en','Untuk mencari email duplikat dipakai:',['GROUP BY … HAVING COUNT(*) > 1','ORDER BY email','DELETE FROM users'],0],['ms','“Memverifikasi dengan” dalam BM:',['mengesahkan dengan','verifikasi-kan dengan','mensahkan oleh'],0]]};

G[75]={t:'CI/CD, paralel, dan test pyramid',guru:'Pertanyaan tentang CI menguji apakah kamu berpikir skala tim, bukan hanya laptopmu. Gunakan test pyramid untuk menjelaskan strategi dan angka untuk menunjukkan dampak.',
en:{f:[['[We follow the test pyramid:] [many] A, [fewer] B, [and only a few] C','We follow the test pyramid: many unit tests, fewer API tests, and only a few UI tests.'],['[Smoke tests run as] + pemeriksaan + [, and the full suite runs] + jadwal','Smoke tests run as a pull request check, and the full suite runs nightly.'],['[We split the suite into] N [shards to] + V1','We split the suite into four shards to keep feedback under ten minutes.']],
ex:[['A fast feedback loop keeps developers productive.','Feedback loop yang cepat menjaga produktivitas developer.'],['Our retry policy allows one retry in CI only.','Kebijakan retry kami hanya mengizinkan satu retry di CI.'],['Allure history shows the test trend over time.','Riwayat Allure menunjukkan tren tes dari waktu ke waktu.']],
salah:[['Few UI tests is better.','Fewer UI tests are better.','Bandingkan dengan fewer; tests jamak → are.']]},
ms:{f:[['[Kami ikut piramid ujian:] banyak A, kurang B, sedikit C','Kami ikut piramid ujian: banyak ujian unit, kurang ujian API, sedikit ujian UI.'],['[Kami bahagikan suit kepada] N [bahagian untuk] + Kata kerja','Kami bahagikan suit kepada empat bahagian untuk mempercepat maklum balas.']],
ex:[['Gelung maklum balas yang pantas mengekalkan produktiviti.','Feedback cepat menjaga produktivitas.'],['Sejarah Allure menunjukkan trend ujian.','Riwayat Allure menunjukkan tren tes.']]},
trik:'Piramida “BANYAK – SEDANG – SEDIKIT”: unit (bawah, banyak, cepat), API (tengah), UI (atas, sedikit, mahal).',
q:[['en','We follow the test pyramid: ___ UI tests.',['only a few','many','most'],0],['en','We split the suite into four ___ .',['shards','shard','sharding of'],0],['ms','“Membagi menjadi” dalam BM:',['membahagikan kepada','membagi jadi-kan','bahagi-lah ke'],0]]};

G[76]={t:'Live coding: berpikir keras dengan bahasa Inggris',guru:'Di sesi live coding, pewawancara menilai cara berpikirmu sama pentingnya dengan kodenya. Diam selama lima menit adalah sinyal buruk. Hafalkan frasa “think aloud” ini supaya kamu bisa terus bicara sambil berpikir.',
en:{f:[['[Let me make sure I understand:] + ulang soal','Let me make sure I understand: I need to reverse each word, not the whole string.'],['[My approach is to] + V1 + [, then] + V1','My approach is to split the string, then reverse each word.'],['[Let me check an edge case:] + kasus','Let me check an edge case: an empty string.'],['[The time complexity is] + notasi','The time complexity is O of n.']],
ex:[['I’ll write a simple version first and optimize later.','Saya akan tulis versi sederhana dulu, lalu optimasi.'],['Let me walk through the code with an example.','Saya jelaskan kodenya langkah demi langkah dengan contoh.'],['I’m not sure about this method name; can I look it up?','Saya tidak yakin nama method ini; boleh saya cek?']],
salah:[['(diam 5 menit)','Let me think out loud…','Selalu verbalisasikan pikiranmu.']]},
ms:{f:[['[Biar saya pastikan saya faham:] + ulang soalan','Biar saya pastikan saya faham: saya perlu terbalikkan setiap perkataan.'],['[Pendekatan saya ialah] + Kata kerja + [, kemudian] + Kata kerja','Pendekatan saya ialah pecahkan rentetan, kemudian terbalikkan setiap perkataan.']],
ex:[['Saya akan tulis versi mudah dahulu.','Saya akan tulis versi sederhana dulu.'],['Biar saya semak kes pinggir: rentetan kosong.','Saya cek kasus tepi: string kosong.']]},
trik:'Empat frasa penyelamat: “Let me make sure I understand”, “My approach is”, “Let me check an edge case”, “Let me walk through it”.',
q:[['en','Langkah pertama di live coding sebaiknya:',['memastikan paham soal dengan mengulanginya','langsung menulis kode tanpa bicara','bertanya gaji'],0],['en','My approach is ___ the string.',['to split','split','splitting to'],0],['ms','“Pendekatan saya adalah” dalam BM:',['pendekatan saya ialah','pendekatan saya adalah-lah','dekat saya ialah'],0]]};

G[78]={t:'Stand-up: Yesterday, Today, Blockers',guru:'Minggu terakhir! Kita rapikan komunikasi kerja harian. Stand-up punya rumus tiga bagian yang dipakai di seluruh dunia. Kalau kamu bisa melakukannya dengan lancar dalam 30 detik, kamu sudah terdengar seperti anggota tim internasional.',
en:{f:[['[Yesterday I] + V2 …','Yesterday I finished testing the refund flow.'],['[Today I’m going to] + V1 …','Today I’m going to automate the checkout tests.'],['[I’m blocked by] + kata benda / [No blockers.]','I’m blocked by the staging server. No other blockers.'],['[Just a heads-up:] + info','Just a heads-up: the nightly build is red.']],
ex:[['I’ll pick up the next ticket after lunch.','Saya akan ambil tiket berikutnya setelah makan siang.'],['Let’s take this offline after the stand-up.','Mari bahas ini terpisah setelah stand-up.'],['Ping me if you need help with the API tests.','Hubungi saya kalau butuh bantuan tes API.']],
salah:[['Yesterday I finish…','Yesterday I finished…','yesterday → V2.']]},
ms:{f:[['[Semalam saya] + Kata kerja …','Semalam saya siapkan ujian aliran bayaran balik.'],['[Hari ini saya akan] + Kata kerja …','Hari ini saya akan automasikan ujian pembayaran.'],['[Saya tersekat oleh] + kata benda','Saya tersekat oleh pelayan staging.']],
ex:[['Saya akan ambil tiket seterusnya selepas makan tengah hari.','Saya ambil tiket berikutnya setelah makan siang.'],['Hubungi saya jika perlukan bantuan.','Hubungi saya kalau butuh bantuan.']]},
trik:'Stand-up “KEMARIN – HARI INI – HAMBATAN”, maksimal 30 detik. Detail teknis panjang? “Let’s take this offline.”',
q:[['en','Yesterday I ___ the refund tests.',['finished','finish','have finish'],0],['en','I’m blocked ___ the staging server.',['by','with of','from at'],0],['ms','“Kemarin saya” dalam BM:',['semalam saya','kemarin saya','kelmarin-lah saya'],0]]};

G[79]={t:'Demo dan presentasi: signposting',guru:'Demo fitur adalah momen untuk terlihat. Signposting, yaitu kata penunjuk arah dalam presentasi, membuat audiens tidak tersesat. Kombinasikan dengan rencana masa depan yang sudah kamu pelajari di bulan pertama.',
en:{f:[['[Let me walk you through] + topik','Let me walk you through the new checkout flow.'],['[As you can see,] + S + V','As you can see, the page loads in under one second.'],['[Moving on to] + topik berikut','Moving on to the error handling.'],['[To sum up,] + ringkasan','To sum up, the feature is tested and ready.']],
ex:[['The key benefit is fewer steps for the customer.','Manfaat utamanya adalah langkah yang lebih sedikit untuk pelanggan.'],['One limitation is that offline mode is not supported yet.','Satu batasannya adalah mode offline belum didukung.'],['Feel free to interrupt me with questions.','Silakan potong saya kalau ada pertanyaan.']],
salah:[['Let me walk you the new flow.','Let me walk you through the new flow.','walk someone through.']]},
ms:{f:[['[Biar saya bawa anda melihat] + topik','Biar saya bawa anda melihat aliran pembayaran baharu.'],['[Seperti yang anda lihat,] + ayat','Seperti yang anda lihat, halaman dimuat kurang dari satu saat.'],['[Kesimpulannya,] + ringkasan','Kesimpulannya, ciri ini sudah diuji dan sedia.']],
ex:[['Manfaat utamanya ialah kurang langkah untuk pelanggan.','Manfaat utamanya langkah lebih sedikit untuk pelanggan.'],['Jangan segan bertanya.','Jangan sungkan bertanya.']]},
trik:'Presentasi “PEMBUKA – PENUNJUK – PENUTUP”: Let me walk you through → As you can see / Moving on → To sum up.',
q:[['en','Let me walk you ___ the new feature.',['through','across','over to'],0],['en','Frasa untuk pindah ke bagian berikutnya:',['Moving on to…','To sum up…','Let me make sure…'],0],['ms','“Kesimpulannya” dalam BM:',['kesimpulannya','simpulnya-lah','berkesimpulan'],0]]};

G[80]={t:'Laporan insiden: kronologi dengan past tense',guru:'Laporan insiden menggabungkan semua tense lampau yang sudah kamu kuasai: simple past untuk kejadian, past continuous untuk latar, past perfect untuk urutan. Nada yang benar adalah blameless: fokus pada sistem, bukan orang.',
en:{f:[['[At] + waktu, + S + V2','At 10:05, the payment service started returning errors.'],['[While] + S + [was/were V-ing], + S + V2','While we were deploying, the database connection pool ran out.'],['[By the time] + S + V2, + S + [had] + V3','By the time we noticed, 300 orders had failed.'],['[Going forward, we will] + V1','Going forward, we will add an alert for connection usage.']],
ex:[['Detection time was ten minutes and resolution time was one hour.','Waktu deteksi sepuluh menit dan waktu resolusi satu jam.'],['This was a severity one, customer-facing incident.','Ini insiden severity satu yang berdampak ke pelanggan.'],['We run blameless postmortems to learn, not to blame.','Kami menjalankan postmortem tanpa menyalahkan untuk belajar.']],
salah:[['Ali broke production.','A config change caused the outage.','Laporan blameless fokus pada penyebab, bukan orang.']]},
ms:{f:[['[Pada pukul] + waktu, + ayat lampau','Pada pukul 10:05, perkhidmatan pembayaran mula memulangkan ralat.'],['[Semasa] kami + Kata kerja, + ayat','Semasa kami membuat atur gerak, sambungan pangkalan data habis.'],['[Selepas ini, kami akan] + Kata kerja','Selepas ini, kami akan tambah amaran untuk penggunaan sambungan.']],
ex:[['Masa pengesanan sepuluh minit dan masa penyelesaian satu jam.','Waktu deteksi sepuluh menit dan resolusi satu jam.'],['Kami jalankan bedah siasat tanpa menyalahkan.','Kami lakukan postmortem tanpa menyalahkan.']]},
trik:'Kronologi insiden “KAPAN – APA – DAMPAK – PERBAIKAN – PENCEGAHAN”. Tulis jam di awal setiap kalimat.',
q:[['en','By the time we noticed, 300 orders ___ failed.',['had','have','has'],0],['en','Going forward, we ___ add an alert.',['will','would have','had'],0],['ms','“Ke depannya” dalam BM:',['selepas ini','ke depannya-lah','hadapan-nya'],0]]};

G[81]={t:'Negosiasi scope dan tenggat: We can… if we…',guru:'Saat tenggat mepet, QA sering ditekan untuk memotong testing. Kamu perlu bernegosiasi dengan tenang: tawarkan opsi, sebut risiko, dan buat kesepakatan. Rumus kondisional tipe 1 menjadi senjatamu.',
en:{f:[['[We can deliver] X [by] + waktu [if we] + V1','We can deliver the MVP by Friday if we move reports to phase two.'],['[If we skip] + benda, [the risk is that] + S + V','If we skip regression, the risk is that old features break.'],['[I can’t commit to] + benda, [but I can] + V1','I can’t commit to full testing, but I can cover the critical paths.'],['[How about if we] + V1 + [?]','How about if we add one day of buffer?']],
ex:[['Login and payment are must-haves; dark mode is a nice-to-have.','Login dan pembayaran wajib; dark mode opsional.'],['Is this timeline feasible with two testers?','Apakah timeline ini realistis dengan dua tester?'],['The client agreed to the new date in exchange for early access.','Klien setuju tanggal baru dengan imbalan akses awal.']],
salah:[['We can deliver if we will move…','We can deliver if we move…','If + present.']]},
ms:{f:[['[Kami boleh siapkan] X [sebelum] + waktu [jika kita] + Kata kerja','Kami boleh siapkan MVP sebelum Jumaat jika kita pindahkan laporan ke fasa dua.'],['[Jika kita langkau] + benda, [risikonya ialah] + ayat','Jika kita langkau regresi, risikonya ialah ciri lama rosak.']],
ex:[['Log masuk dan pembayaran wajib ada.','Login dan pembayaran wajib ada.'],['Adakah garis masa ini boleh dilaksanakan?','Apakah timeline ini bisa dilaksanakan?']]},
trik:'Jangan pernah bilang “No” saja. Ganti dengan “Yes, if…”: Yes, we can deliver by Friday IF we descope reports.',
q:[['en','We can deliver by Friday if we ___ reports to phase two.',['move','will move','moved will'],0],['en','I can’t commit ___ full testing.',['to','for','at'],0],['ms','“Melewatkan (skip)” dalam BM:',['melangkau','lewat-kan','skip-lah'],0]]};

G[82]={t:'Mock interview: gabungkan semua rumus',guru:'Hari ini adalah gladi resik. Kamu akan memakai semua rumus interview: perkenalan, STAR, would untuk hipotetis, perbandingan tool, dan pertanyaan penutup. Ucapkan jawabanmu dengan suara keras, rekam, lalu dengarkan lagi.',
en:{f:[['[Could you elaborate on] + topik + [?]','Could you elaborate on your API testing experience?'],['[For example,] + cerita singkat','For example, I built a contract test suite for our payment API.'],['[To be honest,] + kelemahan + [, but] + upaya','To be honest, I haven’t used Cypress much, but I learn tools quickly.'],['[That’s a good question. Let me think for a second.]','That’s a good question. Let me think for a second.']],
ex:[['I was shortlisted after the take-home assignment.','Saya masuk daftar pendek setelah tugas take-home.'],['Many questions in the technical round are scenario-based.','Banyak pertanyaan di tahap teknis berbasis skenario.'],['Speak slowly and sound confident.','Bicara pelan dan terdengar percaya diri.']],
salah:[['I don’t know.','I haven’t worked with that yet, but here is how I would approach it.','Ubah “tidak tahu” menjadi cara berpikir.']]},
ms:{f:[['[Boleh huraikan tentang] + topik?','Boleh huraikan tentang pengalaman ujian API anda?'],['[Sejujurnya,] + kelemahan + [, tetapi] + usaha','Sejujurnya, saya jarang guna Cypress, tetapi saya cepat belajar.']],
ex:[['Saya disenarai pendek selepas tugasan bawa pulang.','Saya masuk daftar pendek setelah tugas take-home.'],['Bercakap perlahan dan kedengaran yakin.','Bicara pelan dan terdengar percaya diri.']]},
trik:'Saat tidak tahu jawabannya: AKUI – HUBUNGKAN – PENDEKATAN. “I haven’t used X, but I’ve used Y, so I would approach it by…”',
q:[['en','Respons terbaik saat tidak tahu jawabannya:',['I haven’t used it yet, but here is how I would approach it.','I don’t know.','Next question, please.'],0],['en','To be honest, I ___ used Cypress much.',['haven’t','didn’t have','am not'],0],['ms','“Sejujurnya” dalam BM:',['sejujurnya','jujurnya-lah','sejujur-jujurnya kali'],0]]};

G[83]={t:'Negosiasi gaji dan menerima tawaran',guru:'Pelajaran penutup tiga bulan: menegosiasikan nilaimu. Bahasa yang sopan namun percaya diri sangat penting. Sebut dasar angkamu (pengalaman, pasar), tetap fleksibel, dan selalu tutup dengan positif.',
en:{f:[['[Based on] + dasar, [I’m looking for] + rentang','Based on my experience and the market rate, I’m looking for 8,000 to 9,000 ringgit.'],['[Is there any flexibility on] + benda + [?]','Is there any flexibility on the base salary?'],['[I’m happy to] + V1 + [if] + syarat','I’m happy to accept if we can agree on the start date.'],['[Could you share more about] + benda + [?]','Could you share more about the benefits package?']],
ex:[['My notice period is one month.','Masa pemberitahuan saya satu bulan.'],['I received the offer letter and I’m reviewing it.','Saya sudah terima surat penawaran dan sedang meninjaunya.'],['Thank you, I’m excited to join the team.','Terima kasih, saya antusias bergabung dengan tim.']],
salah:[['I want 9,000. Final.','Based on my experience, I’m looking for around 9,000. Is there any flexibility?','Selalu beri dasar dan buka ruang diskusi.']]},
ms:{f:[['[Berdasarkan] + asas, [saya mengharapkan] + julat','Berdasarkan pengalaman saya, saya mengharapkan 8,000 hingga 9,000 ringgit.'],['[Adakah gaji boleh dirunding?]','Adakah gaji boleh dirunding?'],['[Saya gembira menerima tawaran ini]','Saya gembira menerima tawaran ini.']],
ex:[['Tempoh notis saya sebulan.','Masa pemberitahuan saya satu bulan.'],['Terima kasih, saya teruja untuk menyertai pasukan.','Terima kasih, saya antusias bergabung dengan tim.']]},
trik:'Rumus “DASAR – RENTANG – FLEKSIBEL – POSITIF”: based on…, a range, any flexibility?, excited to join.',
q:[['en','___ my experience, I’m looking for 9,000 ringgit.',['Based on','Base in','Basing at'],0],['en','Is there any flexibility ___ the base salary?',['on','at','to'],0],['ms','“Masa pemberitahuan (notice period)” dalam BM:',['tempoh notis','masa notis-kan','waktu pemberitahuan-lah'],0]]};
const IQ = [
[29,'What makes a good bug report?','A good bug report has a clear title with the component, the problem, and the condition. It includes numbered steps, expected and actual results, environment details, and evidence such as logs, screenshots, or a video. A developer should be able to reproduce it without asking me questions.','Sebut komponen judul, langkah, expected vs actual, environment, dan bukti.'],
[30,'What is the difference between severity and priority? Give examples.','Severity is the technical impact of a bug, while priority is how soon the business wants it fixed. For example, a typo in the company logo is low severity but high priority. A crash in an old admin report is high severity but low priority.','Selalu beri dua contoh yang berlawanan.'],
[31,'Explain the bug lifecycle.','A bug starts as New, then it is triaged and Assigned. The developer moves it to In Progress and then Fixed. QA retests it: if it passes, it is Closed; if not, it is Reopened. A bug can also be Rejected, Deferred, or marked as a Duplicate.','Sebut alur utama lalu status alternatif.'],
[32,'What do you do when a developer cannot reproduce your bug?','First, I check my environment details and test data. Then I try to isolate the condition, for example browser, time zone, or account type. I record a video and share logs. If needed, I do a short pair-testing session with the developer.','Tunjukkan sikap kolaboratif, bukan defensif.'],
[33,'How do you do a root cause analysis?','I collect evidence from logs, the database, and recent changes. Then I use the five whys to go from the symptom to the real cause. Finally, I propose a preventive action, such as a new test, an alert, or a code review rule.','Gejala → lima mengapa → pencegahan.'],
[34,'How do you handle a disagreement with a developer about a bug?','I stay calm and keep it evidence-based. I show the requirement, logs, and the user impact. If we still disagree, I involve the product owner, because they decide the expected behavior. The goal is the product, not winning the argument.','Kalimat kunci: “The goal is the product, not winning.”'],
[36,'Where does QA fit in Agile?','In Agile, QA is involved from the start. We join refinement to clarify acceptance criteria, test during the sprint, automate regression, and help define the definition of done. Quality is a team responsibility, not a final phase.','Tekankan shift-left dan tanggung jawab tim.'],
[37,'How do you test a user story with unclear requirements?','I list my assumptions and ask clarifying questions in refinement. I convert the story into concrete examples with Given, When, Then. If something is still unclear, I test the most likely behavior and flag the risk.','Asumsi + pertanyaan + contoh konkret.'],
[38,'What is the difference between 401 and 403?','401 Unauthorized means the user is not authenticated, for example the token is missing or expired. 403 Forbidden means the user is authenticated but does not have permission for that action.','401 = siapa kamu? 403 = tidak boleh.'],
[39,'How do you validate data in the database after an API call?','After the API call, I query the related tables to check that the right rows were inserted or updated. I verify foreign keys, statuses, timestamps, and audit records. For stored procedures, I compare the output with the expected business result.','Sebut tabel, relasi, dan audit.'],
[40,'What is the role of QA in a CI/CD pipeline?','QA designs the test stages: unit and API tests on every pull request, smoke tests after deployment, and a full regression on schedule. We set quality gates so a failed build cannot move forward, and we keep the tests fast and reliable.','Sebut tahap, quality gate, dan kecepatan.'],
[41,'What do you look for when reviewing test code?','I check readability, correct use of page objects, stable locators, no hard waits, independent tests, and meaningful assertions. I also check that test data is cleaned up and that names describe the behavior.','Daftar cek review yang konkret.'],
[43,'How do you test business rules?','I turn each rule into examples with positive and negative cases, especially at the boundaries. I test at the API level to make sure the backend enforces the rule, not only the UI. I use decision tables when rules combine.','Backend harus menegakkan aturan, bukan hanya UI.'],
[44,'How would you test an order status workflow?','I would draw a state diagram, then test every valid transition and the important invalid ones, like Cancelled to Paid. I would also check side effects such as inventory, notifications, and audit logs at each transition.','State diagram + efek samping.'],
[45,'How do you test price calculations?','I confirm the formula, the order of operations, and the rounding rule with the product owner. Then I create examples with boundary values, multiple discounts, and taxes. I compare the API result with my own calculation or a SQL query.','Urutan, pembulatan, batas.'],
[46,'How do you test role-based access control?','I create a matrix of roles and actions. For each role, I test allowed and forbidden actions at both the UI and the API, because hiding a button is not security. I also try privilege escalation, like changing IDs in the request.','Uji di API, bukan hanya sembunyikan tombol.'],
[47,'What makes good acceptance criteria?','Good acceptance criteria are clear, testable, and measurable. They describe behavior, not implementation. I like the Given, When, Then format because the business, developers, and QA can all read it.','Clear, testable, measurable.'],
[48,'How do you find edge cases?','I ask “what if” questions: empty values, boundaries, special characters, double submits, expired sessions, slow networks, and concurrency. I also look at past production bugs for patterns.','Sebut daftar heuristik.'],
[50,'What do you include in a test plan?','A test plan includes the scope and what is out of scope, the strategy and risks, the environments and resources, the schedule, entry and exit criteria, and the deliverables like test cases and reports.','5W1H.'],
[51,'Explain equivalence partitioning and boundary value analysis with an example.','For an age field that accepts 18 to 60, equivalence partitioning gives three groups: below 18, 18 to 60, and above 60, so I test one value from each. Boundary value analysis tests the edges: 17, 18, 19, and 59, 60, 61, because bugs often hide there.','Selalu pakai contoh angka.'],
[52,'When do you use a decision table?','I use a decision table when the output depends on several conditions together, like membership, cart total, and voucher type. It makes sure I cover every combination and don’t miss a rule.','Kombinasi kondisi.'],
[53,'What is exploratory testing and how do you structure it?','Exploratory testing is simultaneous learning, test design, and execution. I structure it with a charter, a time-box, and session notes. At the end, I report what I covered, what I found, and the risks.','Charter + time-box + notes.'],
[54,'What is the difference between smoke, sanity, and regression testing?','Smoke testing is a broad, shallow check of critical paths on a new build. Sanity testing is a narrow check of a specific fix or change. Regression testing is broad and deep and makes sure existing features still work.','Gunakan analogi rumah.'],
[55,'Which QA metrics do you report?','I report pass rate, open bugs by severity, defect trends, test coverage of requirements, escaped defects after release, and for automation, execution time and flaky rate. Metrics should support decisions, not just look good.','Metrik untuk keputusan.'],
[57,'Why do you use the Page Object Model?','The Page Object Model separates test logic from page details. Locators and actions live in one place, so when the UI changes, I update one class instead of many tests. It makes tests readable, reusable, and maintainable.','Satu perubahan UI = satu file.'],
[58,'What is your locator strategy?','I prefer user-facing locators like getByRole and getByLabel, then data-testid attributes. I avoid long CSS chains, XPath, and dynamic IDs because they are fragile.','Urutan prioritas locator.'],
[59,'How do you handle waits in Playwright?','I rely on Playwright’s auto-wait and web-first assertions. When I need to wait, I wait for a specific condition, like a response or an element state, never a fixed timeout.','Tidak pernah hard wait.'],
[60,'How do you automate API tests?','I use Playwright’s request context or a similar client. Each test sends a request, then asserts the status code, schema, headers, and business data. I also write negative tests for auth, validation, and rate limits.','Status, schema, data, negatif.'],
[61,'How do you report automation results?','We use Allure for detailed reports with steps, screenshots, videos, and traces on failure. Results are published from CI, and failures send a Slack alert with a link to the report.','Allure + CI + Slack.'],
[62,'What is the value of BDD with Cucumber?','BDD creates a shared language between business, developers, and QA. Gherkin scenarios become living documentation and executable tests. The key is declarative steps, otherwise the scenarios become hard to maintain.','Bahasa bersama + dokumentasi hidup.'],
[64,'Tell me about yourself.','I’m currently a QA engineer at a fintech company, where I test web applications and REST APIs and maintain our Playwright framework. Before that, I worked for three years as a manual tester in e-commerce, which gave me a strong business sense. Now I’m looking for a role where I can grow in automation and help build a strong quality culture.','Present – Past – Future, 60–90 detik.'],
[64,'What are your strengths?','My main strength is attention to detail combined with business understanding. For example, I often find logic bugs in calculations before they reach production. I also communicate clearly with developers, which makes bug fixing faster.','Kekuatan + contoh nyata.'],
[64,'What is your biggest weakness?','I used to spend too much time on low-risk areas because I wanted to test everything. Now I use risk-based testing and agree on priorities with the team first, which helps me focus on what matters most.','Kelemahan nyata + perbaikan.'],
[65,'Tell me about a time you worked under a tight deadline.','In my last project, the client moved the release two days earlier. My task was to make sure the critical flows were safe. I prioritized payment and login, ran exploratory sessions, and shared a clear risk list with the PM. As a result, we released on time with zero critical bugs.','STAR dengan hasil terukur.'],
[65,'Tell me about a mistake you made.','Once I missed a bug in the refund flow because I tested only full refunds. When it reached production, I took ownership, helped fix it, and added partial refund cases to our regression suite. Since then, I always check variations of money flows.','Akui, perbaiki, cegah.'],
[65,'Describe a conflict with a team member.','A developer closed my bug as not a bug. I asked for a short call, showed the acceptance criteria and a video, and listened to his view. We found the story was unclear, so we asked the product owner together. The result was a clearer requirement and a better working relationship.','Fokus pada solusi dan hubungan.'],
[66,'How would you test a login page?','First, I would clarify the requirements: password policy, lockout rules, and SSO. Then I would cover functional tests with valid and invalid credentials, negative tests like empty fields, security tests like SQL injection, brute force, and password masking, plus usability and accessibility. Finally, I would automate the critical scenarios.','Tanya – kategori – contoh – otomasi.'],
[66,'How would you test a shopping cart?','I would test adding, updating, and removing items, quantity limits, price and discount calculations, stock changes, persistence after logout, and behavior with expired vouchers. I would also test concurrency, like two tabs updating the same cart.','Fungsi, perhitungan, stok, persistensi.'],
[66,'How would you test a file upload feature?','I would test allowed and blocked file types, size limits at the boundaries, empty and corrupted files, file names with special characters, interrupted uploads, multiple uploads, and security, like uploading a script disguised as an image.','Tipe, ukuran, gangguan, keamanan.'],
[67,'Tell me about the best bug you found.','The most interesting bug I found was a rounding issue in the discount calculation. It only happened when two vouchers were combined, and each order lost a few cents. I caught it by comparing the API total with a SQL query. After the fix, I added regression tests for combined discounts.','Kondisi langka, dampak, cara menemukan.'],
[67,'Give an example of high severity but low priority.','A crash on a rarely used legacy report page is high severity because the page is unusable, but low priority because very few users need it and there is a workaround.','Contoh yang meyakinkan.'],
[67,'What do you do when a bug reaches production?','First, I help reproduce it and assess the impact. After the fix, I verify it in production if possible. Then I analyze why we missed it and add a test or update our checklist, without blaming anyone.','Respons, verifikasi, pencegahan.'],
[68,'How do you test without requirements?','I talk to the product owner and developers, explore the existing application, check similar competitor products, and use common sense and domain knowledge. I document my assumptions and get them confirmed.','Sumber informasi alternatif.'],
[68,'What do you do if there is not enough time to test everything?','I use risk-based testing: I focus on critical business flows and areas with recent changes. I clearly communicate what was tested, what was not, and the risks, so the team can make an informed decision.','Risiko + transparansi.'],
[68,'What would you do if the manager wants to release with a critical bug?','I would explain the impact clearly with data, for example how many users are affected. I would suggest alternatives like a hotfix plan or a feature flag. In the end, it is a business decision, but it must be an informed one.','Keputusan bisnis yang terinformasi.'],
