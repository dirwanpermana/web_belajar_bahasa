<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kata Kerja – Pelatih Bicara Inggris & Malaysia untuk QA</title>
<meta name="theme-color" content="#4353FF">
<meta name="description" content="Kata Kerja: pelatih bicara bahasa Inggris dan Bahasa Malaysia untuk QA engineer. Kosakata IT, cerita, dialog, interview, dan latihan pelafalan.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kata Kerja">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FC;--surface:#FFFFFF;--surface-2:#F7F8FD;--ink:#10163A;--text:#2B3256;--muted:#6B7294;--line:#E4E8F3;
  --primary:#4353FF;--primary-soft:#EBEDFF;--violet:#7A5AF8;--good:#0FA874;--good-soft:#E2F8EF;--mid:#E39500;--mid-soft:#FFF4D9;--bad:#E5434F;--bad-soft:#FDE8EA;
  --en:#4353FF;--en-soft:#EBEDFF;--ms:#B27800;--ms-soft:#FFF2CC;
  --grad:linear-gradient(135deg,#4353FF 0%,#6A55FA 55%,#9A5CFF 100%);
  --shadow:0 1px 2px rgba(16,22,58,.05),0 6px 20px rgba(16,22,58,.06);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1024;--surface:#141A36;--surface-2:#1A2142;--ink:#F1F3FF;--text:#D6DBF5;--muted:#959CC2;--line:#262E57;--primary:#7383FF;--primary-soft:#222A5E;--good:#3DD39E;--good-soft:#123A2D;--mid:#F5B83D;--mid-soft:#3A2F12;--bad:#FF6B76;--bad-soft:#40181E;--en:#8C99FF;--en-soft:#222A5E;--ms:#F3C450;--ms-soft:#3A3117;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1024;--surface:#141A36;--surface-2:#1A2142;--ink:#F1F3FF;--text:#D6DBF5;--muted:#959CC2;--line:#262E57;--primary:#7383FF;--primary-soft:#222A5E;--good:#3DD39E;--good-soft:#123A2D;--mid:#F5B83D;--mid-soft:#3A2F12;--bad:#FF6B76;--bad-soft:#40181E;--en:#8C99FF;--en-soft:#222A5E;--ms:#F3C450;--ms-soft:#3A3117;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.6 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{color:var(--ink);line-height:1.2;margin:0 0 .45em;letter-spacing:-.02em;font-weight:800}
h1{font-size:clamp(1.7rem,4.5vw,2.3rem)} h2{font-size:1.3rem} h3{font-size:1.08rem}
p{margin:0 0 .7em} button{font:inherit;color:inherit} small{font-size:.8rem}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:.9rem 0} .row.tight{margin:.3rem 0;gap:.5rem} .row.between{justify-content:space-between;margin:0}
textarea,input[type=search],select{font:inherit;color:var(--text);background:var(--surface-2);border:1.5px solid var(--line);border-radius:14px;padding:.75rem .9rem;width:100%}
select{width:auto;max-width:100%} textarea:focus,input:focus,select:focus{border-color:var(--primary);outline:none}

/* ---- App shell ---- */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
#side{display:none}
#mtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:.5rem;padding:.6rem 1rem;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand-sm{display:flex;align-items:center;gap:.5rem;font-weight:800;color:var(--ink);margin-right:auto}
.logo{display:inline-flex;align-items:flex-end;gap:2px;width:26px;height:26px;padding:5px;border-radius:9px;background:var(--grad)}
.logo i{flex:1;background:#fff;border-radius:2px}.logo i:nth-child(1){height:45%}.logo i:nth-child(2){height:100%}.logo i:nth-child(3){height:70%}
.pill{font-size:.82rem;font-weight:700;padding:.25rem .55rem;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
main{width:100%;max-width:880px;margin:0 auto;padding:1.2rem 1rem 6.5rem}
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:.3rem .2rem calc(.35rem + env(safe-area-inset-bottom,0px))}
#bottom a{display:flex;flex-direction:column;align-items:center;gap:.05rem;font-size:.72rem;font-weight:700;color:var(--muted);text-decoration:none;padding:.3rem 0;position:relative;border-radius:12px}
#bottom a .ni{font-size:1.2rem;line-height:1.2} #bottom a[aria-current="page"]{color:var(--primary)}
#bottom a[aria-current="page"] .ni{background:var(--primary-soft);border-radius:999px;padding:0 .8rem}
.badge{position:absolute;top:0;right:22%;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:.68rem;font-style:normal;display:grid;place-items:center}
@media (min-width:960px){
  .app{grid-template-columns:260px 1fr} #mtop,#bottom{display:none}
  #side{display:flex;flex-direction:column;gap:1.2rem;position:sticky;top:0;height:100vh;padding:1.4rem 1rem;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}
  main{padding:2rem 2rem 4rem}
}
.brand{display:flex;align-items:center;gap:.7rem;font-weight:800;font-size:1.15rem;color:var(--ink)} .brand .logo{width:38px;height:38px;padding:8px;border-radius:12px}
.brand small{display:block;font-weight:600;color:var(--muted);font-size:.75rem;letter-spacing:0}
.side-nav{display:grid;gap:.2rem}
.side-nav a{display:flex;align-items:center;gap:.7rem;padding:.65rem .8rem;border-radius:12px;color:var(--text);text-decoration:none;font-weight:600;position:relative}
.side-nav a:hover{background:var(--surface-2)} .side-nav a[aria-current="page"]{background:var(--primary-soft);color:var(--primary);font-weight:800}
.side-nav .ni{width:1.4rem;text-align:center} .side-nav .badge{position:static;margin-left:auto}
.side-stats{margin-top:auto;display:grid;gap:.5rem;padding:1rem;border-radius:16px;background:var(--surface-2)} .side-stats p{margin:0}
.lvl{display:grid;grid-template-columns:auto 1fr;gap:.2rem .6rem;align-items:center} .lvl small{grid-column:2;color:var(--muted)}
.lv-badge{font-weight:800;color:#fff;background:var(--grad);border-radius:8px;padding:.1rem .5rem;font-size:.85rem;grid-row:span 2}
.lv-bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden} .lv-bar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .5s}
.lv-bar.big{height:10px;margin:.6rem 0 .3rem}
.lang-switch{display:flex;gap:.35rem}
.lang-tg{display:flex;align-items:center;gap:.4rem;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:.35rem .55rem;cursor:pointer;font-weight:700;font-size:.85rem;color:var(--muted);opacity:.55;filter:grayscale(.8);transition:all .15s}
.lang-tg[aria-pressed="true"]{opacity:1;filter:none;color:var(--ink);border-color:var(--primary);background:var(--primary-soft)}
#side .lang-tg{flex:1;justify-content:center}
.flag{display:inline-flex;width:1.5rem;height:.95rem;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.12);flex:none;vertical-align:-.12em;margin-right:.35rem} .lang-tg .flag{margin:0} .flag svg{width:100%;height:100%;display:block}

/* ---- Buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;background:var(--primary);color:#fff;border:0;border-radius:14px;padding:.7rem 1.15rem;font-weight:700;cursor:pointer;min-height:2.75rem;box-shadow:0 4px 14px color-mix(in srgb,var(--primary) 30%,transparent);transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:scale(.98)} .btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none} .btn.ghost:hover{background:var(--surface-2)}
.btn.soft{background:var(--primary-soft);color:var(--primary);box-shadow:none}
.btn.white{background:#fff;color:#3340E0;box-shadow:0 6px 18px rgba(0,0,0,.15)} .btn.glass{background:rgba(255,255,255,.18);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.35)}
.btn.big{min-height:3.2rem;padding:.8rem 1.5rem;font-size:1.02rem;border-radius:16px} .btn.small{min-height:2.1rem;padding:.35rem .8rem;font-size:.88rem;border-radius:11px}
.btn.rec{background:var(--bad);color:#fff}
.round{width:2.6rem;height:2.6rem;border-radius:50%;display:inline-grid;place-items:center;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:.95rem;flex:none;vertical-align:middle}
.round.sm{width:2rem;height:2rem;font-size:.75rem} .round:hover{background:var(--primary-soft);border-color:var(--primary-soft)}
.link{background:none;border:0;padding:0;color:var(--primary);text-decoration:underline;cursor:pointer;text-align:left}
.mic-btn{width:76px;height:76px;border-radius:50%;border:0;background:var(--grad);color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 10px 26px color-mix(in srgb,var(--primary) 40%,transparent);position:relative;transition:transform .15s}
.mic-btn:hover{transform:scale(1.05)} .mic-ico{font-size:1.9rem;filter:grayscale(1) brightness(5)}
.mic-btn.small{width:46px;height:46px} .mic-btn.small .mic-ico{font-size:1.2rem}
.mic-btn.rec{background:var(--bad)} .mic-btn.rec::before,.mic-btn.rec::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--bad);animation:ripple 1.6s ease-out infinite}
.mic-btn.rec::after{animation-delay:.8s}
@keyframes ripple{from{transform:scale(1);opacity:.7}to{transform:scale(1.8);opacity:0}}

/* ---- Cards & chips ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:1.2rem 1.25rem;margin:0 0 1rem;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;font-weight:700;font-size:.74rem;padding:.15rem .5rem;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.en{background:var(--en-soft);color:var(--en)} .chip.ms{background:var(--ms-soft);color:var(--ms)} .chip.gram{background:var(--primary-soft);color:var(--violet)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.good{background:var(--good-soft);color:var(--good)}
.chip .flag{width:1.1rem;height:.7rem;margin-right:.3rem}
.cat{font-size:.8rem;font-weight:700;color:var(--muted);margin:0}
.eyebrow-s{font-size:.85rem;font-weight:700;color:var(--muted);margin:0 0 .2rem} .eyebrow-s.light{color:rgba(255,255,255,.85)}
.note{font-size:.92rem;color:var(--text);background:var(--mid-soft);border-radius:12px;padding:.7rem .9rem}
.err{color:var(--bad);font-weight:700} .okmsg{color:var(--good);font-weight:700}
.empty{padding:1.5rem 0;color:var(--muted)}
.empty-card{text-align:center;padding:1.6rem} .empty-ico{width:56px;height:56px;margin:0 auto .6rem;border-radius:50%;display:grid;place-items:center;background:var(--good-soft);color:var(--good);font-size:1.6rem;font-weight:800}
.page-head{margin-bottom:1.2rem}

/* ---- Rings ---- */
.ring{position:relative;display:inline-grid;place-items:center;flex:none}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)} .ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .trk{stroke:var(--line)} .ring .val{stroke:var(--primary);transition:stroke-dasharray .8s ease}
.ring.good .val{stroke:var(--good)} .ring.mid .val{stroke:var(--mid)} .ring.low .val{stroke:var(--bad)}
.ring b{position:relative;font-weight:800;font-size:1.25rem;color:var(--ink)} .ring b i{font-style:normal;font-size:.7em;color:var(--muted)}
.ring small{position:absolute;bottom:-1.4rem;white-space:nowrap;color:var(--muted)}
.ring.good b{color:var(--good)} .ring.mid b{color:var(--mid)} .ring.low b{color:var(--bad)}

/* ---- Home ---- */
.home-head h1{margin:0} .home-head p{margin:0}
.hero-card{display:flex;gap:1.2rem;align-items:center;justify-content:space-between;background:var(--grad);color:#fff;border-radius:26px;padding:1.5rem;margin:1rem 0 1.2rem;box-shadow:0 18px 40px color-mix(in srgb,#4353FF 35%,transparent);position:relative;overflow:hidden}
.hero-card::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero-card h2{color:#fff;font-size:clamp(1.35rem,4vw,1.8rem);margin:.2rem 0 .4rem} .hero-card p{color:rgba(255,255,255,.9);margin:0 0 .6rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0} .chips span{background:rgba(255,255,255,.18);border-radius:999px;padding:.2rem .65rem;font-size:.82rem;font-weight:600}
.hero-ring{display:grid;justify-items:center;gap:.2rem;position:relative;z-index:1;background:rgba(255,255,255,.95);border-radius:22px;padding:.9rem .9rem 1.8rem}
.hero-ring>small{color:#5B6286;font-weight:600}
.hero-ring .ring b{color:#10163A}
.hero-txt{position:relative;z-index:1}
@media (max-width:600px){.hero-card{flex-direction:column;align-items:stretch}.hero-ring{flex-direction:row;justify-content:center;padding:.8rem}.hero-ring>small{position:static}.hero-ring .ring{width:72px!important;height:72px!important}}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem;margin:0 0 1.2rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:.85rem 1rem;box-shadow:var(--shadow);display:grid;gap:.15rem}
.stat small{color:var(--muted);font-weight:600} .stat b{font-size:1.5rem;font-weight:800;color:var(--ink)} .stat b i{font-style:normal;font-size:.75em;color:var(--muted);font-weight:600}
.action-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.75rem;margin-bottom:1.2rem}
.tile{display:grid;gap:.15rem;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1rem;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--primary)} .tile b{color:var(--ink)}
.ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.2rem;margin-bottom:.4rem}
.ti.red{background:var(--bad-soft)} .ti.blue{background:var(--en-soft)} .ti.violet{background:color-mix(in srgb,var(--violet) 15%,var(--surface))} .ti.green{background:var(--good-soft)}
.week-strip h3{margin-bottom:.6rem}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.45rem}
.sday{display:grid;gap:.1rem;justify-items:center;padding:.6rem .2rem;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;min-width:0}
.sday b{font-size:1.1rem;color:var(--ink)} .sday small{font-size:.66rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.sday.done{background:var(--good-soft);border-color:transparent} .sday.done b{color:var(--good)}
.sday.next{border-color:var(--primary)} .sday.sel{box-shadow:0 0 0 3px var(--primary-soft);border-color:var(--primary)} .sday.locked{opacity:.45;cursor:not-allowed}

/* ---- Lesson mode ---- */
body.in-lesson #side,body.in-lesson #mtop,body.in-lesson #bottom{display:none}
body.in-lesson .app{grid-template-columns:1fr} body.in-lesson main{max-width:760px;padding-top:.6rem;padding-bottom:8rem}
.lesson-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;gap:.8rem;padding:.6rem 0;background:var(--bg)}
.segbar{flex:1;display:flex;gap:4px}
.segbar button{flex:1;height:10px;border-radius:99px;border:0;background:var(--line);padding:0;cursor:pointer}
.segbar button.past{background:var(--good)} .segbar button.now{background:var(--grad)} .segbar button:disabled{cursor:default}
.xp-pill{font-weight:800;font-size:.82rem;color:var(--mid);background:var(--mid-soft);border-radius:999px;padding:.2rem .6rem;white-space:nowrap}
.lesson-head{margin:.6rem 0 1rem} .lesson-head h1 small{font-size:.9rem;color:var(--muted);font-weight:600}
.coach{display:flex;gap:.7rem;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.75rem .9rem;margin:0;box-shadow:var(--shadow)}
.coach-av{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#fff;font-weight:800}
.action-bar{position:fixed;left:0;right:0;bottom:0;z-index:18;display:flex;gap:.6rem;justify-content:center;align-items:center;flex-wrap:wrap;padding:.8rem 1rem calc(.8rem + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 95%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.action-bar .btn.big{min-width:min(320px,100%)}
.feedback{flex-basis:100%;max-width:760px;display:flex;flex-direction:column;gap:.1rem;border-radius:14px;padding:.6rem .9rem}
.feedback.ok{background:var(--good-soft);color:var(--good)} .feedback.bad{background:var(--bad-soft);color:var(--bad)} .feedback span{color:var(--text);font-size:.92rem}

/* ---- Drill ---- */
.drill{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:1.2rem;margin:0 0 1rem;box-shadow:var(--shadow);text-align:center}
.drill-top{display:flex;gap:.5rem;align-items:center;justify-content:center;font-size:.88rem}
.target{font-size:1.4rem;font-weight:800;color:var(--ink);line-height:1.35;margin:.7rem 0 .2rem} .target.big{font-size:2.2rem}
.pron{color:var(--muted);font-weight:600;letter-spacing:.02em} .sub{margin:0} .trans{color:var(--muted);margin:.2rem 0 0}
.mic-row{display:flex;justify-content:center;align-items:center;gap:1.2rem;margin:1rem 0 .3rem} .mic-hint{font-size:.85rem;margin:0}
.result:empty{display:none} .result{text-align:left;margin-top:1rem;border-top:1px dashed var(--line);padding-top:1rem}
.res-head{display:flex;gap:1rem;align-items:center} .res-head p{margin:0} .verdict{font-weight:800;color:var(--ink)}
.words{font-size:1.25rem;font-weight:700;line-height:1.9;margin:.8rem 0 .3rem}
.w{padding:.05em .3em;border-radius:7px} .w.ok{background:var(--good-soft);color:var(--good)} .w.near{background:var(--mid-soft);color:var(--mid)} .w.bad{background:var(--bad-soft);color:var(--bad)} .w.miss{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.legend{font-size:.8rem} .legend .w{font-weight:700}
.tip{margin-top:.6rem;padding:.75rem .9rem;background:var(--primary-soft);border-radius:12px;text-align:left} .tip:empty{display:none}
.ask{margin-top:.6rem}

/* ---- Flashcard & quiz ---- */
.flash{text-align:center;padding:2rem 1.2rem} .flash .q{font-size:1.9rem;font-weight:800;color:var(--ink);margin:.4rem 0 1rem}
.answers{display:grid;gap:.6rem;justify-items:center} .ans{display:flex;align-items:center;gap:.6rem;font-size:1.3rem}
.quiz .q{font-size:1.25rem;font-weight:800;color:var(--ink)} .blank{font-size:1.25rem;font-weight:600;color:var(--ink);background:var(--surface-2);padding:.8rem 1rem;border-radius:14px}
.big-play{width:4rem;height:4rem;font-size:1.3rem;background:var(--primary-soft);border:0;color:var(--primary);margin:.4rem 0}
.opts{display:grid;gap:.6rem;margin:1rem 0 0}
.opt{display:flex;align-items:center;gap:.8rem;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:.85rem 1rem;text-align:left;cursor:pointer;font-weight:700;min-height:3.3rem;transition:border-color .12s}
.opt .k{width:1.9rem;height:1.9rem;flex:none;display:grid;place-items:center;border-radius:9px;background:var(--surface-2);color:var(--muted);font-size:.82rem}
.opt:hover:not(:disabled){border-color:var(--primary)} .opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)} .opt.right .k{background:var(--good);color:#fff}

<script>
/* ===== Adapter website mandiri =====
   Di luar claude.ai tidak ada window.claude. Adapter ini:
   - menyimpan progres di browser (localStorage),
   - menyediakan "guru AI" lewat endpoint /api/ai milikmu sendiri (opsional). */
(function () {
  if (window.claude && window.claude.use) return;
  const AI_URL = (window.KK_AI_URL || '/api/ai');
  const codeKey = 'kk-ai-code';
  async function call(prompt, opts) {
    const r = await fetch(AI_URL, { method: 'POST', headers: { 'content-type': 'application/json', 'x-access-code': localStorage.getItem(codeKey) || '' }, body: JSON.stringify({ prompt: String(prompt), tier: (opts && opts.modelTier) || 'default' }) });
    if (r.status === 401) { const e = new Error('unauthorized'); e.code = 'unauthorized'; throw e; }
    if (r.status === 429) { const e = new Error('rate'); e.code = 'rate_limited'; throw e; }
    if (!r.ok) { const e = new Error('ai ' + r.status); e.code = 'unavailable'; throw e; }
    const d = await r.json();
    if (opts && opts.onText) try { opts.onText({ text: d.text, delta: d.text }); } catch (e) {}
    return { text: d.text || '', truncated: !!d.truncated };
  }
  function sample(prompt, opts) { return call(prompt, opts); }
  sample.json = async (prompt, opts) => {
    const { text } = await call(prompt + '\n\nPENTING: balas hanya JSON yang valid, tanpa teks lain dan tanpa ```.', opts);
    const t = text.replace(/```json|```/g, '').trim(), a = t.indexOf('{'), b = t.lastIndexOf('}');
    try { return JSON.parse(a >= 0 ? t.slice(a, b + 1) : t); } catch (e) { const er = new Error('invalid_json'); er.code = 'invalid_json'; er.text = text; throw er; }
  };
  let probe = null;
  window.claude = {
    use: async name => {
      if (name !== 'sample') return null;
      probe = probe || fetch(AI_URL, { method: 'GET' }).then(r => r.ok ? r.json() : null).catch(() => null);
      const h = await probe;
      return h && h.ai ? sample : null;
    }
  };
  window.KK_STANDALONE = true;
})();

10:['Klien memberi umpan balik soal tampilan.',[

13:['Aisyah tidak bisa mengunduh file.',[

15:['Dirwan mengirim proposal ke Mr. Tan, klien.',[

31:['Update status bug di rapat triage.',[

['Dirwan','It was moved to Retest this morning. The fix has been deployed on staging.','Ia dipindahkan ke Uji Semula pagi tadi. Pembaikan telah diatur gerak di staging.','Sudah dipindah ke Retest tadi pagi. Fix-nya sudah di-deploy ke staging.'],
['Daniel','Did it pass?','Adakah ia lulus?','Apakah lulus?'],
['Dirwan','Not on Safari, so I reopened it.','Tidak di Safari, jadi saya buka semula.','Tidak di Safari, jadi saya buka kembali.'],
['Daniel','And BUG-210?','Dan BUG-210?','Lalu BUG-210?'],
['Dirwan','It was marked as a duplicate of BUG-198 and closed.','Ia ditanda sebagai pendua BUG-198 dan ditutup.','Ditandai duplikat BUG-198 dan ditutup.']]],
32:['Ali tidak bisa mereproduksi bug.',[
['Ali','I can’t reproduce it on my machine.','Saya tidak dapat hasilkan semula di komputer saya.','Saya tidak bisa mereproduksinya di komputerku.'],
['Dirwan','It only happens when the time zone is GMT plus eight.','Ia hanya berlaku apabila zon waktu GMT tambah lapan.','Hanya terjadi saat zona waktu GMT+8.'],
['Ali','Interesting. Does it work on the emulator?','Menarik. Adakah ia berfungsi di emulator?','Menarik. Berfungsi di emulator?'],
['Dirwan','It works on the emulator but not on a real device.','Ia berfungsi di emulator tetapi tidak di peranti sebenar.','Berfungsi di emulator tapi tidak di perangkat asli.'],
['Ali','How often does it fail?','Berapa kerap ia gagal?','Seberapa sering gagal?'],
['Dirwan','Consistently. Three out of three times after midnight.','Secara konsisten. Tiga daripada tiga kali selepas tengah malam.','Konsisten. Tiga dari tiga kali setelah tengah malam.']]],
33:['Rapat root cause analysis.',[
['Daniel','So, what caused the crash?','Jadi, apa yang menyebabkan ranap itu?','Jadi, apa penyebab crash-nya?'],
['Dirwan','It was caused by a null pointer exception in the cart service.','Ia disebabkan oleh pengecualian penuding null dalam perkhidmatan troli.','Disebabkan null pointer exception di layanan cart.'],
['Daniel','Why did it happen?','Kenapa ia berlaku?','Kenapa bisa terjadi?'],
['Dirwan','Because the discount field was empty for old orders.','Kerana medan diskaun kosong untuk pesanan lama.','Karena field diskon kosong untuk pesanan lama.'],
['Daniel','How do we prevent this?','Bagaimana kita mencegahnya?','Bagaimana kita mencegahnya?'],
['Dirwan','To prevent this, we will add a migration and a regression test.','Untuk mencegahnya, kita akan tambah migrasi dan ujian regresi.','Untuk mencegahnya, kita tambahkan migrasi dan tes regresi.']]],
34:['Ali menganggap bug sebagai “by design”.',[
['Ali','This isn’t a bug. It’s by design.','Ini bukan pepijat. Ia mengikut reka bentuk.','Ini bukan bug. Memang dirancang begitu.'],
['Dirwan','I see your point, but the acceptance criteria say the total must include tax.','Saya faham pandangan awak, tetapi kriteria penerimaan kata jumlah mesti termasuk cukai.','Saya paham, tapi acceptance criteria bilang total harus termasuk pajak.'],
['Ali','Hmm, maybe the story is outdated.','Hmm, mungkin cerita itu sudah lapuk.','Hmm, mungkin story-nya sudah usang.'],
['Dirwan','From the user’s perspective, it still looks wrong.','Dari sudut pengguna, ia masih nampak salah.','Dari sudut pengguna, ini tetap terlihat salah.'],
['Ali','Fair enough. How about if we ask Sarah?','Betul juga. Bagaimana kalau kita tanya Sarah?','Masuk akal. Bagaimana kalau kita tanya Sarah?'],
['Dirwan','Good idea. Let’s agree on it before the release.','Idea yang baik. Mari kita sepakati sebelum keluaran.','Ide bagus. Mari sepakati sebelum rilis.']]],
36:['Menjelaskan proses tim kepada anggota baru.',[
['Aisyah','How does your team work?','Bagaimana pasukan awak bekerja?','Bagaimana timmu bekerja?'],
['Dirwan','We follow Scrum with two-week sprints.','Kami ikut Scrum dengan sprint dua minggu.','Kami mengikuti Scrum dengan sprint dua minggu.'],
['Aisyah','When does testing start?','Bila ujian bermula?','Kapan testing dimulai?'],
['Dirwan','First, QA joins refinement. Then we write test cases during development.','Pertama, QA sertai penghalusan. Kemudian kami tulis kes ujian semasa pembangunan.','Pertama, QA ikut refinement. Lalu kami menulis test case saat development.'],
['Aisyah','And after that?','Dan selepas itu?','Lalu setelah itu?'],
['Dirwan','Once the story is done, we demo it. Finally, we discuss improvements in the retro.','Sebaik sahaja cerita siap, kami demo. Akhir sekali, kami bincang penambahbaikan dalam retro.','Begitu story selesai, kami demo. Terakhir, kami bahas perbaikan di retro.']]],
37:['Refinement user story bersama Sarah.',[
['Sarah','As a shopper, I want to save my cart so that I can pay later.','Sebagai pembeli, saya mahu simpan troli supaya boleh bayar kemudian.','Sebagai pembeli, saya ingin menyimpan keranjang agar bisa bayar nanti.'],
['Dirwan','What should happen if an item goes out of stock?','Apa patut berlaku jika barang kehabisan stok?','Apa yang harus terjadi jika barang habis?'],
['Sarah','Good question. The system should show a warning.','Soalan yang bagus. Sistem patut tunjukkan amaran.','Pertanyaan bagus. Sistem sebaiknya menampilkan peringatan.'],
['Dirwan','Should or must? It changes the acceptance criteria.','Patut atau mesti? Ia mengubah kriteria penerimaan.','Sebaiknya atau wajib? Itu mengubah acceptance criteria.'],
['Sarah','Must. Please add it.','Mesti. Sila tambah.','Wajib. Tolong tambahkan.'],
['Dirwan','Also, how long is the cart saved? That part is ambiguous.','Juga, berapa lama troli disimpan? Bahagian itu samar-samar.','Juga, berapa lama keranjang disimpan? Bagian itu ambigu.']]],
38:['Dirwan mempelajari arsitektur sistem.',[
['Dirwan','Can you explain the architecture?','Boleh terangkan seni bina sistem?','Bisa jelaskan arsitekturnya?'],
['Ali','The frontend is built with React and calls our PHP API.','Bahagian hadapan dibina dengan React dan memanggil API PHP kami.','Frontend dibangun dengan React dan memanggil API PHP kami.'],
['Dirwan','And the API talks to PostgreSQL?','Dan API berhubung dengan PostgreSQL?','Lalu API terhubung ke PostgreSQL?'],
['Ali','Yes, and there’s a payment service, which uses a third-party gateway.','Ya, dan ada perkhidmatan pembayaran, yang guna gerbang pihak ketiga.','Ya, dan ada layanan pembayaran yang memakai gateway pihak ketiga.'],
['Dirwan','What happens when the token is missing?','Apa berlaku apabila token tiada?','Apa yang terjadi saat token tidak ada?'],
['Ali','The server returns 401. Every integration point needs a test.','Pelayan memulangkan 401. Setiap titik integrasi perlukan ujian.','Server mengembalikan 401. Setiap titik integrasi perlu dites.']]],
39:['Memverifikasi data di database.',[
['Aisyah','Did the API create the order correctly?','Adakah API mencipta pesanan dengan betul?','Apakah API membuat pesanan dengan benar?'],
['Dirwan','I ran a query. The orders table has one new row.','Saya jalankan pertanyaan. Jadual pesanan ada satu baris baharu.','Saya jalankan query. Tabel orders punya satu baris baru.'],
['Aisyah','And the items?','Dan barang-barangnya?','Lalu item-nya?'],
['Dirwan','Each order has many items. The query returns three rows in order_items.','Setiap pesanan ada banyak barang. Pertanyaan itu memulangkan tiga baris dalam order_items.','Setiap pesanan punya banyak item. Query mengembalikan tiga baris di order_items.'],
['Aisyah','Is the foreign key correct?','Adakah kunci asing betul?','Apakah foreign key-nya benar?'],
['Dirwan','Yes, and the status column is not null. The trigger also updated the audit table.','Ya, dan lajur status tidak null. Pencetus juga mengemas kini jadual audit.','Ya, dan kolom status tidak null. Trigger juga memperbarui tabel audit.']]],
40:['Menjelaskan pipeline CI/CD.',[
['Daniel','How does our pipeline work now?','Bagaimana saluran kita berfungsi sekarang?','Bagaimana pipeline kita bekerja sekarang?'],
['Dirwan','Every time someone opens a pull request, unit and API tests run.','Setiap kali seseorang buka permintaan tarik, ujian unit dan API berjalan.','Setiap kali ada pull request, tes unit dan API berjalan.'],
['Daniel','What happens if a test fails?','Apa berlaku jika ujian gagal?','Apa yang terjadi jika tes gagal?'],
['Dirwan','The quality gate blocks the merge.','Pintu kualiti menyekat penggabungan.','Quality gate memblokir merge.'],
['Daniel','And after the merge?','Dan selepas penggabungan?','Lalu setelah merge?'],
['Dirwan','As soon as the build passes, the app is deployed to staging automatically.','Sebaik sahaja binaan lulus, aplikasi diatur gerak ke staging secara automatik.','Begitu build lulus, aplikasi otomatis di-deploy ke staging.']]],
41:['Dirwan me-review test code milik Aisyah.',[
['Aisyah','Could you review my pull request?','Boleh semak permintaan tarik saya?','Bisa review pull request saya?'],
['Dirwan','Sure. Overall it looks good, just a few comments.','Boleh. Secara keseluruhan nampak bagus, cuma beberapa komen.','Tentu. Secara umum bagus, hanya beberapa komentar.'],
['Aisyah','What should I change?','Apa yang patut saya ubah?','Apa yang perlu saya ubah?'],
['Dirwan','Could we move these selectors into the page object?','Boleh kita pindahkan pemilih ini ke dalam objek halaman?','Bisakah kita pindahkan selector ini ke page object?'],
['Aisyah','Good point. Anything else?','Betul. Ada lagi?','Betul juga. Ada lagi?'],
['Dirwan','Just a nit: I’d suggest renaming this variable for readability.','Komen kecil sahaja: saya cadangkan tukar nama pemboleh ubah ini supaya mudah dibaca.','Hanya hal kecil: saya sarankan ganti nama variabel ini agar mudah dibaca.']]],
43:['Menguji aturan bisnis ongkos kirim.',[
['Sarah','The rule is simple: shipping is free above 100 ringgit.','Peraturannya mudah: penghantaran percuma melebihi 100 ringgit.','Aturannya sederhana: ongkir gratis di atas 100 ringgit.'],
['Dirwan','Is exactly 100 free or not?','Adakah tepat 100 percuma atau tidak?','Apakah tepat 100 gratis atau tidak?'],
['Sarah','Hmm, it should be free from 100.','Hmm, sepatutnya percuma bermula 100.','Hmm, harusnya gratis mulai 100.'],
['Dirwan','Then the rule is: if the total is 100 or more, the system must not charge shipping.','Jadi peraturannya: jika jumlah 100 atau lebih, sistem tidak boleh kenakan caj penghantaran.','Jadi aturannya: jika total 100 atau lebih, sistem tidak boleh mengenakan ongkir.'],
['Sarah','Exactly. Can users combine it with a voucher?','Tepat. Boleh pengguna gabungkan dengan baucar?','Tepat. Bisa digabung dengan voucher?'],
['Dirwan','Only if the total after the voucher is still above the minimum. Let’s write that down.','Hanya jika jumlah selepas baucar masih melebihi minimum. Mari kita catat.','Hanya jika total setelah voucher masih di atas minimum. Ayo kita catat.']]],
44:['Membahas alur status pesanan.',[
['Dirwan','When does the status change to Paid?','Bila status bertukar kepada Dibayar?','Kapan status berubah ke Paid?'],
['Ali','When the payment gateway sends a success callback.','Apabila gerbang pembayaran menghantar panggilan balik berjaya.','Saat payment gateway mengirim callback sukses.'],
['Dirwan','And if the customer doesn’t pay?','Dan jika pelanggan tidak bayar?','Lalu jika pelanggan tidak bayar?'],
['Ali','After 24 hours, the order is cancelled automatically.','Selepas 24 jam, pesanan dibatalkan secara automatik.','Setelah 24 jam, pesanan otomatis dibatalkan.'],
['Dirwan','Can a cancelled order go back to Paid?','Boleh pesanan yang dibatalkan kembali kepada Dibayar?','Bisakah pesanan yang dibatalkan kembali ke Paid?'],
['Ali','No, that’s an invalid transition. Please test it.','Tidak, itu peralihan tidak sah. Sila uji.','Tidak, itu transisi tidak valid. Tolong dites.']]],
45:['Menemukan masalah perhitungan diskon.',[
['Dirwan','The total is wrong by one cent.','Jumlahnya salah satu sen.','Totalnya salah satu sen.'],
['Ali','How is it calculated?','Bagaimana ia dikira?','Bagaimana menghitungnya?'],
['Dirwan','Subtotal minus ten percent discount, plus six percent tax.','Jumlah kecil tolak diskaun sepuluh peratus, tambah cukai enam peratus.','Subtotal dikurangi diskon sepuluh persen, ditambah pajak enam persen.'],
['Ali','Do we round before or after tax?','Adakah kita bundarkan sebelum atau selepas cukai?','Kita membulatkan sebelum atau sesudah pajak?'],
['Dirwan','The spec says after tax, rounded to two decimal places.','Spesifikasi kata selepas cukai, dibundarkan kepada dua titik perpuluhan.','Spesifikasi bilang setelah pajak, dibulatkan dua desimal.'],
['Ali','Then it’s a rounding issue in my code. Thanks!','Jadi ia isu pembundaran dalam kod saya. Terima kasih!','Berarti masalah pembulatan di kodeku. Terima kasih!']]],
46:['Menguji hak akses peran pengguna.',[
['Daniel','What did you find in the access tests?','Apa yang awak jumpa dalam ujian akses?','Apa temuanmu di tes akses?'],
['Dirwan','Only admins should delete users, but a viewer can call the delete API.','Hanya pentadbir patut padam pengguna, tetapi penonton boleh panggil API padam.','Hanya admin yang boleh menghapus pengguna, tapi viewer bisa memanggil API delete.'],
['Daniel','That’s serious. What does the API return?','Itu serius. Apa yang API pulangkan?','Itu serius. API mengembalikan apa?'],
['Dirwan','It returns 200. It should return 403 Forbidden.','Ia memulangkan 200. Ia sepatutnya memulangkan 403 Dilarang.','Mengembalikan 200. Seharusnya 403 Forbidden.'],
['Daniel','Is it logged in the audit log?','Adakah ia direkod dalam log audit?','Apakah tercatat di audit log?'],
['Dirwan','No. I reported it as a critical security bug.','Tidak. Saya laporkannya sebagai pepijat keselamatan kritikal.','Tidak. Saya laporkan sebagai bug keamanan critical.']]],
47:['Menulis acceptance criteria dengan Gherkin.',[
['Sarah','Can you turn this rule into a scenario?','Boleh awak tukar peraturan ini kepada senario?','Bisa ubah aturan ini menjadi skenario?'],
['Dirwan','Sure. Given the user has an item in the cart.','Boleh. Diberi pengguna ada barang dalam troli.','Tentu. Given pengguna punya barang di keranjang.'],
['Sarah','OK.','Baik.','Oke.'],
['Dirwan','When the user applies an expired voucher.','Apabila pengguna menggunakan baucar yang tamat tempoh.','When pengguna memakai voucher kedaluwarsa.'],
['Sarah','Then?','Maka?','Then?'],
['Dirwan','Then an error message is shown and the total stays the same.','Maka mesej ralat dipaparkan dan jumlah kekal sama.','Then pesan error tampil dan total tetap sama.']]],
48:['Brainstorm edge case saat refinement.',[
['Ali','I think the payment feature is ready.','Saya rasa ciri pembayaran sudah sedia.','Saya rasa fitur pembayaran sudah siap.'],
['Dirwan','What happens if the user clicks Pay twice?','Apa berlaku jika pengguna klik Bayar dua kali?','Apa yang terjadi jika pengguna klik Bayar dua kali?'],
['Ali','Hmm, it might create two orders.','Hmm, mungkin ia mencipta dua pesanan.','Hmm, mungkin membuat dua pesanan.'],
['Dirwan','The system should not create two orders. The API must be idempotent.','Sistem tidak sepatutnya mencipta dua pesanan. API mesti idempoten.','Sistem tidak boleh membuat dua pesanan. API harus idempoten.'],
['Ali','Good catch. Anything else?','Tangkapan yang bagus. Ada lagi?','Temuan bagus. Ada lagi?'],
['Dirwan','What if the session expires during checkout? I would also test the back button.','Bagaimana pula jika sesi tamat semasa pembayaran? Saya juga akan uji butang kembali.','Bagaimana jika sesi habis saat checkout? Saya juga akan tes tombol kembali.']]],
50:['Mempresentasikan test plan ke manajer.',[
['Daniel','Can you summarize the test plan?','Boleh ringkaskan pelan ujian?','Bisa ringkas test plan-nya?'],
['Dirwan','The scope of testing includes web, API, and Android.','Skop ujian merangkumi web, API, dan Android.','Lingkup pengujian mencakup web, API, dan Android.'],
['Daniel','What’s out of scope?','Apa yang di luar skop?','Apa yang di luar lingkup?'],
['Dirwan','iOS and performance testing. Those are for the next phase.','iOS dan ujian prestasi. Itu untuk fasa seterusnya.','iOS dan uji performa. Itu untuk fase berikutnya.'],
['Daniel','When will you sign off?','Bila awak akan beri pengesahan akhir?','Kapan kamu akan sign off?'],
['Dirwan','We will sign off when there are no open critical bugs and the pass rate is above 95 percent.','Kami akan sahkan apabila tiada pepijat kritikal terbuka dan kadar lulus melebihi 95 peratus.','Kami sign off saat tidak ada bug critical terbuka dan pass rate di atas 95 persen.']]],
51:['Mendesain test case umur dengan BVA.',[
['Aisyah','The age field accepts 18 to 60. How many tests do we need?','Medan umur menerima 18 hingga 60. Berapa ujian kita perlukan?','Field umur menerima 18 sampai 60. Butuh berapa tes?'],
['Dirwan','With equivalence partitioning, we have three partitions.','Dengan pemetakan kesetaraan, kita ada tiga partisi.','Dengan EP, kita punya tiga partisi.'],
['Aisyah','Below 18, 18 to 60, and above 60?','Bawah 18, 18 hingga 60, dan atas 60?','Di bawah 18, 18 sampai 60, dan di atas 60?'],
['Dirwan','Exactly. Then with boundary value analysis, I would test 17, 18, and 19.','Tepat. Kemudian dengan analisis nilai sempadan, saya akan uji 17, 18, dan 19.','Tepat. Lalu dengan BVA, saya tes 17, 18, dan 19.'],
['Aisyah','And the upper boundary?','Dan sempadan atas?','Lalu batas atas?'],
['Dirwan','59, 60, and 61. Is the range inclusive? Let’s confirm with Sarah.','59, 60, dan 61. Adakah julat itu termasuk? Mari sahkan dengan Sarah.','59, 60, dan 61. Apakah rentangnya inklusif? Kita konfirmasi ke Sarah.']]],
52:['Membuat decision table untuk ongkir gratis.',[
['Sarah','Members get free shipping, and so do orders above 100.','Ahli dapat penghantaran percuma, begitu juga pesanan melebihi 100.','Member dapat ongkir gratis, begitu juga pesanan di atas 100.'],
['Dirwan','So if either condition is true, shipping is free?','Jadi jika sama ada syarat benar, penghantaran percuma?','Jadi jika salah satu kondisi benar, ongkir gratis?'],
['Sarah','Yes. And if both are true, they also get a gift.','Ya. Dan jika kedua-duanya benar, mereka dapat hadiah juga.','Ya. Dan jika keduanya benar, mereka juga dapat hadiah.'],
['Dirwan','And if neither is true?','Dan jika kedua-duanya tidak benar?','Dan jika keduanya tidak benar?'],
['Sarah','Normal shipping fee.','Caj penghantaran biasa.','Ongkir normal.'],
['Dirwan','Two conditions mean four combinations. I’ll put them in a decision table.','Dua syarat bermakna empat gabungan. Saya akan masukkan dalam jadual keputusan.','Dua kondisi berarti empat kombinasi. Saya masukkan ke decision table.']]],
53:['Melaporkan hasil sesi exploratory.',[
['Daniel','How was the exploratory session?','Bagaimana sesi penerokaan tadi?','Bagaimana sesi exploratory-nya?'],
['Dirwan','I explored the checkout, focusing on vouchers and payment errors.','Saya meneroka pembayaran akhir dengan fokus kepada baucar dan ralat pembayaran.','Saya mengeksplorasi checkout, fokus pada voucher dan error pembayaran.'],
['Daniel','How long did it take?','Berapa lama masa diambil?','Berapa lama?'],
['Dirwan','I time-boxed it to sixty minutes.','Saya hadkan kepada enam puluh minit.','Saya batasi enam puluh menit.'],
['Daniel','Any findings?','Ada penemuan?','Ada temuan?'],
['Dirwan','During the session, I found two bugs and one usability issue. My notes are in Confluence.','Semasa sesi, saya menemui dua pepijat dan satu isu kebolehgunaan. Nota saya ada dalam Confluence.','Selama sesi, saya menemukan dua bug dan satu isu usability. Catatanku ada di Confluence.']]],
54:['Menjelaskan jenis testing kepada tester junior.',[
['Aisyah','What’s the difference between smoke and sanity testing?','Apakah perbezaan antara ujian asap dan ujian kewarasan?','Apa beda smoke dan sanity testing?'],
['Dirwan','Smoke testing is broad but shallow. It checks the critical paths on a new build.','Ujian asap luas tetapi cetek. Ia menyemak laluan kritikal pada binaan baharu.','Smoke testing luas tapi dangkal. Mengecek jalur kritis di build baru.'],
['Aisyah','And sanity?','Dan kewarasan?','Lalu sanity?'],
['Dirwan','Sanity testing is narrow. It focuses on one fix, whereas smoke covers everything.','Ujian kewarasan sempit. Ia fokus pada satu pembaikan, manakala ujian asap meliputi semua.','Sanity testing sempit. Fokus ke satu fix, sedangkan smoke mencakup semuanya.'],
['Aisyah','Who does UAT?','Siapa yang buat UAT?','Siapa yang melakukan UAT?'],
['Dirwan','The client does UAT before go-live. We support them.','Pelanggan buat UAT sebelum pelancaran. Kami menyokong mereka.','Klien melakukan UAT sebelum go-live. Kami mendukung mereka.']]],
55:['Rapat go/no-go rilis.',[
['Daniel','Are we ready to release?','Adakah kita sedia untuk keluaran?','Apakah kita siap rilis?'],
['Dirwan','Out of 300 test cases, 285 passed, 10 failed, and 5 are blocked.','Daripada 300 kes ujian, 285 lulus, 10 gagal, dan 5 tersekat.','Dari 300 test case, 285 lulus, 10 gagal, dan 5 terblokir.'],
['Daniel','What’s the pass rate?','Berapakah kadar lulus?','Berapa pass rate-nya?'],
['Dirwan','95 percent. There are four open bugs, including one critical.','95 peratus. Ada empat pepijat terbuka, termasuk satu kritikal.','95 persen. Ada empat bug terbuka, termasuk satu critical.'],
['Daniel','What’s your recommendation?','Apakah cadangan awak?','Apa rekomendasimu?'],
['Dirwan','My recommendation is to delay by one day and fix the critical bug first.','Cadangan saya ialah tangguhkan sehari dan baiki pepijat kritikal dahulu.','Rekomendasi saya menunda satu hari dan perbaiki bug critical dulu.']]],
57:['Menjelaskan framework automation kepada tim.',[
['Daniel','Can you explain our automation framework?','Boleh terangkan rangka kerja automasi kita?','Bisa jelaskan framework automation kita?'],
['Dirwan','It consists of page objects, fixtures, test specs, and utilities.','Ia terdiri daripada objek halaman, fixture, spesifikasi ujian, dan utiliti.','Terdiri dari page object, fixture, spec tes, dan utilitas.'],
['Daniel','What is the page object responsible for?','Objek halaman bertanggungjawab untuk apa?','Page object bertanggung jawab atas apa?'],
['Dirwan','It’s responsible for locators and page actions. Tests never use raw selectors.','Ia bertanggungjawab untuk pencari elemen dan tindakan halaman. Ujian tidak guna pemilih mentah.','Bertanggung jawab atas locator dan aksi halaman. Tes tidak pernah pakai selector mentah.'],
['Daniel','And the fixtures?','Dan fixture?','Lalu fixture?'],
['Dirwan','We use fixtures to set up the browser and test data. This makes the tests maintainable.','Kami guna fixture untuk menyediakan pelayar dan data ujian. Ini menjadikan ujian mudah diselenggara.','Kami pakai fixture untuk menyiapkan browser dan data tes. Ini membuat tes mudah dipelihara.']]],
58:['Diskusi strategi locator dengan Ali.',[
['Ali','Why don’t you use XPath?','Kenapa awak tidak guna XPath?','Kenapa kamu tidak pakai XPath?'],
['Dirwan','I prefer role selectors over XPath because they’re more stable.','Saya lebih suka pemilih peranan berbanding XPath kerana lebih stabil.','Saya lebih suka role selector daripada XPath karena lebih stabil.'],
['Ali','But some buttons have no label.','Tetapi sesetengah butang tiada label.','Tapi beberapa tombol tidak punya label.'],
['Dirwan','Could you add a data-testid to those buttons?','Boleh awak tambah data-testid pada butang itu?','Bisa tambahkan data-testid ke tombol itu?'],
['Ali','Sure. What about the IDs we have now?','Boleh. Bagaimana dengan ID yang ada sekarang?','Tentu. Bagaimana dengan ID yang ada sekarang?'],
['Dirwan','Avoid them, since they’re dynamic and change on every load.','Elakkan, kerana ia dinamik dan berubah setiap kali dimuat.','Hindari, karena dinamis dan berubah setiap dimuat.']]],
59:['Mengatasi flaky test di pipeline.',[
['Aisyah','The checkout test failed again in CI.','Ujian pembayaran gagal lagi dalam CI.','Tes checkout gagal lagi di CI.'],
['Dirwan','Is it the one with the five-second sleep?','Adakah ia yang ada tidur lima saat?','Yang pakai sleep lima detik?'],
['Aisyah','Yes. Should I make it ten seconds?','Ya. Patutkah saya jadikan sepuluh saat?','Ya. Haruskah saya jadikan sepuluh detik?'],
['Dirwan','Instead of using a hard wait, we should wait for the API response.','Daripada guna tunggu keras, kita patut tunggu respons API.','Alih-alih hard wait, kita sebaiknya menunggu respons API.'],
['Aisyah','Good idea. Anything else?','Idea yang baik. Ada lagi?','Ide bagus. Ada lagi?'],
['Dirwan','It also shares data with another test. Let’s create unique data so it’s deterministic.','Ia juga berkongsi data dengan ujian lain. Mari cipta data unik supaya ia berketentuan.','Tes ini juga berbagi data dengan tes lain. Ayo buat data unik agar deterministik.']]],
60:['Menjelaskan API test kepada manajer.',[
['Daniel','What does this API test do?','Apa yang ujian API ini lakukan?','Tes API ini melakukan apa?'],
['Dirwan','It sends a POST request to the orders endpoint with a bearer token.','Ia menghantar permintaan POST ke titik akhir pesanan dengan token pembawa.','Mengirim POST request ke endpoint orders dengan bearer token.'],
['Daniel','Then?','Kemudian?','Lalu?'],
['Dirwan','It asserts that the status code is 201 and validates the body against the JSON schema.','Ia menegaskan bahawa kod status ialah 201 dan mengesahkan badan respons dengan skema JSON.','Memastikan status code 201 dan memvalidasi body terhadap JSON schema.'],
['Daniel','Do you test without a token?','Adakah awak uji tanpa token?','Kamu tes tanpa token?'],
['Dirwan','Yes. Without a valid token, the API returns 401. That’s a negative test.','Ya. Tanpa token sah, API memulangkan 401. Itu ujian negatif.','Ya. Tanpa token valid, API mengembalikan 401. Itu tes negatif.']]],
61:['Menjelaskan perbaikan pipeline kepada Daniel.',[
['Daniel','The test run was too slow last month.','Larian ujian terlalu perlahan bulan lepas.','Eksekusi tes terlalu lambat bulan lalu.'],
['Dirwan','Now we run 600 tests in parallel across four workers.','Sekarang kami jalankan 600 ujian secara selari merentasi empat pekerja.','Sekarang kami jalankan 600 tes paralel di empat worker.'],
['Daniel','How much faster is it?','Berapa lebih pantas?','Seberapa cepat?'],
['Dirwan','This reduced execution time from forty to twelve minutes.','Ini mengurangkan masa pelaksanaan daripada empat puluh kepada dua belas minit.','Ini mengurangi waktu eksekusi dari empat puluh ke dua belas menit.'],
['Daniel','Where can I see the results?','Di mana saya boleh lihat keputusannya?','Di mana saya bisa lihat hasilnya?'],
['Dirwan','Results are uploaded to Allure, and failures send a Slack alert.','Keputusan dimuat naik ke Allure, dan kegagalan menghantar amaran Slack.','Hasil diunggah ke Allure, dan kegagalan mengirim notifikasi Slack.']]],
62:['Mengajari Aisyah menulis step BDD.',[
['Aisyah','How does Cucumber know what to run?','Bagaimana Cucumber tahu apa yang perlu dijalankan?','Bagaimana Cucumber tahu apa yang dijalankan?'],
['Dirwan','Each Gherkin step maps to a step definition in TypeScript.','Setiap langkah Gherkin dipetakan kepada definisi langkah dalam TypeScript.','Setiap langkah Gherkin terhubung ke step definition di TypeScript.'],
['Aisyah','I wrote “When I click the button with id submit”.','Saya tulis “Apabila saya klik butang dengan id submit”.','Saya menulis “When I click the button with id submit”.'],
['Dirwan','Try a declarative step instead, like “When the user submits the order”.','Cuba langkah deklaratif, seperti “Apabila pengguna menghantar pesanan”.','Coba langkah deklaratif, seperti “When the user submits the order”.'],
['Aisyah','Where do I store shared data?','Di mana saya simpan data dikongsi?','Di mana menyimpan data bersama?'],
['Dirwan','In the world object. And the Before hook opens the browser for each scenario.','Dalam objek dunia. Dan cangkuk Before membuka pelayar untuk setiap senario.','Di world object. Dan hook Before membuka browser untuk setiap skenario.']]],
64:['Interview QA: perkenalan diri.',[
['Interviewer','Thanks for coming. Tell me about yourself.','Terima kasih kerana datang. Ceritakan tentang diri anda.','Terima kasih sudah datang. Ceritakan tentang dirimu.'],
['Dirwan','I’m currently a QA engineer at a fintech company, where I test web apps and REST APIs.','Kini saya jurutera QA di syarikat fintech, di mana saya menguji aplikasi web dan API REST.','Saat ini saya QA engineer di perusahaan fintech, menguji aplikasi web dan REST API.'],
['Interviewer','How long have you been in QA?','Sudah berapa lama anda dalam QA?','Sudah berapa lama di QA?'],
['Dirwan','For five years. Before that, I worked as a manual tester in e-commerce.','Selama lima tahun. Sebelum itu, saya bekerja sebagai penguji manual dalam e-dagang.','Lima tahun. Sebelumnya saya tester manual di e-commerce.'],
['Interviewer','Why are you interested in this role?','Kenapa anda berminat dengan jawatan ini?','Kenapa tertarik dengan posisi ini?'],
['Dirwan','I’m looking for a role where I can grow in automation and contribute to your quality culture.','Saya mencari jawatan di mana saya boleh berkembang dalam automasi dan menyumbang kepada budaya kualiti anda.','Saya mencari posisi untuk berkembang di automation dan berkontribusi pada budaya kualitas Anda.']]],
65:['Interview QA: pertanyaan perilaku (STAR).',[
['Interviewer','Tell me about a time you improved a testing process.','Ceritakan tentang masa anda menambah baik proses ujian.','Ceritakan saat kamu memperbaiki proses testing.'],
['Dirwan','In my last project, our regression took three days before every release.','Dalam projek terakhir saya, regresi mengambil masa tiga hari sebelum setiap keluaran.','Di proyek terakhir, regresi butuh tiga hari sebelum setiap rilis.'],
['Interviewer','What was your role?','Apakah peranan anda?','Apa peranmu?'],
['Dirwan','My task was to reduce that time without losing coverage.','Tugas saya ialah mengurangkan masa itu tanpa kehilangan liputan.','Tugas saya mengurangi waktu itu tanpa kehilangan cakupan.'],
['Interviewer','What did you do?','Apa yang anda lakukan?','Apa yang kamu lakukan?'],
['Dirwan','I automated the top 200 cases and ran them in parallel. As a result, regression dropped to two hours.','Saya automasikan 200 kes utama dan jalankan secara selari. Hasilnya, regresi turun kepada dua jam.','Saya otomatisasi 200 kasus utama dan menjalankannya paralel. Hasilnya, regresi turun jadi dua jam.']]],
66:['Interview QA: cara menguji halaman login.',[
['Interviewer','How would you test a login page?','Bagaimana anda akan menguji halaman log masuk?','Bagaimana kamu menguji halaman login?'],
['Dirwan','First, I would ask about the password policy, lockout rules, and SSO.','Pertama, saya akan tanya tentang polisi kata laluan, peraturan kunci akaun, dan SSO.','Pertama, saya akan tanya kebijakan password, aturan lockout, dan SSO.'],
['Interviewer','Good. Then?','Bagus. Kemudian?','Bagus. Lalu?'],
['Dirwan','Then I would cover functional, negative, security, and accessibility tests.','Kemudian saya akan meliputi ujian fungsian, negatif, keselamatan, dan kebolehcapaian.','Lalu saya akan mencakup tes fungsional, negatif, keamanan, dan aksesibilitas.'],
['Interviewer','Give me a security example.','Beri saya contoh keselamatan.','Beri contoh keamanan.'],
['Dirwan','I would check that the account locks after five failed attempts and test for SQL injection.','Saya akan semak akaun dikunci selepas lima cubaan gagal dan uji suntikan SQL.','Saya akan cek akun terkunci setelah lima percobaan gagal dan tes SQL injection.']]],
67:['Interview QA: bug terbaik yang ditemukan.',[
['Interviewer','What’s the most interesting bug you’ve found?','Apakah pepijat paling menarik yang pernah anda jumpa?','Bug paling menarik yang pernah kamu temukan?'],
['Dirwan','A rounding issue in the discount calculation.','Isu pembundaran dalam pengiraan diskaun.','Masalah pembulatan di perhitungan diskon.'],
['Interviewer','Why was it interesting?','Kenapa ia menarik?','Kenapa menarik?'],
['Dirwan','It only happened when two vouchers were combined, and it caused a financial loss on every order.','Ia hanya berlaku apabila dua baucar digabungkan, dan ia menyebabkan kerugian kewangan pada setiap pesanan.','Hanya terjadi saat dua voucher digabung, dan menyebabkan kerugian di setiap pesanan.'],
['Interviewer','How did you catch it?','Bagaimana anda menangkapnya?','Bagaimana kamu menemukannya?'],
['Dirwan','By comparing the API total with a SQL query. Then I added a regression test.','Dengan membandingkan jumlah API dengan pertanyaan SQL. Kemudian saya tambah ujian regresi.','Dengan membandingkan total API dengan query SQL. Lalu saya tambah tes regresi.']]],
68:['Interview QA: situasi sulit.',[
['Interviewer','What would you do if there were no requirements?','Apa yang anda akan buat jika tiada keperluan?','Apa yang kamu lakukan jika tidak ada requirement?'],
['Dirwan','I would talk to the product owner first and learn from the existing app.','Saya akan berbincang dengan pemilik produk dahulu dan belajar daripada aplikasi sedia ada.','Saya akan bicara dengan product owner dulu dan belajar dari aplikasi yang ada.'],
['Interviewer','And if a developer disagreed with your bug?','Dan jika pembangun tidak bersetuju dengan pepijat anda?','Dan jika developer tidak setuju dengan bug-mu?'],
['Dirwan','I would stay calm and show evidence: logs, a video, and the acceptance criteria.','Saya akan kekal tenang dan tunjukkan bukti: log, video, dan kriteria penerimaan.','Saya tetap tenang dan menunjukkan bukti: log, video, dan acceptance criteria.'],
['Interviewer','What if the deadline is tomorrow?','Bagaimana jika tarikh akhir esok?','Bagaimana jika tenggatnya besok?'],
['Dirwan','My priority would be the critical paths, and I would be transparent about what wasn’t tested.','Keutamaan saya ialah laluan kritikal, dan saya akan telus tentang apa yang belum diuji.','Prioritas saya jalur kritis, dan saya transparan tentang apa yang belum dites.']]],
69:['Interview QA: pertanyaan penutup.',[
['Interviewer','Do you have any questions for us?','Ada apa-apa soalan untuk kami?','Ada pertanyaan untuk kami?'],
['Dirwan','Yes. Could you tell me more about the QA team structure?','Ya. Boleh terangkan lebih lanjut tentang struktur pasukan QA?','Ya. Bisa ceritakan struktur tim QA?'],
['Interviewer','We have six testers working in three squads.','Kami ada enam penguji dalam tiga skuad.','Kami punya enam tester di tiga squad.'],
['Dirwan','What does success look like in the first ninety days?','Apakah kejayaan dalam sembilan puluh hari pertama?','Seperti apa keberhasilan di sembilan puluh hari pertama?'],
['Interviewer','Owning the regression suite for one squad.','Mengendalikan suit regresi untuk satu skuad.','Memegang regression suite untuk satu squad.'],
['Dirwan','That sounds great. Thank you for your time. I look forward to hearing from you.','Itu bagus. Terima kasih atas masa anda. Saya menantikan maklum balas anda.','Kedengarannya bagus. Terima kasih atas waktunya. Saya menantikan kabar dari Anda.']]],
71:['Interview automation: menjelaskan framework.',[
['Interviewer','Walk me through your automation framework.','Terangkan rangka kerja automasi anda.','Jelaskan framework automation-mu.'],
['Dirwan','I built it using Playwright, TypeScript, and Allure.','Saya membinanya menggunakan Playwright, TypeScript, dan Allure.','Saya membangunnya dengan Playwright, TypeScript, dan Allure.'],
['Interviewer','What design pattern did you use?','Corak reka bentuk apa yang anda guna?','Pola desain apa yang kamu pakai?'],
['Dirwan','It follows the Page Object Model, with fixtures for setup and component objects for shared parts.','Ia mengikut Model Objek Halaman, dengan fixture untuk persediaan dan objek komponen untuk bahagian dikongsi.','Mengikuti Page Object Model, dengan fixture untuk setup dan component object untuk bagian bersama.'],
['Interviewer','How do you handle test data?','Bagaimana anda mengurus data ujian?','Bagaimana mengelola data tes?'],
['Dirwan','Test data is created through API calls, not the UI. It currently runs 800 tests in CI.','Data ujian dicipta melalui panggilan API, bukan UI. Sekarang ia menjalankan 800 ujian dalam CI.','Data tes dibuat lewat API, bukan UI. Saat ini menjalankan 800 tes di CI.']]],
72:['Interview automation: membandingkan tool.',[
['Interviewer','Why did you choose Playwright over Selenium?','Kenapa anda pilih Playwright berbanding Selenium?','Kenapa pilih Playwright dibanding Selenium?'],
['Dirwan','Playwright is faster and has auto-wait, which reduces flakiness.','Playwright lebih pantas dan ada tunggu automatik, yang mengurangkan ketidakstabilan.','Playwright lebih cepat dan punya auto-wait yang mengurangi flaky.'],
['Interviewer','Any downsides?','Ada kelemahan?','Ada kekurangan?'],
['Dirwan','On the other hand, it doesn’t support native mobile apps.','Sebaliknya, ia tidak menyokong aplikasi mudah alih asli.','Di sisi lain, tidak mendukung aplikasi mobile native.'],
['Interviewer','So what would you use for mobile?','Jadi apa yang anda guna untuk mudah alih?','Jadi untuk mobile pakai apa?'],
['Dirwan','WebdriverIO with Appium. But it depends on the project and the team’s skills.','WebdriverIO dengan Appium. Tetapi ia bergantung pada projek dan kemahiran pasukan.','WebdriverIO dengan Appium. Tapi tergantung proyek dan keahlian tim.']]],
73:['Interview automation: flaky test.',[
['Interviewer','How do you deal with flaky tests?','Bagaimana anda menangani ujian tidak stabil?','Bagaimana kamu menangani tes flaky?'],
['Dirwan','First, I look for a failure pattern in the Allure history.','Pertama, saya cari corak kegagalan dalam sejarah Allure.','Pertama, saya mencari pola kegagalan di riwayat Allure.'],
['Interviewer','Can you give me an example?','Boleh beri contoh?','Bisa beri contoh?'],
['Dirwan','The root cause was shared test data between parallel workers.','Punca utamanya ialah data ujian yang dikongsi antara pekerja selari.','Akar masalahnya data tes yang dipakai bersama antar worker paralel.'],
['Interviewer','What did you do?','Apa yang anda buat?','Apa yang kamu lakukan?'],
['Dirwan','I generated unique data per test. As a result, the flaky rate dropped from eight to one percent.','Saya jana data unik bagi setiap ujian. Hasilnya, kadar ketidakstabilan turun daripada lapan kepada satu peratus.','Saya membuat data unik per tes. Hasilnya, flaky rate turun dari delapan ke satu persen.']]],
74:['Interview automation: API dan SQL.',[
['Interviewer','How do you validate an order API?','Bagaimana anda sahkan API pesanan?','Bagaimana memvalidasi API order?'],
['Dirwan','I check the status code, the schema, and the business rules in the response.','Saya semak kod status, skema, dan peraturan perniagaan dalam respons.','Saya cek status code, skema, dan aturan bisnis di respons.'],
['Interviewer','Do you check the database too?','Adakah anda semak pangkalan data juga?','Apakah kamu juga cek database?'],
['Dirwan','Yes. I validate the order by querying the orders and order_items tables.','Ya. Saya sahkan pesanan dengan membuat pertanyaan pada jadual orders dan order_items.','Ya. Saya validasi pesanan dengan query ke tabel orders dan order_items.'],
['Interviewer','How would you find duplicate emails?','Bagaimana anda cari e-mel pendua?','Bagaimana mencari email duplikat?'],
['Dirwan','I would use GROUP BY email with HAVING COUNT greater than one.','Saya akan guna GROUP BY e-mel dengan HAVING COUNT lebih daripada satu.','Saya pakai GROUP BY email dengan HAVING COUNT lebih dari satu.']]],
75:['Interview automation: CI/CD.',[
['Interviewer','How are your tests integrated into CI?','Bagaimana ujian anda diintegrasikan dalam CI?','Bagaimana tesmu terintegrasi di CI?'],
['Dirwan','Smoke tests run as a pull request check, and the full suite runs nightly.','Ujian asap berjalan sebagai semakan permintaan tarik, dan suit penuh berjalan setiap malam.','Smoke test jalan sebagai cek pull request, suite lengkap jalan tiap malam.'],
['Interviewer','How long does the full suite take?','Berapa lama suit penuh mengambil masa?','Suite lengkap butuh berapa lama?'],
['Dirwan','About ten minutes. We split it into four shards.','Lebih kurang sepuluh minit. Kami bahagikan kepada empat bahagian.','Sekitar sepuluh menit. Kami bagi menjadi empat shard.'],
['Interviewer','What’s your strategy for UI tests?','Apakah strategi anda untuk ujian UI?','Apa strategimu untuk tes UI?'],
['Dirwan','We follow the test pyramid: many unit tests, fewer API tests, and only a few UI tests.','Kami ikut piramid ujian: banyak ujian unit, kurang ujian API, dan sedikit ujian UI.','Kami mengikuti test pyramid: banyak unit test, lebih sedikit API test, dan hanya sedikit UI test.']]],
76:['Interview automation: sesi live coding.',[
['Interviewer','Write a function that reverses each word in a sentence.','Tulis fungsi yang menterbalikkan setiap perkataan dalam ayat.','Tulis fungsi yang membalik setiap kata dalam kalimat.'],
['Dirwan','Let me make sure I understand: reverse each word, but keep the word order?','Biar saya pastikan saya faham: terbalikkan setiap perkataan, tetapi kekalkan susunan perkataan?','Saya pastikan dulu: balik setiap kata, tapi urutan kata tetap?'],
['Interviewer','Correct.','Betul.','Benar.'],
['Dirwan','My approach is to split by space, reverse each word, then join them.','Pendekatan saya ialah pecahkan mengikut ruang, terbalikkan setiap perkataan, kemudian gabungkan.','Pendekatan saya: pisah dengan spasi, balik setiap kata, lalu gabungkan.'],
['Interviewer','What about edge cases?','Bagaimana dengan kes pinggir?','Bagaimana dengan kasus tepi?'],
['Dirwan','Let me check an empty string and multiple spaces. The time complexity is O of n.','Biar saya semak rentetan kosong dan ruang berganda. Kerumitan masa ialah O n.','Saya cek string kosong dan spasi ganda. Kompleksitas waktunya O(n).']]],
78:['Stand-up harian.',[
['Daniel','Good morning. Dirwan, you go first.','Selamat pagi. Dirwan, awak dahulu.','Selamat pagi. Dirwan, kamu duluan.'],
['Dirwan','Yesterday I finished testing the refund flow.','Semalam saya siapkan ujian aliran bayaran balik.','Kemarin saya selesai mengetes alur refund.'],
['Daniel','Great. And today?','Bagus. Dan hari ini?','Bagus. Hari ini?'],
['Dirwan','Today I’m going to automate the checkout tests.','Hari ini saya akan automasikan ujian pembayaran.','Hari ini saya akan mengotomatisasi tes checkout.'],
['Daniel','Any blockers?','Ada penghalang?','Ada hambatan?'],
['Dirwan','I’m blocked by the staging server. Just a heads-up: the nightly build is red.','Saya tersekat oleh pelayan staging. Makluman awal: binaan malam berwarna merah.','Saya terhambat server staging. Sekadar info: build malam merah.']]],
79:['Demo fitur kepada stakeholder.',[
['Dirwan','Let me walk you through the new checkout flow.','Biar saya bawa anda melihat aliran pembayaran baharu.','Saya akan memandu Anda melihat alur checkout baru.'],
['Dirwan','As you can see, it takes only two steps now.','Seperti yang anda lihat, ia hanya ambil dua langkah sekarang.','Seperti yang Anda lihat, sekarang hanya dua langkah.'],
['Mr. Tan','Impressive. What about errors?','Mengagumkan. Bagaimana dengan ralat?','Mengesankan. Bagaimana dengan error?'],
['Dirwan','Moving on to error handling: every failed payment shows a clear message.','Seterusnya pengendalian ralat: setiap pembayaran gagal menunjukkan mesej yang jelas.','Berikutnya penanganan error: setiap pembayaran gagal menampilkan pesan jelas.'],
['Mr. Tan','Any limitations?','Ada had?','Ada keterbatasan?'],
['Dirwan','One limitation is offline mode. To sum up, the feature is tested and ready.','Satu hadnya ialah mod luar talian. Kesimpulannya, ciri ini sudah diuji dan sedia.','Satu keterbatasannya mode offline. Singkatnya, fitur sudah dites dan siap.']]],
80:['Menyampaikan laporan insiden.',[
['Daniel','Can you walk us through the incident?','Boleh terangkan insiden itu?','Bisa jelaskan insidennya?'],
['Dirwan','At 10:05, the payment service started returning errors.','Pada pukul 10:05, perkhidmatan pembayaran mula memulangkan ralat.','Pukul 10:05, layanan pembayaran mulai mengembalikan error.'],
['Daniel','What caused it?','Apa puncanya?','Apa penyebabnya?'],
['Dirwan','While we were deploying, the database connection pool ran out.','Semasa kami membuat atur gerak, kumpulan sambungan pangkalan data habis.','Saat kami deploy, connection pool database habis.'],
['Daniel','What was the impact?','Apakah kesannya?','Apa dampaknya?'],
['Dirwan','By the time we noticed, 300 orders had failed. Going forward, we will add an alert.','Semasa kami sedar, 300 pesanan telah gagal. Selepas ini, kami akan tambah amaran.','Saat kami sadar, 300 pesanan sudah gagal. Ke depan, kami akan menambah alert.']]],
81:['Negosiasi scope dengan klien.',[
['Mr. Tan','We need everything by Friday.','Kami perlukan semuanya sebelum Jumaat.','Kami butuh semuanya Jumat.'],
['Dirwan','We can deliver the MVP by Friday if we move reports to phase two.','Kami boleh siapkan MVP sebelum Jumaat jika kita pindahkan laporan ke fasa dua.','Kami bisa mengirim MVP Jumat jika laporan dipindah ke fase dua.'],
['Mr. Tan','Can’t you just skip some testing?','Tidak bolehkah awak langkau sebahagian ujian?','Tidak bisakah melewatkan sebagian testing?'],
['Dirwan','If we skip regression, the risk is that existing features break.','Jika kita langkau regresi, risikonya ialah ciri sedia ada rosak.','Jika regresi dilewati, risikonya fitur yang ada rusak.'],
['Mr. Tan','I see. Reports can wait.','Saya faham. Laporan boleh tunggu.','Saya paham. Laporan bisa menunggu.'],
['Dirwan','Thank you. In exchange, we’ll give you early access next week.','Terima kasih. Sebagai balasan, kami akan beri akses awal minggu depan.','Terima kasih. Sebagai gantinya, kami beri akses awal minggu depan.']]],
82:['Mock interview lengkap.',[
['Interviewer','Could you elaborate on your API testing experience?','Boleh huraikan pengalaman ujian API anda?','Bisa uraikan pengalaman API testing-mu?'],
['Dirwan','For example, I built a contract test suite for our payment API.','Sebagai contoh, saya bina suit ujian kontrak untuk API pembayaran kami.','Sebagai contoh, saya membangun contract test suite untuk API pembayaran.'],
['Interviewer','Have you used Cypress?','Pernahkah anda guna Cypress?','Pernah pakai Cypress?'],
['Dirwan','To be honest, not much, but I’ve used Playwright a lot and I learn tools quickly.','Sejujurnya, tidak banyak, tetapi saya banyak guna Playwright dan cepat belajar alat baharu.','Jujur, belum banyak, tapi saya sering pakai Playwright dan cepat belajar tool.'],
['Interviewer','How would you test a file upload?','Bagaimana anda akan menguji muat naik fail?','Bagaimana menguji upload file?'],
['Dirwan','That’s a good question. I would test size limits, file types, an interrupted upload, and security.','Soalan yang bagus. Saya akan uji had saiz, jenis fail, muat naik yang terganggu, dan keselamatan.','Pertanyaan bagus. Saya tes batas ukuran, tipe file, upload terputus, dan keamanan.']]],
83:['Negosiasi gaji dengan HR.',[
['HR','What is your salary expectation?','Berapakah jangkaan gaji anda?','Berapa ekspektasi gajimu?'],
