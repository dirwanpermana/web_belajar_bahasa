[69,'Do you have any questions for us?','Yes. Could you tell me more about the QA team structure? What does success look like in the first ninety days? And how do developers and QA share responsibility for quality here?','Siapkan tiga pertanyaan.'],
[69,'Why do you want to work here?','I like that your company builds products used by millions of people, and quality really matters at that scale. I also saw that you invest in automation and CI/CD, which matches the direction I want to grow in.','Hubungkan perusahaan dengan tujuanmu.'],
[69,'Where do you see yourself in five years?','In five years, I see myself as a QA lead who designs test strategies and mentors other testers, while still being hands-on with automation.','Ambisius tapi realistis.'],
[71,'Walk me through your automation framework.','I built our framework with Playwright and TypeScript. It follows the Page Object Model, with fixtures for setup and dependency injection. Test data is created through APIs, configuration is per environment, and secrets come from the CI vault. Reports go to Allure. It runs about 800 tests in CI.','Alat – pola – data – laporan – angka.'],
[71,'How do you manage test data in automation?','I create data through APIs or database seeds before each test and clean it up after. Each test uses unique data so tests can run in parallel. I avoid depending on shared, pre-existing data.','Unik, terisolasi, dibersihkan.'],
[71,'How do you make your framework scalable for many teams?','I keep a clear folder structure, shared base classes and components, coding standards with ESLint, and good documentation. Teams can add their own page objects without changing the core.','Struktur, standar, dokumentasi.'],
[72,'Compare Playwright and Selenium.','Playwright is faster and has built-in auto-wait, network interception, and multi-tab support. Selenium has a larger community and supports more languages and older browsers. For a modern web app with a TypeScript team, I would choose Playwright.','Seimbang lalu rekomendasi.'],
[72,'When would you choose WebdriverIO?','I would choose WebdriverIO when we need both web and native mobile automation with Appium in one framework, or when the team already uses the WebDriver ecosystem.','Konteks mobile.'],
[72,'What are the limitations of UI automation?','UI tests are slower, more fragile, and more expensive to maintain than unit or API tests. That’s why I keep only critical user journeys at the UI level and push other checks down to the API layer.','Hubungkan dengan test pyramid.'],
[73,'How do you handle flaky tests?','First, I find the failure pattern using reports and traces. Common causes are timing, shared data, test order, and unstable environments. I fix the root cause, for example by waiting for a specific condition or isolating data. Retries are only a temporary safety net, and flaky tests are quarantined until fixed.','Akar masalah, bukan retry.'],
[73,'What is a false positive in automation?','A false positive is when a test fails even though the application works correctly, usually because of a test problem like a bad locator or timing. Too many false positives make the team stop trusting the tests.','Kepercayaan tim.'],
[73,'How do you measure the health of an automation suite?','I track pass rate, flaky rate, execution time, and how many real bugs the suite catches. I also review tests that never fail or always fail, because they give no signal.','Metrik kesehatan.'],
[74,'How do you test a REST API?','I check the status code, response schema, headers, and business data. I test positive and negative cases: invalid input, missing fields, wrong types, auth with missing or expired tokens, permissions, and rate limits. I also verify the database after write operations.','Lapisan validasi.'],
[74,'Write a query to find users who have never placed an order.','I would use a left join from users to orders and filter where the order ID is null. For example: SELECT u.id FROM users u LEFT JOIN orders o ON o.user_id = u.id WHERE o.id IS NULL.','Left join + IS NULL.'],
[74,'How do you test a stored procedure?','I prepare known input data, call the procedure, and compare the output and the changed rows with the expected results. I test edge cases like nulls and boundaries, and I check that transactions roll back correctly on errors.','Input, output, rollback.'],
[75,'How do you integrate tests into CI/CD?','Smoke and API tests run on every pull request as a quality gate. After deployment to staging, we run a smoke suite. The full regression runs nightly in parallel shards. Reports and alerts are published automatically.','Tahap per tahap.'],
[75,'Explain the test pyramid.','The test pyramid suggests many fast unit tests at the bottom, fewer integration and API tests in the middle, and only a few UI end-to-end tests at the top. This gives fast feedback at a lower cost.','Banyak – sedang – sedikit.'],
[75,'How did you reduce test execution time?','I ran tests in parallel with four workers, split the suite into shards, moved setup from the UI to API calls, and removed duplicate tests. Execution time went from forty to twelve minutes.','Teknik + angka.'],
[76,'How do you approach a live coding task?','I first repeat the problem to make sure I understand it and ask about edge cases. Then I explain my approach, write a simple working version, and test it with examples. Finally, I discuss complexity and possible improvements.','Pahami – rencana – kode – uji.'],
[76,'What is the difference between async and sync code in JavaScript?','Synchronous code runs line by line and blocks until each step finishes. Asynchronous code, using promises and async/await, lets other work continue while waiting, for example for a network response. Playwright actions are async, so we await them.','Hubungkan dengan Playwright.'],
[76,'Why do you use TypeScript for automation?','TypeScript adds type safety, better autocomplete, and earlier error detection. In a large framework, interfaces for page objects and test data make the code easier to maintain and refactor.','Keamanan tipe + maintainability.'],
[82,'Why should we hire you?','I combine strong manual testing skills and business understanding with hands-on automation in Playwright and API testing. I communicate clearly with developers and stakeholders, and I care about preventing bugs, not just finding them.','Ringkas nilai unikmu.'],
[82,'How do you keep your skills up to date?','I follow testing communities, read release notes for Playwright, take online courses, and try new tools in small side projects. I also share what I learn with my team.','Belajar dan berbagi.'],
[82,'How do you prioritize your testing tasks?','I prioritize by risk: business impact, usage frequency, and recent changes. I agree on priorities with the product owner and adjust daily in the stand-up.','Risiko + kesepakatan.'],
[83,'What is your salary expectation?','Based on my experience and the current market rate for this role in Kuala Lumpur, I’m looking for around 8,000 to 9,000 ringgit. I’m open to discussing the full package.','Rentang + dasar + terbuka.'],
[83,'When can you start?','My notice period is one month, so I could start at the beginning of next month. I can also try to discuss an earlier release with my current company.','Jelas dan fleksibel.']

[1,'Same result, three times out of three.','Keputusan yang sama, tiga daripada tiga kali.','Hasil sama, tiga dari tiga kali.'],
[2,'I recorded a video, checked the database, and wrote a clear bug report.','Saya rakam video, semak pangkalan data, dan tulis laporan pepijat yang jelas.','Aku merekam video, mengecek database, dan menulis laporan bug yang jelas.'],
[2,'The title was simple: “Checkout: total becomes 0 after back navigation with two vouchers.”','Tajuknya mudah: “Pembayaran: jumlah jadi 0 selepas kembali dengan dua baucar.”','Judulnya sederhana: “Checkout: total jadi 0 setelah kembali dengan dua voucher.”'],
[2,'Ali, the developer, read it and sighed, “Good catch, but bad timing.”','Ali, si pembangun, membacanya dan mengeluh, “Tangkapan bagus, tapi masa tak kena.”','Ali, sang developer, membacanya dan menghela napas, “Temuan bagus, tapi waktunya tidak pas.”'],
[2,'We sat together until eight, found the root cause, and added a unit test.','Kami duduk bersama sehingga pukul lapan, jumpa punca utama, dan tambah ujian unit.','Kami duduk bersama sampai jam delapan, menemukan akar masalah, dan menambah unit test.'],
[3,'On Friday, the release went live without a single complaint.','Pada hari Jumaat, keluaran itu dilancarkan tanpa satu aduan pun.','Jumat, rilisnya live tanpa satu keluhan pun.'],
[3,'Later, our product owner calculated that the bug could have cost thousands of ringgit per day.','Kemudian, pemilik produk kami mengira pepijat itu boleh menyebabkan kerugian ribuan ringgit sehari.','Belakangan, product owner kami menghitung bug itu bisa merugikan ribuan ringgit per hari.'],
[3,'Ali bought me coffee and said, “Next time, find it on Tuesday, okay?”','Ali belanja saya kopi dan berkata, “Lain kali, jumpa pada hari Selasa, okey?”','Ali mentraktirku kopi dan berkata, “Lain kali temukan di hari Selasa, ya?”'],
[3,'We both laughed, because we knew the real lesson: test early, and test like a user.','Kami berdua ketawa, kerana kami tahu pengajaran sebenar: uji awal, dan uji seperti pengguna.','Kami berdua tertawa, karena tahu pelajaran sebenarnya: tes lebih awal, dan tes seperti pengguna.']]},
{ key:'mamak', week:[3,10], title_en:'Small Talk at the Mamak Stall', title_ms:'Berbual di Kedai Mamak', title_id:'Obrolan Ringan di Warung Mamak', tag:'Makan siang & obrolan', s:[
[0,'At one o’clock, the whole QA team walked to our favorite mamak stall.','Pada pukul satu, seluruh pasukan QA berjalan ke kedai mamak kegemaran kami.','Jam satu, seluruh tim QA berjalan ke warung mamak favorit kami.'],
[0,'The air smelled of roti canai, fried onions, and sweet tea.','Udara berbau roti canai, bawang goreng, dan teh manis.','Udaranya beraroma roti canai, bawang goreng, dan teh manis.'],
[0,'I ordered nasi lemak with an egg, the same as every Wednesday.','Saya pesan nasi lemak dengan telur, sama seperti setiap hari Rabu.','Saya memesan nasi lemak dengan telur, sama seperti setiap Rabu.'],
[1,'Daniel asked me, “So, how do you find Kuala Lumpur so far?”','Daniel tanya saya, “Jadi, bagaimana awak dapati Kuala Lumpur setakat ini?”','Daniel bertanya, “Jadi, bagaimana menurutmu Kuala Lumpur sejauh ini?”'],
[1,'I told him the food was amazing, but the traffic was a test case I always failed.','Saya beritahu dia makanannya hebat, tetapi lalu lintas ialah kes ujian yang saya selalu gagal.','Kubilang makanannya luar biasa, tapi lalu lintasnya test case yang selalu kugagal.'],
[1,'Everyone laughed, and Aisyah shared her own story about getting lost in the LRT.','Semua orang ketawa, dan Aisyah berkongsi kisahnya sendiri tersesat di LRT.','Semua tertawa, dan Aisyah menceritakan kisahnya sendiri tersesat di LRT.'],
[2,'Then the conversation moved to weekends and hobbies.','Kemudian perbualan beralih kepada hujung minggu dan hobi.','Lalu obrolan beralih ke akhir pekan dan hobi.'],
[2,'Ali plays futsal, Aisyah bakes cakes, and Daniel is learning to play the guitar.','Ali main futsal, Aisyah membuat kek, dan Daniel sedang belajar bermain gitar.','Ali main futsal, Aisyah membuat kue, dan Daniel sedang belajar gitar.'],
[2,'When they asked about me, I said I was learning Malay fifteen minutes a day.','Apabila mereka tanya tentang saya, saya kata saya belajar bahasa Melayu lima belas minit sehari.','Saat mereka bertanya tentangku, kubilang aku belajar bahasa Melayu lima belas menit sehari.'],
[2,'“Okay, test time,” said Aisyah. “What is ‘bug’ in Malay?”','“Okey, masa ujian,” kata Aisyah. “Apa ‘bug’ dalam bahasa Melayu?”','“Oke, waktunya tes,” kata Aisyah. “Apa ‘bug’ dalam bahasa Melayu?”'],
[2,'“Pepijat!” I answered, and the whole table cheered.','“Pepijat!” jawab saya, dan seluruh meja bersorak.','“Pepijat!” jawabku, dan seluruh meja bersorak.'],
[3,'Small talk used to scare me more than a production incident.','Berbual kosong dahulu lebih menakutkan saya daripada insiden produksi.','Obrolan ringan dulu lebih menakutkan bagiku daripada insiden produksi.'],
[3,'Now I know it is just a simple pattern: ask a question, share a story, and listen.','Kini saya tahu ia hanya corak mudah: tanya soalan, kongsi cerita, dan dengar.','Sekarang aku tahu polanya sederhana: bertanya, berbagi cerita, dan mendengarkan.'],
[3,'We walked back to the office slowly, full and happy.','Kami berjalan pulang ke pejabat perlahan-lahan, kenyang dan gembira.','Kami berjalan kembali ke kantor pelan-pelan, kenyang dan senang.']]},
{ key:'feature', week:[6,7], title_en:'From Idea to Production', title_ms:'Dari Idea ke Produksi', title_id:'Dari Ide ke Produksi', tag:'Pengembangan aplikasi', s:[
[0,'On Monday, Sarah, our product owner, came to refinement with a big idea.','Pada hari Isnin, Sarah, pemilik produk kami, datang ke sesi penghalusan dengan idea besar.','Senin, Sarah, product owner kami, datang ke refinement dengan ide besar.'],
[0,'“Customers want to split the bill with their friends,” she said.','“Pelanggan mahu berkongsi bayaran dengan kawan-kawan mereka,” katanya.','“Pelanggan ingin membagi tagihan dengan teman-temannya,” katanya.'],
[0,'Everyone loved it, but I asked the first question: “What happens if one friend doesn’t pay?”','Semua orang suka, tetapi saya tanya soalan pertama: “Apa berlaku jika seorang kawan tidak bayar?”','Semua suka, tapi aku bertanya pertama: “Apa yang terjadi kalau satu teman tidak bayar?”'],
[1,'The room went quiet, and then the real discussion started.','Bilik itu senyap, dan kemudian perbincangan sebenar bermula.','Ruangan hening, lalu diskusi sebenarnya dimulai.'],
[1,'We wrote the user story together and added five acceptance criteria.','Kami tulis cerita pengguna bersama dan tambah lima kriteria penerimaan.','Kami menulis user story bersama dan menambah lima acceptance criteria.'],
[1,'Ali designed the API, and Aisyah created the new tables in PostgreSQL.','Ali mereka bentuk API, dan Aisyah mencipta jadual baharu dalam PostgreSQL.','Ali mendesain API, dan Aisyah membuat tabel baru di PostgreSQL.'],
[1,'While they were coding, I wrote test scenarios with Given, When, and Then.','Semasa mereka menulis kod, saya tulis senario ujian dengan Diberi, Apabila, dan Maka.','Saat mereka coding, aku menulis skenario tes dengan Given, When, dan Then.'],
[2,'On Wednesday, the first pull request arrived, and the pipeline turned red.','Pada hari Rabu, permintaan tarik pertama tiba, dan saluran paip bertukar merah.','Rabu, pull request pertama masuk, dan pipeline jadi merah.'],
[2,'My API test caught a rounding error when the bill was split between three people.','Ujian API saya menangkap ralat pembundaran apabila bil dibahagi antara tiga orang.','Tes API-ku menangkap kesalahan pembulatan saat tagihan dibagi tiga orang.'],
[2,'Ali fixed it in ten minutes and thanked the test, not me, which was fair.','Ali membaikinya dalam sepuluh minit dan berterima kasih kepada ujian itu, bukan saya, yang memang adil.','Ali memperbaikinya dalam sepuluh menit dan berterima kasih pada tesnya, bukan padaku, dan itu adil.'],
[2,'By Thursday, the feature was on staging, hidden behind a feature flag.','Menjelang Khamis, ciri itu sudah di staging, tersembunyi di sebalik bendera ciri.','Kamis, fiturnya sudah di staging, tersembunyi di balik feature flag.'],
[3,'On Friday, we turned it on for five percent of users and watched the dashboard.','Pada hari Jumaat, kami hidupkan untuk lima peratus pengguna dan memantau papan pemuka.','Jumat, kami nyalakan untuk lima persen pengguna dan memantau dasbor.'],
[3,'No errors, no complaints, and three hundred split payments in one hour.','Tiada ralat, tiada aduan, dan tiga ratus pembayaran berkongsi dalam sejam.','Tidak ada error, tidak ada keluhan, dan tiga ratus pembayaran patungan dalam sejam.'],
[3,'Sarah sent a message to the team: “From idea to production in five days. Well done!”','Sarah hantar mesej kepada pasukan: “Dari idea ke produksi dalam lima hari. Syabas!”','Sarah mengirim pesan ke tim: “Dari ide ke produksi dalam lima hari. Kerja bagus!”'],
[3,'I smiled, because quality was not a phase at the end; it was there from the first question.','Saya tersenyum, kerana kualiti bukan fasa di hujung; ia ada sejak soalan pertama.','Aku tersenyum, karena kualitas bukan fase di akhir; ia ada sejak pertanyaan pertama.']]},
{ key:'incident', week:[12], title_en:'The Night Production Went Down', title_ms:'Malam Produksi Terputus', title_id:'Malam Ketika Produksi Mati', tag:'Insiden', s:[
[0,'I was brushing my teeth at eleven when my phone started buzzing nonstop.','Saya sedang memberus gigi pada pukul sebelas apabila telefon saya bergetar tanpa henti.','Aku sedang menyikat gigi jam sebelas ketika ponselku bergetar tanpa henti.'],
[0,'The monitoring channel was full of red alerts: payments were failing.','Saluran pemantauan penuh dengan amaran merah: pembayaran gagal.','Kanal monitoring penuh peringatan merah: pembayaran gagal.'],
[0,'I wasn’t on call, but I opened my laptop anyway.','Saya tidak bertugas, tetapi saya buka komputer riba juga.','Aku tidak sedang piket, tapi tetap membuka laptop.'],
[1,'Ali was already in the call, speaking fast and checking logs.','Ali sudah berada dalam panggilan, bercakap laju dan menyemak log.','Ali sudah di panggilan, bicara cepat sambil mengecek log.'],
[1,'“The database connection pool ran out after the evening deployment,” he said.','“Kumpulan sambungan pangkalan data habis selepas atur gerak petang tadi,” katanya.','“Connection pool database habis setelah deployment sore tadi,” katanya.'],
[1,'I asked a simple question: “Can we roll back first and investigate later?”','Saya tanya soalan mudah: “Boleh kita undur semula dahulu dan siasat kemudian?”','Aku bertanya sederhana: “Bisa kita rollback dulu dan investigasi nanti?”'],
[1,'Daniel agreed, and ten minutes later, the graphs turned green again.','Daniel bersetuju, dan sepuluh minit kemudian, graf kembali hijau.','Daniel setuju, dan sepuluh menit kemudian grafiknya kembali hijau.'],
[2,'The next morning, we held a blameless postmortem.','Keesokan paginya, kami adakan bedah siasat tanpa menyalahkan.','Paginya kami mengadakan postmortem tanpa menyalahkan.'],
[2,'We wrote the timeline minute by minute, from detection to recovery.','Kami tulis garis masa minit demi minit, dari pengesanan hingga pemulihan.','Kami menulis kronologi menit demi menit, dari deteksi sampai pemulihan.'],
[2,'The root cause was a new query without an index, called thousands of times per minute.','Punca utamanya ialah pertanyaan baharu tanpa indeks, dipanggil ribuan kali seminit.','Akar masalahnya query baru tanpa index, dipanggil ribuan kali per menit.'],
[2,'My performance test had been skipped to save time before the release.','Ujian prestasi saya telah dilangkau untuk menjimatkan masa sebelum keluaran.','Tes performaku dilewati untuk menghemat waktu sebelum rilis.'],
[3,'No one blamed anyone, but we agreed on three action items.','Tiada siapa menyalahkan sesiapa, tetapi kami bersetuju dengan tiga perkara tindakan.','Tidak ada yang menyalahkan siapa pun, tapi kami sepakat tiga action item.'],
[3,'Add the index, add an alert for connections, and never skip the load test again.','Tambah indeks, tambah amaran untuk sambungan, dan jangan sekali-kali langkau ujian beban lagi.','Tambah index, tambah alert untuk koneksi, dan jangan pernah melewati load test lagi.'],
[3,'That night I slept well, with only one alarm and zero red alerts.','Malam itu saya tidur nyenyak, dengan hanya satu jam loceng dan sifar amaran merah.','Malam itu aku tidur nyenyak, dengan satu alarm dan nol peringatan merah.']]},
{ key:'wfh', week:[3,10], title_en:'A Rainy Friday at Home', title_ms:'Jumaat Hujan di Rumah', title_id:'Jumat Hujan di Rumah', tag:'Kerja dari rumah', s:[
[0,'On Fridays I work from home, and this Friday began with thunder.','Pada hari Jumaat saya bekerja dari rumah, dan Jumaat ini bermula dengan guruh.','Setiap Jumat aku bekerja dari rumah, dan Jumat ini dimulai dengan guntur.'],
[0,'I made coffee, opened the window a little, and listened to the rain.','Saya buat kopi, buka tingkap sedikit, dan dengar bunyi hujan.','Aku membuat kopi, membuka jendela sedikit, dan mendengarkan hujan.'],
[0,'No traffic jam, no crowded train, just my desk and a long to-do list.','Tiada kesesakan, tiada kereta api sesak, hanya meja saya dan senarai tugasan yang panjang.','Tidak ada macet, tidak ada kereta sesak, hanya mejaku dan daftar tugas panjang.'],
[1,'At nine, the stand-up was short because half the team had a bad connection.','Pada pukul sembilan, mesyuarat harian singkat kerana separuh pasukan ada masalah sambungan.','Jam sembilan, stand-up singkat karena separuh tim koneksinya buruk.'],
[1,'I spent the morning automating the login tests with Playwright.','Saya habiskan pagi dengan mengautomasikan ujian log masuk menggunakan Playwright.','Aku menghabiskan pagi mengotomatisasi tes login dengan Playwright.'],
[1,'Suddenly, the power went off, and my screen went black.','Tiba-tiba, bekalan elektrik terputus, dan skrin saya menjadi gelap.','Tiba-tiba listrik padam, dan layarku menjadi gelap.'],
[1,'Luckily, my laptop battery was full and my phone could share internet.','Nasib baik, bateri komputer riba saya penuh dan telefon saya boleh kongsi internet.','Untungnya baterai laptop penuh dan ponselku bisa berbagi internet.'],
[2,'I sent a quick heads-up to the team and continued writing test cases offline.','Saya hantar makluman ringkas kepada pasukan dan teruskan menulis kes ujian di luar talian.','Aku mengirim info singkat ke tim dan lanjut menulis test case secara offline.'],
[2,'The power came back after an hour, together with the sun.','Bekalan elektrik pulih selepas sejam, bersama matahari.','Listrik kembali setelah satu jam, bersama matahari.'],
[2,'In the afternoon, I pushed my branch and my first pull request passed every check.','Pada waktu petang, saya tolak cabang saya dan permintaan tarik pertama saya lulus setiap semakan.','Sore harinya aku push branch dan pull request pertamaku lolos semua cek.'],
[3,'At five, I closed the laptop and went jogging around the lake.','Pada pukul lima, saya tutup komputer riba dan pergi berjoging di sekeliling tasik.','Jam lima aku menutup laptop dan jogging mengelilingi danau.'],
[3,'In the evening, I called my mother in Jakarta and told her about my week.','Pada waktu malam, saya telefon ibu saya di Jakarta dan cerita tentang minggu saya.','Malamnya aku menelepon ibuku di Jakarta dan bercerita tentang mingguku.'],
[3,'She asked, “Are you happy there?” and I answered without thinking: “Yes, I am.”','Dia tanya, “Kamu gembira di sana?” dan saya jawab tanpa berfikir: “Ya, gembira.”','Dia bertanya, “Kamu bahagia di sana?” dan aku menjawab tanpa berpikir: “Ya, bahagia.”'],
[3,'Some weeks are a storm, some are sunshine, and both make good stories.','Ada minggu yang ribut, ada yang cerah, dan kedua-duanya menjadi cerita yang baik.','Ada minggu yang badai, ada yang cerah, dan keduanya jadi cerita yang bagus.']]}
];

{ cat:'dev', title:'Sprint planning: fitur bayar patungan', ctx:'Sarah (product owner) membawa fitur baru ke sprint planning bersama Ali dan Dirwan.', l:[
['Sarah','The top item this sprint is split payment. Customers can share a bill with friends.','Item utama sprint ini ialah bayaran berkongsi. Pelanggan boleh berkongsi bil dengan kawan.','Item teratas sprint ini split payment. Pelanggan bisa membagi tagihan dengan teman.'],
['Ali','How many people can share one bill?','Berapa orang boleh berkongsi satu bil?','Berapa orang bisa berbagi satu tagihan?'],
['Sarah','Up to five, for now.','Sehingga lima orang, buat masa ini.','Maksimal lima, untuk sekarang.'],
['Dirwan','What happens if one person doesn’t pay within the time limit?','Apa berlaku jika seorang tidak bayar dalam had masa?','Apa yang terjadi jika satu orang tidak bayar dalam batas waktu?'],
['Sarah','Good question. The organizer pays the rest automatically.','Soalan bagus. Penganjur akan bayar baki secara automatik.','Pertanyaan bagus. Penyelenggara membayar sisanya otomatis.'],
['Dirwan','Then we need clear acceptance criteria for that, plus a notification.','Kalau begitu kita perlukan kriteria penerimaan yang jelas untuk itu, dan juga pemberitahuan.','Kalau begitu kita butuh acceptance criteria yang jelas, plus notifikasi.'],
['Ali','On the backend side, I’ll need a new endpoint and two tables.','Di bahagian belakang, saya perlukan titik akhir baharu dan dua jadual.','Dari sisi backend, aku butuh endpoint baru dan dua tabel.'],
['Sarah','How big is it? Can we finish it in one sprint?','Berapa besar? Boleh kita siapkan dalam satu sprint?','Seberapa besar? Bisa selesai dalam satu sprint?'],
['Ali','I’d estimate eight story points for development.','Saya anggarkan lapan mata cerita untuk pembangunan.','Aku estimasi delapan story point untuk development.'],
['Dirwan','And three for testing, including API tests and the rounding cases.','Dan tiga untuk ujian, termasuk ujian API dan kes pembundaran.','Dan tiga untuk testing, termasuk tes API dan kasus pembulatan.'],
['Sarah','Eleven points is fine. Let’s commit to it.','Sebelas mata tidak mengapa. Mari kita komited.','Sebelas poin oke. Ayo kita komit.'],
['Dirwan','I’ll write the test scenarios today so Ali can see them early.','Saya akan tulis senario ujian hari ini supaya Ali boleh lihat lebih awal.','Aku tulis skenario tes hari ini supaya Ali bisa melihatnya lebih awal.'],
['Ali','That would be really helpful, thanks.','Itu sangat membantu, terima kasih.','Itu sangat membantu, makasih.']]},
{ cat:'dev', title:'Diskusi kontrak API dengan backend', ctx:'Dirwan dan Aisyah membahas respons API pesanan sebelum pengujian dimulai.', l:[
['Dirwan','Aisyah, do you have a minute to go through the orders API?','Aisyah, ada masa seminit untuk bincang API pesanan?','Aisyah, ada waktu sebentar untuk membahas API orders?'],
['Aisyah','Sure. What would you like to check?','Boleh. Apa yang awak mahu semak?','Tentu. Apa yang ingin kamu cek?'],
['Dirwan','When an order is created, does the API return 201 or 200?','Apabila pesanan dicipta, adakah API memulangkan 201 atau 200?','Saat order dibuat, API mengembalikan 201 atau 200?'],
['Aisyah','It returns 201, with the order ID in the response body.','Ia memulangkan 201, dengan ID pesanan dalam badan respons.','Mengembalikan 201, dengan order ID di response body.'],
['Dirwan','And if the token is expired?','Dan jika token sudah tamat tempoh?','Dan kalau tokennya kedaluwarsa?'],
['Aisyah','Then you’ll get 401 with an error code called TOKEN_EXPIRED.','Kemudian awak akan dapat 401 dengan kod ralat TOKEN_EXPIRED.','Kamu akan dapat 401 dengan kode error TOKEN_EXPIRED.'],
['Dirwan','Great. Is there a JSON schema I can use for validation?','Bagus. Ada skema JSON yang boleh saya guna untuk validasi?','Bagus. Ada JSON schema yang bisa kupakai untuk validasi?'],
['Aisyah','Yes, it’s in the repository under docs/openapi.','Ya, ia ada dalam repositori di bawah docs/openapi.','Ya, ada di repositori di folder docs/openapi.'],
['Dirwan','One more thing: what happens if the same request is sent twice?','Satu lagi: apa berlaku jika permintaan sama dihantar dua kali?','Satu lagi: apa yang terjadi kalau request yang sama dikirim dua kali?'],
['Aisyah','Hmm, right now it creates two orders. That’s probably a bug.','Hmm, sekarang ia mencipta dua pesanan. Itu mungkin pepijat.','Hmm, sekarang membuat dua order. Itu mungkin bug.'],
['Dirwan','I think so. Should we use an idempotency key?','Saya rasa begitu. Patutkah kita guna kunci idempoten?','Kurasa begitu. Perlukah kita pakai idempotency key?'],
['Aisyah','Good idea. I’ll add it, and you can write a test for it.','Idea yang baik. Saya akan tambah, dan awak boleh tulis ujian untuknya.','Ide bagus. Aku tambahkan, dan kamu tulis tesnya.'],
['Dirwan','Deal. I’ll create a ticket so we don’t forget.','Setuju. Saya cipta tiket supaya kita tidak lupa.','Setuju. Kubuat tiket supaya tidak lupa.']]},
{ cat:'dev', title:'Rencana deployment dan code freeze', ctx:'Rapat singkat Daniel, Ali, dan Dirwan sehari sebelum rilis.', l:[
['Daniel','Are we ready for tomorrow’s release?','Adakah kita sedia untuk keluaran esok?','Apakah kita siap untuk rilis besok?'],
['Ali','All features are merged. Code freeze starts at five today.','Semua ciri sudah digabungkan. Pembekuan kod bermula pukul lima hari ini.','Semua fitur sudah di-merge. Code freeze mulai jam lima hari ini.'],
['Dirwan','The regression suite passed, but two tests were flaky on Safari.','Suit regresi lulus, tetapi dua ujian tidak stabil di Safari.','Regression suite lolos, tapi dua tes flaky di Safari.'],
['Daniel','Are they real bugs or test problems?','Adakah ia pepijat sebenar atau masalah ujian?','Itu bug sungguhan atau masalah tes?'],
['Dirwan','I checked the traces. It’s a timing issue in the test, not in the app.','Saya semak surih. Ia isu masa dalam ujian, bukan dalam aplikasi.','Aku cek trace-nya. Itu masalah timing di tes, bukan di aplikasi.'],
['Daniel','Good. What’s the deployment plan?','Bagus. Apakah pelan atur gerak?','Bagus. Bagaimana rencana deployment-nya?'],
['Ali','We deploy to staging at eight, then production at ten with a canary release.','Kami atur gerak ke staging pukul lapan, kemudian produksi pukul sepuluh dengan keluaran kenari.','Kami deploy ke staging jam delapan, lalu produksi jam sepuluh dengan canary release.'],
['Dirwan','I’ll run the smoke tests right after each deployment.','Saya akan jalankan ujian asap sejurus selepas setiap atur gerak.','Aku jalankan smoke test langsung setelah setiap deployment.'],
['Daniel','And if something goes wrong?','Dan jika ada masalah?','Dan kalau ada yang salah?'],
['Ali','We roll back. It takes about five minutes.','Kita undur semula. Ia ambil masa lebih kurang lima minit.','Kita rollback. Butuh sekitar lima menit.'],
['Daniel','Perfect. Dirwan, please share the go/no-go summary by nine.','Bagus. Dirwan, sila kongsi ringkasan teruskan atau hentikan sebelum pukul sembilan.','Sempurna. Dirwan, tolong bagikan ringkasan go/no-go sebelum jam sembilan.'],
['Dirwan','Will do. I’ll post it in the release channel.','Baik. Saya akan siarkan dalam saluran keluaran.','Siap. Akan kuposting di channel rilis.']]},
{ cat:'work', title:'Meminta cuti kepada manajer', ctx:'Dirwan meminta cuti tiga hari untuk pulang ke Jakarta.', l:[
['Dirwan','Hi Daniel, do you have a few minutes?','Hai Daniel, ada masa beberapa minit?','Hai Daniel, ada waktu beberapa menit?'],
['Daniel','Sure, what’s up?','Boleh, ada apa?','Tentu, ada apa?'],
['Dirwan','I’d like to take three days of leave next month to visit my family in Jakarta.','Saya mahu ambil cuti tiga hari bulan depan untuk melawat keluarga di Jakarta.','Saya ingin cuti tiga hari bulan depan untuk mengunjungi keluarga di Jakarta.'],
['Daniel','Which dates are you thinking of?','Tarikh mana yang awak fikirkan?','Tanggal berapa yang kamu pikirkan?'],
['Dirwan','From the twelfth to the fourteenth. The release is on the eighth, so it won’t clash.','Dari dua belas hingga empat belas. Keluaran pada lapan haribulan, jadi ia tidak bertembung.','Dari tanggal dua belas sampai empat belas. Rilisnya tanggal delapan, jadi tidak bentrok.'],
['Daniel','That works. Who will cover your tasks?','Itu boleh. Siapa yang akan ganti tugasan awak?','Bisa. Siapa yang akan menggantikan tugasmu?'],
['Dirwan','I’ve asked Aisyah to monitor the nightly runs, and I’ll leave a handover note.','Saya sudah minta Aisyah pantau larian malam, dan saya akan tinggalkan nota serahan.','Saya sudah minta Aisyah memantau run malam, dan akan kutinggalkan catatan serah terima.'],
['Daniel','Great planning. Please submit it in the HR system.','Perancangan yang bagus. Sila hantar dalam sistem HR.','Perencanaan bagus. Silakan ajukan di sistem HR.'],
['Dirwan','I will. Thank you so much.','Baik. Terima kasih banyak.','Baik. Terima kasih banyak.'],
['Daniel','Enjoy your time with your family.','Selamat bercuti bersama keluarga.','Selamat menikmati waktu bersama keluarga.']]},
{ cat:'work', title:'Stand-up dengan hambatan', ctx:'Daily stand-up. Dirwan terhambat karena environment staging mati.', l:[
['Daniel','Let’s start. Ali, you go first.','Mari mula. Ali, awak dahulu.','Ayo mulai. Ali, kamu duluan.'],

['Dirwan','Today I planned to retest the voucher fix, but I’m blocked: staging has been down since eight.','Hari ini saya rancang uji semula pembaikan baucar, tetapi saya tersekat: staging terputus sejak pukul lapan.','Hari ini aku berencana retest perbaikan voucher, tapi aku terhambat: staging mati sejak jam delapan.'],
['Daniel','Has anyone reported it to DevOps?','Ada sesiapa laporkan kepada DevOps?','Sudah ada yang melapor ke DevOps?'],

['Dirwan','Thanks. Meanwhile, I’ll test the fix locally with Ali.','Terima kasih. Sementara itu, saya akan uji pembaikan itu secara setempat dengan Ali.','Makasih. Sementara itu, aku tes perbaikannya secara lokal bersama Ali.'],

function speakAsync(text, l, slow) {
  return new Promise(res => {
    if (!window.speechSynthesis) return res();
    const u = utter(text, l, slow); let done = false;
    const fin = () => { if (!done) { done = true; res(); } };
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, 1500 + strip(text).length * (slow ? 120 : 85));
    speechSynthesis.speak(u);

}

const toks = s => s.trim().split(/\s+/);
function scrambleCard(sentence, l, trans, onResult) {
  const c = el('div', 'card scr');
  const orig = toks(sentence);
  let pool = orig.map((w, i) => ({ w, i }));
  for (let k = 0; k < 6; k++) { pool = shuffle(pool); if (pool.some((p, j) => p.i !== j)) break; }
  let picked = [], done = false;
  c.innerHTML = '<div class="drill-top"><span class="chip ' + l + '">' + flag(l) + LANG[l].short + '</span><span class="muted">Susun kata menjadi kalimat</span></div>' + (trans ? '<p class="scr-hint">“' + esc(trans) + '”</p>' : '') +
    '<div class="scr-ans" aria-live="polite"></div><div class="scr-pool"></div><div class="row center"><button class="btn ghost small" data-act="reset">↺ Ulang</button><button class="btn ghost small" data-act="hint">💡 Petunjuk</button><button class="btn" data-act="check">Periksa</button></div><div class="scr-res"></div>';
  const ans = $('.scr-ans', c), pl = $('.scr-pool', c), res = $('.scr-res', c);
  const draw = () => {
    ans.innerHTML = picked.length ? '' : '<span class="muted small">Ketuk kata di bawah sesuai urutan</span>';
    picked.forEach((p, k) => { const b = el('button', 'wchip on', esc(p.w)); b.onclick = () => { if (done) return; picked.splice(k, 1); draw(); }; ans.append(b); });
    pl.innerHTML = '';
    pool.forEach(p => { const used = picked.includes(p); const b = el('button', 'wchip' + (used ? ' used' : ''), esc(p.w)); b.disabled = used || done; b.onclick = () => { picked.push(p); draw(); }; pl.append(b); });
  };
  draw();
  $('[data-act=reset]', c).onclick = () => { if (done) return; picked = []; draw(); };
  $('[data-act=hint]', c).onclick = () => { if (done) return; const k = picked.findIndex((p, j) => p.w !== orig[j]); const pos = k === -1 ? picked.length : k; picked = picked.slice(0, pos); const nxt = pool.find(p => !picked.includes(p) && p.w === orig[pos]); if (nxt) picked.push(nxt); draw(); };

    if (done) return;
    if (picked.length < orig.length) { toast('Masih ada kata yang belum dipakai.'); return; }
    done = true;
    const ok = picked.map(p => p.w).join(' ') === orig.join(' ');

    res.innerHTML = '<div class="feedback ' + (ok ? 'ok' : 'bad') + '"><b>' + (ok ? 'Urutan tepat!' : 'Belum tepat') + '</b><span>' + esc(sentence) + ' <button class="round ghost sm" aria-label="Dengar">▶</button></span></div>';
    $('button', res).onclick = () => speak(sentence, l);
    speak(sentence, l);

    onResult && onResult(ok);
    pl.querySelectorAll('button').forEach(b => b.disabled = true);
  };
  return c;
}

/* ===== Pengaturan tambahan versi website ===== */
(function () {
  const code = document.getElementById('f-code');
  if (code) { code.value = localStorage.getItem('kk-ai-code') || ''; code.addEventListener('change', () => { localStorage.setItem('kk-ai-code', code.value.trim()); }); }
  const ex = document.getElementById('f-export');
  if (ex) ex.onclick = e => {
    e.preventDefault();
    const blob = new Blob([JSON.stringify({ app: 'kata-kerja', exportedAt: new Date().toISOString(), progress: JSON.parse(localStorage.getItem(LS_KEY) || '{}'), ai: JSON.parse(localStorage.getItem(AI_KEY) || '{}') })], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'kata-kerja-progres-' + todayStr() + '.json'; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  const im = document.getElementById('f-import');
  if (im) im.onchange = async () => {
    const f = im.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (d.app !== 'kata-kerja' || !d.progress) throw new Error('format');
      if (!confirm('Ganti progres di perangkat ini dengan isi file cadangan?')) return;
      localStorage.setItem(LS_KEY, JSON.stringify(d.progress)); if (d.ai) localStorage.setItem(AI_KEY, JSON.stringify(d.ai));
      location.reload();
    } catch (e) { alert('File cadangan tidak valid.'); }
    finally { im.value = ''; }
  };
  if ('serviceWorker' in navigator && location.protocol !== 'file:') window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
